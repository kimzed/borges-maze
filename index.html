// joins indexed geometries that have the same attributes into one
function mergeGeometries(geos) {
  const names = Object.keys(geos[0].attributes);
  let nv = 0, ni = 0;
  for (const g of geos) { nv += g.attributes.position.count; ni += g.index.count; }
  const arrays = names.map(n => new Float32Array(nv * geos[0].attributes[n].itemSize));
  const index = new Uint32Array(ni);
  let ov = 0, oi = 0;
  for (const g of geos) {
    names.forEach((n, k) => arrays[k].set(g.attributes[n].array, ov * g.attributes[n].itemSize));
    const gi = g.index.array;
    for (let k = 0; k < gi.length; k++) index[oi + k] = gi[k] + ov;
    ov += g.attributes.position.count; oi += gi.length;
  }
  const m = new THREE.BufferGeometry();
  names.forEach((n, k) => m.setAttribute(n, new THREE.BufferAttribute(arrays[k], geos[0].attributes[n].itemSize)));
  m.setIndex(new THREE.BufferAttribute(index, 1));
  return m;
}

,["Juan Mura\u00f1a","Brodie's Report",1970],["The Elderly Lady","Brodie's Report",1970],["The Duel","Brodie's Report",1970],["The Other Duel","Brodie's Report",1970],["Guayaquil","Brodie's Report",1970],["The Gospel According to Mark","Brodie's Report",1970],["Brodie's Report","Brodie's Report",1970],["The Other","The Book of Sand",1975],["Ulrikke","The Book of Sand",1975],["The Congress","The Book of Sand",1975],["There Are More Things","The Book of Sand",1975],["The Sect of the Thirty","The Book of Sand",1975],["The Night of the Gifts","The Book of Sand",1975],["The Mirror and the Mask","The Book of Sand",1975],["\"Undr\"","The Book of Sand",1975],["A Weary Man's Utopia","The Book of Sand",1975],["The Bribe","The Book of Sand",1975],["Avelino Arredondo","The Book of Sand",1975],["The Disk","The Book of Sand",1975],["The Book of Sand","The Book of Sand",1975],["Afterword","The Book of Sand",1975],["August 25, 1983","Shakespeare's Memory",1983],["Blue Tigers","Shakespeare's Memory",1983],["The Rose of Paracelsus","Shakespeare's Memory",1983],["Shakespeare's Memory","Shakespeare's Memory",1983]],"pages":[[[1,135,"I would define the baroque as that style that deliberately exhausts (or tries to exhaust) its own possibilities, and that borders on selfcaricature. In vain did Andrew Lang attempt, in the eighteen-eighties, to imitate Pope's Odyssey; it was already a parody, and so defeated the parodist's attempt to exaggerate its tautness. \"Baroco\" was a term used for one of the modes of syllogistic reasoning; the eighteenth century applied it to certain abuses in seventeenth-century architecture and painting. I would venture to say that the baroque is the final stage in all art, when art flaunts and squanders its resources. The baroque is intellectual, and Bernard Shaw has said that all intellectual labor is inherently humorous. This humor is unintentional in the works of Baltasar Gradan but intentional, even indulged, in the works of John Donne."],[15,93,"There is no intellectual exercise that is not ultimately pointless. A philosophical doctrine is, at first, a plausible description of the universe; the years go by, and it is a mere chapter\u2014if not a paragraph or proper noun\u2014in the history of philosophy. In literature, that \"falling by the wayside,\" that loss of \"relevance,\" is even better known. The Quixote, Menard remarked, was first and foremost a pleasant book; it is now an occasion for patriotic toasts, grammatical arrogance, obscene deluxe editions. Fame is a form \u2014 perhaps the worst form \u2014 of incomprehension."],[18,160,"I have quoted Quain's modest opinion of himself; naturally, that modesty did not define the boundaries of his thinking. Flaubert and Henry James have managed to persuade us that works of art are few and far between, and maddeningly difficult to compose, but the sixteenth century (we should recall the Voyage to Parnassus, we should recall the career of Shakespeare) did not share that disconsolate opinion. Nor did Herbert Quain. He believed that \"great literature\" is the commonest thing in the world, and that there was hardly a conversation in the street that did not attain those \"heights.\" He also believed that the aesthetic act must contain some element of surprise, shock, astonishment\u2014and that being astonished by rote is difficult, so he deplored with smiling sincerity \"the servile, stubborn preservation of past and bygone books.\"... I do not know whether that vague theory of his is justifiable or not; I do know that his books strive too greatly to astonish."]],[[1,91,"In that text, which is written in the accents of the toughs and petty criminals of the Buenos Aires underworld, the reader will note that I have interpolated a number of \u201ccultured\u201d words - entrails, conversion, etc. I did this because the tough, the knife fighter, the thug, the type that Buenos Aires calls the compadre or compadrito, aspires to refinement, or (and this reason excludes the other, but it may be the true one) because compadres are individuals and don't always talk like The Compadre, which is a Platonic ideal."],[5,116,"Whether profiled against a backdrop of bluepainted walls or of the sky it-self, two toughs sheathed in grave black clothing dance, in boots with high-stacked heels, a solemn dance\u2014the tango of evenly matched knives\u2014until suddenly, a carnation drops from behind an ear, for a knife has plunged into a man, whose horizontal dying brings the dance without music to its end. Resigned, the other man adjusts his hat and devotes the years of his old age to telling the story of that clean-fought duel. That, to the least and last de-tail, is the story of the Argentine underworld. The story of the thugs and ruffians of New York has much more speed, and much less grace."],[87,45,"\"Somebody lent me your book on Carriego,\" he said. \"It's full of knife fighters and thugs and underworld types. Tell me, Borges,\" he said, looking at me as though stricken with holy terror, \"what can you know about knife fighters and thugs and underworld types?\""]],[[1,75,"Gallows and pirates fill its pages, and that word iniquity strikes awe in its title, but under all the storm and lightning, there is nothing. It is all just appearance, a surface of images\u2014 which is why readers may, perhaps, enjoy it. The man who made it was a pitiable sort of creature, but he found amusement in writing it; it is to be hoped that some echo of that pleasure may reach its readers."],[4,147,"Miserable and injurious men, men who stamp upon bread, men who ignore the outcry of tax collectors and orphans, men whose smallclothes bear the figure of the phoenix and the dragon, men who deny the truth of printed books, men who let their tears flow facing North\u2014such men disturb the happiness of our rivers and the erstwhile trustworthiness of our seas. Day and night, their frail and crippled ships defy the tempest. Their object is not a benevolent one: they are not, and never have been, the sea-man's bosom friend. Far from lending aid, they fall upon him with ferocity, and make him an unwilling guest of ruin, mutilation, and even death. Thus these men violate the natural laws of the Universe, and their offenses make rivers overflow their banks and flood the plains, sons turn against their fathers, the principles of wetness and dryness exchange places\u2026"],[20,85,"I listened with honourable veneration to those ancient fictions, which were themselves perhaps not as remarkable as the fact that a man of my blood had invented them and a man of a distant empire was restoring them to me on an island in the West in the course of a desperate mission. I recall the final words, repeated in each version like some secret commandment: \"Thus the heroes fought, their admirable hearts calm, their swords violent, they themselves resigned to killing and to dying.\""],[31,183,"The text says, inter alia: \"In Bikanir I have taught astrology, as I have in Bohemia.\" None of those statements is false; what is significant is the fact of their having been chosen to record. The first seems to befit a man of war, but then one sees that the narrator pays little attention to the war, much more to the fate of the men. The \"facts\" that follow are even more curious. A dark yet elemental reason led me to put them to paper: I knew they were pathetic. They are not pathetic when narrated by the Roman Flaminius Rufus; they are when narrated by Homer. It is odd that Homer, in the thirteenth century, should have copied down the adventures of Sindbad\u2014another Ulysses\u2014and again after many hundreds of years have discovered forms like those of his own Iliad in a northern kingdom and a barbaric tongue. As for the sentence that contains the name \"Bikanir,\" one can see that it has been composed by a man of letters desirous (like the author of the catalog of ships) of wielding splendid words.2"]],[[2,67,"Apart from the mother-child relationship, kinship was conventional and murky; the slaves had given names, but not always surnames. They did not know how to read. Their soft falsetto voices sang an English of drawn-out vowels. They worked in rows, stooped under the overseer's lash. They would try to escape, and men with full beards would leap astride beautiful horses to hunt them down with baying dogs."],[31,281,"The Troglodyte's lowly birth and condition recalled to my memory the image of Argos, the moribund old dog of the Odyssey, so I gave him the name Argos, and tried to teach it to him. Time and time again, I failed. No means I employed, no severity, no obstinacy of mine availed. Motionless, his eyes dead, he seemed not even to perceive the sounds which I was attempting to imprint upon him. Though but a few paces from me, he seemed immensely distant. Lying in the sand like a small, battered sphinx carved from lava, he allowed the heavens to circle in the sky above him from the first dusky light of morning to the last dusky light of night. It seemed simply impossible that he had not grasped my intention. I recalled that it is generally believed among the Ethiopians that monkeys deliberately do not speak, so that they will not be forced to work; I attributed Argos' silence to distrust or fear. From that vivid picture I passed on to others, even more extravagant. I reflected that Argos and I lived our lives in separate universes; I reflected that our perceptions were identical but that Argos combined them differently than I, constructed from them different objects; I reflected that perhaps for him there were no objects, but rather a constant, dizzying play of swift impressions. I imagined a world without memory, without time; I toyed with the possibility of a language that had no nouns, a language of impersonal verbs or indeclinable adjectives. In these reflections many days went by, and with the days, years. Until one morning, something very much like joy occurred\u2014the sky rained slow, strong rain."],[70,71,"It all began with the suspicion (perhaps exaggerated) that the gods were unable to talk. Centuries of a feral life of flight had atrophied that part of them that was human; the moon of Islam and the cross of Rome had been implacable with these fugitives. Beetling brows, yellowed teeth, the sparse beard of a mulatto or a Chinaman, and beastlike dewlaps were testaments to the degeneration of the Olympian line."]],[[2,198,"The daguerreotypes printed in American magazines are not actually of Morell. That absence of a genuine likeness of a man as memorable and famous as Morell cannot be coincidental. It is probably safe to assume that Morell refused to sit for the silvered plate\u2014 essentially, so as to leave no pointless traces; incidentally, so as to enhance his mystery.... We do know, however, that he was not particularly good-looking as a young man and that his closeset eyes and thin lips did not conspire in his favor. The years, as time went on, imparted to him that peculiar majesty that white-haired blackguards, successful (and unpunished) criminals, seem generally to possess. He was a Southern gentleman of the old school, in spite of his impoverished childhood and his shameful life. He was not ignorant of the Scriptures, and he preached with singular conviction. \"I once saw Lazarus Morell in the pulpit,\" wrote the owner of a gambling house in Baton Rouge, \"and I heard his edifying words and saw the tears come to his eyes. I knew he was a fornicator, a nigger-stealer, and a murderer in the sight of the Lord, but tears came to my eyes too.\""],[3,155,"In Sydney he made the acquaintance of a man named Ebenezer Bogle, a Negro servant. Bogle, though not handsome, had that reposeful and monumental air, that look of wellengineered solidity, often possessed by a black man of a certain age, a certain corporeal substance, a certain authority. Bogle had another quality, as well\u2014though some textbooks in anthropology deny the attribute to his race: he was possessed of genius. (We shall see the proof of that soon enough.) He was a temperate, decent man, the ancient African appetites in him corrected by the customs and excesses of Calvinism. Aside from the visitations from his god (which we shall describe below), he was normal in every way; his only eccentricity was a deep-seated and shamefaced fear that made him hesitate at street corners and at crossings, survey east, west, north, and south, and try to outguess the violent vehicle that he was certain would end his days."],[22,249,"I recall him (though I have no right to speak that sacred verb\u2014only one man on earth did, and that man is dead) holding a dark passionflower in his hand, seeing it as it had never been seen, even had it been stared at from the first light of dawn till the last light of evening for an entire life-time. I recall him\u2014his taciturn face, its Indian features, its extraordinary remoteness \u2014behind the cigarette. I recall (I think) the slender, leatherbraider's fingers. I recall near those hands a mate cup, with the coat of arms of the Banda Oriental. I recall, in the window of his house, a yellow straw blind with some vague painted lake scene. I clearly recall his voice\u2014the slow, resentful, nasal voice of the toughs of those days, without the Italian sibilants one hears today. I saw him no more than three times, the last time in 1887. I applaud the idea that all of us who had dealings with the man should write something about him; my testimony will perhaps be the briefest (and certainly the slightest) account in the volume that you are to publish, but it can hardly be the least impartial. Unfortunately I am Argentine, and so congenitally unable to produce the dithyramb that is the obligatory genre in Uruguay, especially when the subject is an Uruguayan. Highbrow, dandy, city slicker \u2014Funes did not utter those insulting words, but I know with reasonable certainty that to him I represented those misfortunes."],[47,186,"Beatriz was tall, fragile, very slightly stooped; in her walk, there was (if I may be pardoned the oxymoron) something of a graceful clumsiness, a soup\u00e7on of hesitancy, or of palsy; Carlos Argentinois a pink, substantial, gray-haired man of refined features. He holds some sort of subordinate position in an illegible library in the outskirts toward the south of the city; he is authoritarian, though also ineffectual; until very recently he took advantage of nights and holidays to remain at home. At two generations' remove, the Italians and the liberal Italian gesticulation still survive in him. His mental activity is constant, passionate, versatile, and utterly insignificant. He is full of pointless analogies and idle scruples. He has (as Beatriz did) large, beautiful, slender hands. For some months he labored under an obsession for Paul Fort, less for Fort's ballads than the idea of a glory that could never be tarnished. \"He is the prince of the poets of la belle France\" he would fatuously say. \"You assail him in vain; you shall never touch him\u2014not even the most venomous of your darts shall ever touch him.\""]],[[2,170,"The river was a natural highway. A canoe, the hold of a riverboat, a barge, a raft as big as the sky with a pilothouse on the bow or with a roof of canvas sheeting... the place didn't matter; what mattered was knowing that you were moving, and that you were safe on the unwearying river.... They would sell him on another plantation. He would run away again, to the sugarcane fields or the gullies. And it would be then that the fearsome and terrible benefactors (whom he was beginning to distrust by now) would bring up obscure \"expenses\" and tell him they had to sell him one last time. When he escaped the next time, they told him, they'd give him his percentage of the two sales, and his liberty. The man would let himself be sold, he would work for a while, and then he would risk the dogs and whips and try to escape on his own. He would be brought back bloody, sweaty, desperate, and tired."],[94,38,"I had wanted to throw the coin he gave me in the river. The arc of the silver coin disappearing into the silver river would have lent my story a vivid image, but fate would not have it."],[105,140,"I've not seen the other side of the woods, either. My older brother, when we were boys he made me swear that between the two of us we'd hack away at this woods till there wasn't a tree left standing. My brother is dead now, and now it's something else I'm after, and always will be. Over in the direction where the sun goes down there's a creek I fish in with my hands. There are wolves in the woods, but the wolves don't scare me, and my ax has never failed me. I've not kept track of how old I am, but I know I'm old\u2014my eyes don't see anymore. Down in the village, which I don't venture into anymore because I'd lose my way, everyone says I'm a miser, but how much could a woodcutter have saved up?"]],[[2,196,"All this was calculated to leave Morell's mind at ease, but not forever. The Negro could talk; the Negro was capable, out of pure gratitude or misery, of talking. A few drinks of rye whisky in a whorehouse in Cairo, Illinois, where the slaveborn son of a bitch went to squander some of those silver dollars burning a hole in his pocket (and that they'd no reason to give him, when it came right down to it), and the cat would be out of the bag. The Abolitionist Party was making things hot in the North during this time\u2014a mob of dangerous madmen who denied a man's right to his own property, preached the freeing of the blacks, and incited the slaves to rebellion. Morell was not about to let himself be confused with those anarchists. He was no Yankee, he was a Southerner, a white man, the son and grandson of white men, and he hoped someday to retire from his business and be a gentleman and possess his own league upon league of cotton fields and his own bow-backed rows of slaves. With his experience, he was not a man to take point-less risks."],[84,177,"Ferrari had me sit at his left; don El\u00edseo had to change seats. I was nervous. I was afraid Ferrari would make some allusion to the unfortunate incident of a few days before, you see. But nothing of the sort happened; they talked about women, cards, elections, an itinerant singer that was supposed to come but never did\u2014the things going on in the neighborhood. At first it was hard for them to swallow the little red-haired Jewish kid; they finally did, though, because Ferrari wanted it that way. In spite of their names, which were mostly Italian, they all felt themselves (and were felt to be) native Argentines, even gauchos. Some were teamsters or cart drivers, and there may even have been a butcher; their work with animals gave them a bond with the country people. I suspect that they wished more than anything that they had been born Juan Moreira. They wound up calling me Little Sheeny, but there was no contempt in the nickname. I learned from those men how to smoke, and other things."],[85,155,"In Mor\u00f3n, and later on in the neighborhood too, I gradually won my bosses' trust. The police and the party gradually spread the word that I was a man to be reckoned with; I was an important cog in the wheels of the elections in Buenos Aires, and out in the province too. Elections were fierce back then; I won't bore you, se\u00f1or, with stories about the blood that would be shed. I did all I could to make life hard on the radicals, though to this day they're still riding on Alem's coattails. But as I say, there was no man that didn't show me respect. I got myself a woman, La Lujanera we called her, and a handsome copper sorrel. For years I pretended to be some kind of Moreira\u2014who in his day was probably imitating some other stage show gaucho. I played a lot of cards and drank a lot of absinthe...."]],[[2,78,"The runaway expected his freedom. Therefore, the nebulous mulattoes of Lazarus Morell would give a sign (which might have been no more than a wink) and the runaway would be freed from sight, hearing, touch, daylight, iniquity, time, benefactors, mercy, air, dogs, the universe, hope, sweat\u2014and from himself. A bullet, a low thrust with a blade, a knock on the head, and the turtles and catfish of the Mississippi would be left to keep the secret among themselves."],[4,53,"Marked cards and loaded dice, drinking and fan-tan, the visions of the opium pipe and little lamp filled idle hours. Two swords, simultaneously employed, were the weapon of choice. Before a boarding, the pirates would sprinkle their cheeks and bodies with garlic water, a sure charm against injury by fire breathed from muzzles."],[74,88,"In earlier times, the bullet had been other things, because Pythagorean metempsychosis is not reserved for humankind alone. It was the silken cord given to viziers in the East, the rifles and bayonets that cut down the defenders of the Alamo, the triangular blade that slit a queen's throat, the wood of the Cross and the dark nails that pierced the flesh of the Redeemer, the poison kept by the Carthaginian chief in an iron ring on his finger, the serene goblet that Socrates drank down one evening."]],[[2,70,"Among those who took the oath, there was one young man, Virgil Stewart, from Arkansas, who very soon distinguished himself by his cruelty. This boy was the nephew of a gentleman who had lost a great number of slaves. In August of 1834, he broke his vow and denounced Morell and the others. Morell's house in New Orleans was surrounded by the authorities, but Morell somehow (owing to some oversight"],[3,114,"On the 27th of February, 1874, Arthur Orton (alias Tom Castro) was sentenced to fourteen years' penal servitude. In gaol he made himself beloved by all; it was his lifework. His exemplary behavior won him a reduction of four years off his sentence. When that final hospitality\u2014the prison's\u2014ran out on him, he wandered the towns and villages of the United Kingdom, giving lectures in which he would alternately declare his innocence and confess his guilt. His modesty and his desire to please remained with him always; many nights he would begin by defending himself and wind up admitting all, depending upon the inclinations of his audience. On the 2nd of April, 1898, he died."],[24,105,"On August 2, 1824, the conspirators met. The country was ripe for rebellion; something, however, always went awry\u2014there must have been a traitor within the inner circle. Fergus Kilpatrick had given James Nolan the job of ferreting out the identity of this traitor, and Nolan had carried out his mission. He announced to the gathered comrades that the traitor was Kilpatrick himself. He proved the truth of his accusation beyond the shadow of a doubt, and the men at the council that night condemned their leader to death. The leader signed his own death sentence, but he pleaded that his punishment not harm the cause."]],[[2,134,"Three days passed. Morell hid for that period in an old house with vine-covered courtyards and statues, on Toulouse Street. Apparently he had almost nothing to eat and spent his days roaming barefoot through the large, dark rooms, smoking a thoughtful cheroot. Through a slave in the house, he sent two letters to Natchez and another to Red River. On the fourth day, three men entered the house; they sat talking things over with Morell until almost daybreak. On the fifth day, Morell got out of bed at nightfall, borrowed a razor, and carefully shaved off his beard. He then dressed and left the house. Slowly and calmly he made his way through the northern outskirts of the city. When he reached open country, out in the bottomlands of the Mississippi, he breathed easier."],[7,71,"He moved to Kioto, a city unparalleled throughout the empire for the color of its autumns. He allowed himself to descend into the depths of brothels, gambling dens, and taverns. In spite of the gray hairs of his head, he consorted with prostitutes and poets, and with persons even worse. Once he was expelled from a tavern and woke up to find himself in the street, his head covered with vomit."],[77,46,"In the city, he was homesick for those first evenings on the prairie when, long ago, he had been homesick for the city. He made his way to his professor's office and told him that he knew the secret, but had resolved not to reveal it."]],[[2,168,"\"I walked four days,\" he reported, \"and no opportunity offered for me to get a horse. The fifth day, I had stopped at a creek to get some water and rest a while. While I was sitting on a log, looking down the road the way that I had come, a man came in sight riding on a good-looking horse. The very moment I saw him, I was determined to have his horse.... I arose and drew an elegant rifle pistol on him and ordered him to dismount. He did so, and I took his horse by the bridle and pointed down the creek, and ordered him to walk before me. He went a few hundred yards and stopped. I... made him undress himself, all to his shirt and drawers, and ordered him to turn his back to me. He said, 'If you are determined to kill me, let me have time to pray before I die.' I told him I had no time to hear him pray."],[20,232,"Outside the window were the usual rooftops and the overcast six o'clock sun. I found it incredible that this day, lacking all omens and premonitions, should be the day of my implacable death. Despite my deceased father, despite my having been a child in a symmetrical garden in Hai Feng\u2014was I, now, about to die? Then I reflected that all things happen to oneself, and happen precisely, precisely now. Century follows century, yet events occur only in the present; countless men in the air, on the land and sea, yet everything that truly happens, happens to me.... The almost unbearable memory of Madden's horsey face demolished those mental ramblings. In the midst of my hatred and my terror (now I don't mind talking about terror\u2014now that I have foiled Richard Madden, now that my neck hungers for the rope), it occurred to me that that brawling and undoubtedly happy warrior did not suspect that I possessed the Secret\u2014the name of the exact location of the new British artillery park on the Ancre. A bird furrowed the grey sky, and I blindly translated it into an aeroplane, and that aeroplane into many (in the French sky), annihilating the artillery park with vertical bombs. If only my throat, before a bullet crushed it, could cry out that name so that it might be heard in Germany.... But my human voice was so terribly inadequate."],[23,148,"On the tenth, the city fell once and forever into the hands of the Black and Tans. Highsitting, silent horsemen patrolled their beats; there was ash and smoke in the wind. I saw a dead body sprawled on one corner\u2014yet that dead body is less vivid in my memory than the dummy that the soldiers endlessly practised their marksmanship on in the middle of the city square.... I had gone out when dawn was just streaking the sky; before noon, I was back. Moon was in the library, talking to someone; I realized from the tone of his voice that he was speaking on the telephone. Then I heard my name; then, that I'd be back at seven, and then, that I'd be arrested as I came across the lawn. My rational friend was rationally selling me out. I heard him demand certain guarantees of his own safety."],[109,87,"I waited until the next morning. When the rice had been consumed and the tea drunk down, I broached my subject. Despite the previous night's experience, I did not understand\u2014was incapable of understanding\u2014 what took place then. The entire village looked at me with stupefaction, almost with terror, but when I told them that my purpose was to capture the beast with the curious skin, they seemed almost relieved at my words. One of them said he had seen the animal at the edge of the jungle."]],[[3,33,"Tichborne had been a slim, genteel young man with a reserved and some-what selfabsorbed air. He had sharp features, straight black hair, tawny skin, sparkling eyes, and an irritatingly precise way of speaking."],[91,168,"With republican simplicity, I opened the door to Dr. Zimmermann myself and led him toward my private study. He paused to look at the patio; the black and white tiles, the two magnolia trees, and the wellhead drew his admiration. He was, I think, a bit nervous. There was nothing particularly striking about him; he was a man in his forties with a rather large head. His eyes were hidden by dark glasses, which he would occasionally lay on the table and then put back on again. When we shook hands, I noted with some satisfaction that I was the taller, but I was immediately ashamed of my smugness, since this was not to be a physical or even spiritual duel, but simply a mise au point, a \"getting down to brass tacks,\" as some might say, though perhaps a rather uncomfortable one. I am a poor observer, but I do recall what a certain poet once called, with ugliness befitting the thing described, his \"inelegant sartorial arrangements.\""],[97,71,"My first step was to go and see Alexander Muir. I remembered him as a ramrod-straight, dark man whose leanness did not rule out strength; now he was stooped with years and his jet black beard was gray. He greeted me at the door of his house in Temperley\u2014which predictably enough resembled my uncle's, as both houses conformed to the solid rules of the good poet and bad builder William Morris."],[109,30,"A beggar was standing beside me. In the soft light I could make out his turban, his sightless eyes, his sallow skin, his gray beard. He was not very tall."]],[[3,134,"The trial lasted one hundred ninety days. Some hundred witnesses swore that the accused was Roger Charles Tichborne\u2014among them, four comrades-at-arms from the 6th Dragoons. Orton's supporters steadfastly maintained that he was no impostor\u2014had he been, they pointed out, he would surely have attempted to copy the juvenile portraits of his model. And besides, Lady Tichborne had recognized and accepted him; clearly, in such matters, a mother does not err. All was going well, then\u2014more or less\u2014 until an old sweetheart of Orton's was called to testify. Not a muscle of Bogle's face twitched at that perfidious maneuver by the \"family\"; he called for his black umbrella and his top hat and he went out into the decorous streets of London to seek a third inspiration. We shall never know whether he found it."],[5,200,"Kelly, who recognized that politicians were better than all the Colts ever made when it came to dissuading the police from their duty, immediately saw the light; Eastman, with the arrogance of his great stupid body, was spoiling for more grudge fights and more bullets. At first, he wouldn't hear of a truce, but the politicos threatened him with prison. Finally the two illustrious thugs were brought together in a downtown dive; each man had a cigar clenched in his teeth, his right hand on his gun, and his watchful swarm of armed bodyguards hovering nearby. They came to a very American sort of decision\u2014they would let the dispute be settled by a boxing match. Kelly was a skilled boxer. The match took place in an old barn, and it was stranger than fiction. One hundred forty spectators watched\u2014toughs in cocked derby hats and women in \"Mikado tuck-ups,\" the high-piled, delicate hairdos of the day. The fight lasted two hours, and it ended in utter exhaustion. Within a week, gunshots were crackling again. Monk was arrested, for the umpteenth time. The police, relieved, derived great amusement from his arrest; the judge prophesied for him, quite correctly, ten years in prison."],[46,74,"\"The accused man accepted the judge,\" was the reply. \"Perhaps he realized that given the fate that awaited the conspirators if they should set him free, it was only from a madman that he might hope for anything but a sentence of death. I have heard that he laughed when he was told who the judge was to be. The trial lasted for many days and nights, because of the great number of witnesses.\""]],[[4,36,"Therefore, I commend thee to the punishment of these crimes, Admiral Kwo-Lang. Never forget\u2014clemency is the Emperor's to give; the Emperor's subject would be presumptuous in granting it. Be cruel, be just, be obeyed, be victorious."],[93,64,"They affirm the efficacy of punishment and reward. They represent, in a word, culture, just as we do, in spite of our many sins. I do not regret having fought in their ranks against the Apemen. We have the obligation to save them. I hope Her Majesty's government will not turn a deaf ear to the remedy this report has the temerity to suggest."],[98,32,"This criminal violation of the Fifth Commandment should be met with the severity that human and divine laws have ever demanded. May the curses of the Firmament, may the hatred of angels..."]],[[4,257,"Then the six hundred junks of war and the haughty widow's forty thousand victorious pirates sailed into the mouth of the Zhu-Jiang River, sowing fire and appalling celebrations and orphans left and right. Entire villages were razed. In one of them, the prisoners numbered more than a thousand. One hundred twenty women who fled to the pathless refuge of the nearby stands of reeds or the paddy fields were betrayed by the crying of a baby, and sold into slavery in Macao. Though distant, the pathetic tears and cries of mourning from these depredations came to the notice of Chia-Ch'ing, the Son of Heaven. Certain historians have allowed themselves to believe that the news of the ravaging of his people caused the emperor less pain than did the defeat of his punitive expedition. Be that as it may, the emperor organized a second expedition, terrible in banners, sailors, soldiers, implements of war, provisions, soothsayers and astrologers. This time, the force was under the command of Admiral Ting-kwei-heu. The heavy swarm of ships sailed into the mouth of the Zhu- Jiang to cut off the pirate fleet. The widow rushed to prepare for battle. She knew it would be hard, very hard, almost desperate; her men, after many nights (and even months) of pillaging and idleness, had grown soft. But the battle did not begin. The sun peacefully rose and without haste set again into the quivering reeds. The men and the arms watched, and waited. The noontimes were more powerful than they, and the siestas were infinite."],[34,305,"Perhaps for one instant the two women saw that they were sisters; they were far from their beloved island in an incredible land. My grandmother, enunciating carefully, asked some question or other; the other woman replied haltingly, searching for the words and then repeating them, as though astonished at the old taste of them. It must have been fifteen years since she'd spoken her native language, and it was not easy to recover it. She said she was from Yorkshire, that her parents had emigrated out to Buenos Aires, that she had lost them in an Indian raid, that she had been carried off by the Indians, and that now she was the wife of a minor chieftain\u2014she'd given him two sons; he was very brave. She said all this little by little, in a clumsy sort of English interlarded with words from the Araucan or Pampas tongue, and behind the tale one caught glimpses of a savage and uncouth life: tents of horsehide, fires fueled by dung, celebrations in which the people feasted on meat singed over the fire or on raw viscera, stealthy marches at dawn; the raid on the corrals, the alarm sounded, the plunder, the battle, the thundering roundup of the stock by naked horsemen, polygamy, stench, and magic. An Englishwoman, reduced to such barbarism! Moved by outrage and pity, my grandmother urged her not to go back. She swore to help her, swore to rescue her children. The other woman answered that she was happy, and she returned that night to the desert. Francisco Borges was to die a short time later, in the Revolution of '74; perhaps at that point my grandmother came to see that other woman, torn like herself from her own kind and transformed by that implacable continent, as a monstrous mirror of her own fate...."],[93,255,"I have already related how I came to the land of the Yahoos. The reader will recall that they surrounded me, that I fired a rifle shot in the air, and that they took the report for some sort of magical thunder. In order to keep that error alive, I made it a point never to walk about armed. But one spring morning just at daybreak, we were suddenly invaded by the Apemen; I ran down from my plateau, weapon in hand, and killed two of those beasts. The rest fled in terror. Bullets, of course, work invisibly. For the first time in my life, I heard myself applauded. It was then, I believe, that the queen received me. The Yahoos' memory is not to be depended upon; that same afternoon I left. My adventures in the jungle are of no concern; I came at last upon a village of black men, who were acquainted with plowing, sowing, and praying, and with whom I could make myself understood in Portuguese. A Romish missionary, Padre Fernandes, took me most hospitably into his cabin and cared for me until I was able to continue my painful journey. At first it caused me some revulsion to see him undisguisedly open his mouth and put food in. I would cover my eyes with my hands, or avert them; in a few days I regained my old custom. I recall with pleasure our debates on theological questions. I could not persuade him to return to the true faith of Jesus."]],[[7,134,"At times the magisterial tone of his voice bordered on the insolent. His student, the lord of the castle of Ako, affected to ignore these affronts; he could find no suitable reply, and discipline forbade the slightest violence. One morning, however, the ribbon on the courtier's sock came untied, and he requested that the lord of the castle of Ako tie it up for him again. This gentleman did so, humbly yet with inward indignation. The uncivil teacher of court etiquette told him that he was truly incorrigible\u2014only an ill-bred country bumpkin was capable of tying a knot as clumsily as that. At these words, the lord of the castle of Ako drew his sword and slashed at the uncivil courtier, who fled\u2014the graceful flourish of a delicate thread of blood upon his forehead\u2026"],[20,315,"Furthermore, I know of a man of England\u2014a modest man\u2014who in my view is no less a genius than Goethe. I spoke with him for no more than an hour, but for one hour he was Goethe-----No\u2014I did it because I sensed that the Leader looked down on the people of my race\u2014the countless ancestors whose blood flows through my veins. I wanted to prove to him that a yellow man could save his armies. And I had to escape from Madden. His hands, his voice, could beat upon my door at any moment. I silently dressed, said goodbye to myself in the mirror, made my way downstairs, looked up and down the quiet street, and set off. The train station was not far from my flat, but I thought it better to take a cab. I argued that I ran less chance of being recognized that way; the fact is, I felt I was visible and vulnerable\u2014 infinitely vulnerable\u2014in the deserted street. I recall that I told the driver to stop a little ways from the main entrance to the station. I got down from the cab with willed and almost painful slowness. I would be going to the village of Ash grove, but I bought a ticket for a station farther down the line. The train was to leave at eight-fifty, scant minutes away. I had to hurry; the next train would not be until nine-thirty. There was almost no one on the platform. I walked through the cars; I recall a few workmen, a woman dressed in mourning weeds, a young man fervently reading Tacit us' Annals, and a cheerful-looking wounded soldier. The train pulled out at last. A man I recognised ran, vainly, out to the end of the platform; it was Capt. Richard Madden. Shattered, trembling, I huddled on the other end of the seat, far from the feared window."],[101,142,"\"The smith offered me shelter for the night. His name, he said, was Orm, and his language was more or less our own. We exchanged a few words. It was from his lips that I first heard the name of the king who then ruled over them\u2014 Gunnlaug. I learned that he had fought in their last war, that he looked with suspicion upon foreigners, and that it was his custom to crucify them. In order to avoid that fate, which was more fitting for a God than for a man, I undertook to write a drapa, a laudatory composition\u2014 a sort of eulogy praising the king's victories, his fame, and his mercy. No sooner had I committed the poem to memory than two men came for me. I refused to relinquish my sword, but I allowed myself to be led away."]],[[7,106,"Kira K\u00f4tsuk\u00e9no Suk\u00e9, the ignominious cause of all that loyalty, was nowhere to be found. The attackers sought him through every corner of the emotion-torn palace; they were beginning to despair of finding him, when the councillor noted that his bedclothes were still warm. Again the R\u00f4nins searched, and soon they discovered a narrow window, hidden by a bronze mirror. Below, in a gloomy courtyard, a man in white looked up at them; a trembling sword was in his right hand. When they rushed down, the man gave himself up without a fight. His forehead bore a scar\u2014the old rubric left by Takumi no Kami's blade."],[9,165,"Meantime, what was happening with Rosendo\u2014why hadn't he come out slashing at that swaggering son of a bitch? He hadn't said a word yet, hadn't so much as raised his eyes. His cigarette, I don't know whether he spit it out or whether it just fell out of his face. Finally he managed to get a few words out, but so quiet that those of us down at the other end of the room couldn't hear what he was saying. Then Francisco Real called him out again, and again Rosendo refused to rise to the occasion. So at that, the youngest of the strangers\u2014just a kid he was\u2014he whistled. La Lujanera looked at him with hate in her eyes and she started through that crowd with her braid down her back\u2014 through that crowd of men and whores\u2014and she walked up to her man and she put her hand to his chest and she pulled out his naked blade and she handed it to him."],[36,245,"Sitting before Aaron Loewenthal, Emma felt (more than the urgency to avenge her father) the urgency to punish the outrage she herself had suffered. She could not not kill him, after being so fully and thoroughly dishonored. Nor did she have time to waste on theatrics. Sitting timidly in his office, she begged Loewenthal's pardon, invoked (in her guise as snitch) the obligations entailed by loyalty, mentioned a few names, insinuated others, and stopped short, as though overcome by fearfulness. Her performance succeeded; Loewenthal went out to get her a glass of water. By the time he returned from the dining hall, incredulous at the woman's fluttering perturbation yet full of solicitude, Emma had found the heavy revolver in the drawer. She pulled the trigger twice. Loewenthal's considerable body crumpled as though crushed by the explosions and the smoke; the glass of water shattered; his face looked at her with astonishment and fury; the mouth in the face cursed her in Spanish and in Yiddish. The filthy words went on and on; Emma had to shoot him again. Down in the courtyard, the dog, chained to his post, began barking furiously, as a spurt of sudden blood gushed from the obscene lips and sullied the beard and clothes. Emma began the accusation she had prepared (\"I have avenged my father, and I shall not be punished...\") but she didn't finish it, because Sr. Loewenthal was dead. She never knew whether he had managed to understand."]],[[7,49,"This is the end of the story of the forty-seven loyal retainers\u2014except that the story has no ending, because we other men, who are perhaps not loyal yet will never entirely lose the hope that we might one day be so, shall continue to honor them with our words."],[31,98,"Among the Immortals, on the other hand, every act (every thought) is the echo of others that preceded it in the past, with no visible beginning, and the faithful presage of others that will repeat it in the future, advertiginem. There is nothing that is not as though lost between indefatigable mirrors. Nothing can occur but once, nothing is preciously in peril of being lost. The elegiac, the somber, the ceremonial are not modes the Immortals hold in reverence. Homer and I went our separate ways at the portals of Tangier; I do not think we said good-bye."],[58,44,"To say good-bye is to deny separation; it is to say Today we play at going our own ways, but we'll see each other tomorrow. Men invented farewells because they somehow knew themselves to be immortal, even while seeing themselves as contingent and ephemeral."]],[[8,168,"Hakim was raised in that wearied city. We know that one of his father's brothers trained him as a dyer\u2014the craft, known to be a refuge for infidels and impostors and inconstant men, which inspired the first anathemas of his extravagant career. My face is of gold, a famous page of the Annihilation says, but I have steeped the purple dye and on the second night have plunged the un-carded wool into it, and on the third night have saturated the prepared wool, and the emperors of the islands still contend for that bloody cloth. Thus did I sin in the years of my youth, deforming the true colors of the creatures. The Angel would tell me that lambs were not the color of tigers, while Satan would say to me that the All-Powerful One desired that they be, and in that pursuit he employed my cunning and my dye. Now I know that neither the Angel nor Satan spoke the truth, for I know that a\u00fccoloris abominable."],[10,360,"\"It is true that I suffered captivity in the fortress of Yakub the Afflicted, due to the conspiracy forged by my brother Ibrahim, with the vain and perfidious aid of the black chieftains of Kordofan, who betrayed him. My brother perished by the sword upon the bloody pelt of justice, but I threw myself at the abominated feet of the Afflicted One and told him I was a sorcerer, and that if he granted me my life I would show him forms and appearances more marvelous than those of the fanusi jihal, the magic lantern. The tyrant demanded an immediate proof; I called for a reed pen, a pair of scissors, a large sheet of Venetian paper, an inkhorn, a chafing-dish with live charcoal in it, a few coriander seeds, and an ounce of benzoin. I cut the paper into six strips and wrote charms and invocations upon the first five; on the last I inscribed the following words from the glorious Qur'an: 'We have removed from thee thy veil, and thy sight is piercing.' Then I drew a magic square in Yakub's right palm and asked him to hold it out to me; into it, I poured a circle of ink. I asked him whether he could see his face in the circle, and he told me that he could see it clearly. I instructed him not to raise his eyes. I put the benzoin and the coriander seeds into the chafing-dish and therein also burned the invocations. I asked the Afflicted One to name the figure that he wished to see. He thought for a moment and told me that he wished to see a wild horse, the most beautiful creature that grazed upon the meadows that lie along the desert. He looked, and he saw first green and peaceful fields and then a horse coming toward him, as graceful as a leopard and with a white star upon its forehead. He then asked me for a herd of such horses, as perfect as the first, and he saw upon the horizon a long cloud of dust, and then the herd. I sensed that my life was safe."],[41,194,"The painter, a fakir, had died many years before, in that same cell; he had come from Sind or perhaps Gujarat and his initial purpose had been to draw a map of the world. Of that first purpose there remained some vestiges within the monstrous image. Taylor told this story to Muhammad al-Yemeni, of Fort William; al-Yemeni said that there was no creature in the world that did not tend toward becoming a Zaheer,1 [lThis is Taylor's spelling of the word.] but that the All-Merciful does not allow two things to be a Zaheer at the same time, since a single one is capable of entrancing multitudes. He said that there is always a Zahir\u2014in the Age of Ignorance it was the idol called Yahuk, and then a prophet from Khorasan who wore a veil spangled with precious stones or a mask of gold. 2 [2 Barlach observes that Yahuk figures in the Qur'an (71:23) and that the prophet is al-Moqanna (the Veiled Prophet) and that no one, with the exception of the surprising correspondent Philip Meadows Taylor, has ever linked those two figures to the Zahir.] He also noted that Allah was inscrutable."],[43,419,"\"The words, he said, that Ibn-Hakam had stood in his study\u2014not sat, mind you, but stood \u2014and spoken to him were these, or words very similar: 'There is no longer any man who can contemn what I do. The sins that bring dishonor to my name are so terrible that even should I repeat the Ultimate Name of God for century upon century I would not succeed in mitigating even one of the torments that shall be mine; the sins that bring dishonor to my name are so terrible that even should I kill you with these very hands, that act would not increase the torments to which infinite Justice has destined me. There is no land ignorant of my name; I am Ibn-Hakam al-Bokhari, and I have ruled the tribes of the desert with an iron scepter. For many years with the aid of my cousin Sa'\u00efd I plundered those tribes, but God hearkened to their cries and suffered them to rise against me. My men were crushed and put to the knife. I managed to flee with the treasure I had hoarded up through my years of pillaging. Sa'\u00efd led me to the sepulcher of a saint, which lay at the foot of a stone mountain. I ordered my slave man to stand watch over the face of the desert; Sa'\u00efd and I, exhausted, lay down to sleep. That night I dreamt that I was imprisoned within a nest of vipers. I awoke in horror; beside me, in the morning light, Sa'\u00efd lay sleeping; the brush of a spiderweb against my skin had caused me to dream that dream. It pained me that Sa'\u00efd, who was a coward, should sleep so soundly. I reflected that the treasure was not infinite, and that he might claim a part of it. In my waistband was my dagger with its silver handle; I unsheathed it and drew it across his throat. As he died he stammered out a few words that I could not understand. I looked at him; he was dead, but I feared that he might yet stand, so I ordered my slave to crush his face with a stone. After that, we wandered under the heavens until one day we glimpsed a sea, with tall ships furrowing its waves. The thought came to me that a dead man cannot travel across the water, so I resolved to seek out other lands. The first night that we were upon the ocean I dreamt that I was murdering Sa'\u00efd."]],[[8,95,"At the end of the moon of Sha'ban in the year 158, the air of the desert was very clear, and a group of men were looking toward the west in expectation of the moon of Ramadan, which inspires fasting and mortification. They were slaves, beggars, horse sellers, camel thieves, and butchers. Sitting gravely on the ground before the gate of an inn at which caravans stopped on the road to Merv, they awaited the sign. They looked at the setting sun, and the color of the setting sun was the color of the sand."],[40,141,"\"One evening, the Muslim merchants of Sin-i Kalal conducted me to a house of painted wood in which many persons lived. It is not possible to describe that house, which was more like a single room, with rows of cabinet-like contrivances, or balconies, one atop another. In these niches there were people eating and drinking; there were people sitting on the floor as well, and also on a raised terrace. The people on this terrace were playing the tambour and the lute\u2014all, that is, save some fifteen or twenty who wore crimson masks and prayed and sang and conversed among themselves. These masked ones suffered imprisonment, but no one could see the jail; they rode upon horses, but the horse was not to be seen; they waged battle, but the swords were of bamboo; they died, and then they walked again.\""],[46,76,"By the time I arrived, the sun had pretty well gone down. The neighborhood was one of common folk, the humble of the earth; the house was squat. From the walkway in the street I could make out a series of courtyards of packed earth and then, toward the rear, a brightness. Back in the last courtyard, some sort of Muslim celebration was going on; a blind man entered with a lute made of reddish-colored wood."]],[[8,31,"Someone (as in the tales of the Thousand and One Nights) asked the reason for this wonder. They are blind, the masked man said, because they have looked upon my face."],[40,33,"No one understood, no one seemed to want to understand. Abu-al-Hasan, in some confusion, swerved from the tale he had been telling them into inept explanation. Aiding himself with his hands, he said:"],[46,58,"\"A madman,\" he repeated, \"so that the wisdom of God might speak through his mouth and bring shame to human pride and overweening. The name of this man has been lost, or perhaps was never known, but he wandered these streets naked, or covered with rags, counting his fingers with his thumb and hurling gibes at the trees.\""],[100,57,"Not without dismay did the king look upon the poet: he was greatly changed. Something, which was not simply time, had furrowed and transformed his features. His eyes seemed to stare far into the distance, or to have been rendered blind. The poet begged to be allowed to speak to the king. The slaves cleared the hall."]],[[8,223,"The historian of the Abbasids relates that the man from the desert (whose voice was extraordinarily sweet, or so, in contrast to the harshness of the mask, it seemed to be) told the men that though they were awaiting the sign of a month of penitence, he would be for them a greater sign: the sign of an entire life of penitence, and a calumniated death. He told them that he was Hakim, son of Ozman, and that in the year 146 of the Flight a man had entered his house and after purifying himself and praying had cut his, Hakim's, head off with a scimitar and taken it up to the heavens. Borne in the right hand of this visitor (who was the angel Gabriel), his head had been taken before the Almighty, who had bade him prophesy, entrusting him with words of such antiquity that speaking them burned one's mouth and endowed one with such glorious resplendence that mortal eyes could not bear to look upon it. That was the reason for his mask. When every man on earth professed the new law, the Visage would be unveiled to them, and they would be able to worship it without danger\u2014as the angels did already. His message delivered, Hakim exhorted the men to jihad \u2014a holy war\u2014and the martyrdom that accompanied it."],[10,381,"\"Thus did we come to the morning of the fourteenth day of the moon of Barmajat. The circle of ink had been poured into the palm, the benzoin sprinkled into the chafing-dish, the invocations burned. The two of us werealone. The Afflicted One commanded me to show him a just and irrevocable punishment, for that day his heart craved to see a death. I showed him soldiers with tambours, the stretched hide of a calf, the persons fortunate enough to look on, the executioner with the sword of justice. The Afflicted One marvelled to see this, and said to me: It is Abu Kir, the man that slew thy brother Ibrahim, theman that will close thy life when I am able to command the knowledge to convoke these figures without thy aid. He asked me to bring forth the condemned man, yet when he was brought forth the Afflicted One grew still, because it was the enigmatic man that kept the white cloth always before his visage. The Afflicted One commanded me that before the man was killed, his mask should be stripped from him. I threw myself at his feet and said: O king of time and substance and peerless essence of the century, this figure is not like the others, for we know not his name nor that of his fathers nor that of the city which is his homeland. Therefore, O king, I dare not touch him, for fear of committing a sin for which I shall be held accountable. The Afflicted One laughed and swore that he himself would bear the responsibility for the sin, if sin it was. He swore this by his sword and by the Qur'an. Then it was that I commanded that the condemned man be stripped naked and bound to the stretched hide of the calf and his mask removed from him. Those things were accomplished; the horrified eyes of Yakub at last saw the visage\u2014 which was his own face. In fear and madness, he hid his eyes. I held in my firm right hand his trembling hand and commanded him to look upon the ceremony of his death. He was possessed by the mirror; he did not even try to turn his eyes aside, or to spill out the ink."],[14,415,"I believe I am correct in saying that if an author is to pull off such a plot, he is under two obligations: First, he must invent a variety of prophetic signs; second, he must not allow the hero prefigured by those signs to become a mere phantasm or convention. Bahadur meets the first obligation; I am not sure to what extent he meets the second. In other words: The unheard and unseen Al-Mu'tasim should impress us as being a real person, not some jumble of vapid superlatives. In the 1932 version of the novel, the supernatural notes are few and far between; \"the man called Al-Mu'tasim\" has his touch of symbolism, but he possesses idiosyncratic personal traits as well. Unfortunately, that commendable literary practice was not to be followed in the second edition. In the 1934 version\u2014the edition I have before me even now\u2014the novel sinks into allegory: Al-Mu'tasim is an emblem of God, and the detailed itineraries of the hero are somehow the progress of the soul in its ascent to mystical plenitude. There are distressing details: A black Jew from Cochin, describing Al-Mu'tasim, says that his skin is dark; a Christian says that he stands upon a tower with his arms outspread; a red lama recalls him as seated \"like that image which I carved from yak ghee and worshipped in the monastery at Tashilhumpo.\" Those declarations are an attempt to suggest a single, unitary God who molds Himself to the dissimilarities of humankind. In my view, that notion is not particularly exciting. I cannot say the same for another idea, however: the idea that the Almighty is also in search of Someone, and that Someone, in search of a yet superior (or perhaps simply necessary, albeit equal) Someone, and so on, to the End\u2014or better yet, the Endlessness\u2014of Time. Or perhaps cyclically. The etymological meaning of \"Al-Mu'tasim\" (the name of that eighth Abbasid king who won eight battles, engendered eight sons and eight daughters, left eight thousand slaves, and reigned for a period of eight years, eight moons, and eight days) is \"He who goes in quest of aid.\" In the 1932 version of the novel, the fact that the object of the pilgrimage was himself a pilgrim cleverly justified the difficulty of finding Al-Mu'tasim; in the 1934 edition, that fact leads to the extravagant theology I have described. Mir Bahadur Ali, as we have seen, is incapable of resisting that basest of art's temptations: the temptation to be a genius."],[41,399,"Between the covers of that book was a description of my illness. The introduction said that the author proposed to \"gather into a single manageable octavo volume every existing document that bears upon the superstition of the Zahir, including four articles held in the Habicht archives and the original manuscript of Philip Meadows Taylor's report on the subject.\" Belief in the Zahir is of Islamic ancestry, and dates, apparently, to sometime in the eighteenth century. (Barlach impugns the passages that Zotenberg attributes to Abul-Feddah.) In Arabic, \"zahir\" means visible, manifest, evident; in that sense, it is one of the ninety-nine names of God; in Muslim countries, the masses use the word for \"beings or things which have the terrible power to be unforgettable, and whose image eventually drives people mad.\" Its first undisputed witness was the Persian polymath and dervish Lutf Ali Azur; in the corroborative pages of the biographical encyclopedia titled Temple of Fire, Ali Azur relates that in a certain school in Shiraz there was a copper astrolabe \"constructed in such a way that any man that looked upon it but once could think of nothing else, so that the king commanded that it be thrown into the deepest depths of the sea, in order that men might not forget the universe.\" Meadows Taylor's account is somewhat more extensive; the author served the Nazim of Hyderabad and composed the famous novel Confessions of a Thug. In 1832, on the outskirts of Bhuj, Taylor heard the following uncommon expression used to signify madness or saintliness: \"Verily he has looked upon the tiger.\" He was told that the reference was to a magic tiger that was the perdition of all who saw it, even from a great distance, for never afterward could a person stop thinking about it. Someone mentioned that one of those stricken people had fled to Mysore, where he had painted the image of the tiger in a palace. Years later, Taylor visited the prisons of that district; in the jail at Nighur, the governor showed him a cell whose floor, walls, and vaulted ceiling were covered by a drawing (in barbaric colors that time, before obliterating, had refined) of an infinite tiger. It was a tiger composed of many tigers, in the most dizzying of ways; it was crisscrossed with tigers, striped with tigers, and contained seas and Himalayas and armies that resembled other tigers."]],[[8,71,"Someone had brought a leopard\u2014perhaps a member of that lithe and bloodthirsty breed trained by Persian huntsmen. At any rate, it broke free of its cage. Save for the masked Prophet and his two acolytes, all the men there trampled one another in their haste to flee. When they returned, the beast was blind. In the presence of those luminous, dead eyes, the men worshiped Hakim and admitted his supernatural estate."],[14,540,"Its visible protagonist, whose name we are never told, is a law student in Bombay. In the most blasphemous way he has renounced the Islamic faith of his parents, but as the tenth night of the moon of Muharram wanes he finds himself at the center of a riot, a street battle between Muslims and Hindus. It is a night of tambours and invocations; through the inimical multitude, the great paper baldachins of the Muslim procession make their way. A Hindu brick flies from a rooftop nearby; someone buries a dagger in a belly; someone\u2014a Muslim? a Hindu?\u2014dies and is trampled underfoot. Three thousand men do battle\u2014cane against revolver, obscenity against imprecation, God the indivisible against the gods. In a sort of daze, the free-thinking law student enters the fray. With desperate hands, he kills (or thinks he has killed) a Hindu. Thundering, horseborne, half asleep, the Sirkar police intervene with impartial lashes of their crops. Virtually under the hooves of the horses, the student makes his escape, fleeing toward the outermost suburbs of the city. He crosses two railroad tracks, or twice crosses the same track. He scales the wall of an unkempt garden, which has a circular tower toward the rear. A \"lean and evil mob of moon-coloured hounds\" emerges from the black rosebushes. Fearing for his life, the law student seeks refuge in the tower. He climbs an iron ladder\u2014some rungs are missing\u2014and on the flat roof, which has a pitch-black hole in the center, he comes upon a filthy man squatting in the moonlight, pouring forth a vigorous stream of urine. This man confides to the law student that it is his profession to steal the gold teeth from the cadavers the Farsees bring, swaddled in white, to that tower. He makes several further gruesome remarks and then he mentions that it has been fourteen nights since he purified himself with ox dung. He speaks with obvious anger about certain Gujarati horse thieves, \"eaters of dog meat and lizard meat\u2014men, in a word, as vile as you and I.\" The sky is growing light; there is a lowering circle of fat vultures in the air. The law student, exhausted, falls asleep; when he awakens, the sun now high, the thief has disappeared. A couple of cigarettes from Trichinopolis have also disappeared, as have a few silver rupees. In the face of the menace that looms from the previous night, the law student decides to lose himself in India. He reflects that he has shown himself capable of killing an idolater, yet incapable of knowing with any certainty whether the Muslim possesses more of truth than the idolater does. The name Gujarat has remained with him, as has that of a malkasansi (a woman of the caste of thieves) in Palanpur, a woman favored by the imprecations and hatred of the corpse-robber. The law student reasons that the wrath and hatred of a man so thoroughly despicable is the equivalent of a hymn of praise. He resolves, therefore, though with little hope, to find this woman. He performs his prayers, and then he sets out, with sure, slow steps, on the long path. That brings the reader to the end of the second chapter of the book."],[46,140,"Having said this, he got up. I felt that his words dismissed me, that from that moment onward I had ceased to exist for him. A mob of men and women of all the nations of Punjab spilled out over us, praying and singing, and almost swept us away; I was astonished that such narrow courtyards, little more than long entryways, could have contained such numbers of people. Others came out of neighboring houses; no doubt they had jumped over the walls.... Pushing and shouting imprecations, I opened a way for myself. In the farthest courtyard I met a naked man crowned with yellow flowers, whom everyone was kissing and making obeisances to; there was a sword in his hand. The sword was bloody, for it had murdered Glencairn, whose mutilated body I found in the stables at the rear."],[93,54,"She looked at me, smelled me, and touched me, and then\u2014in full sight of her attendants\u2014 she offered herself to me. My cloth and my habits caused me to decline that honor, which is one granted generally to the witch doctors and to the slave hunters (usually Muslims) whose caravans pass through the kingdom."],[109,141,"I was greeted upon my arrival by the elders, with whom I sustained a tentative conversation constructed of vague courtesies. I have mentioned the poverty of the place, but I know that it is an axiom of every man's belief that the land he lives in and owes his allegiance to possesses some unique distinction, and so I praised in glowing terms the dubious habitations and the no less dubious delicacies served me, and I declared that the fame of that region had reached Lahore. The expressions on the men's faces changed; I immediately sensed that I had committed a faux pas I might come to regret. I sensed that these people possessed a secret they would not share with a stranger. Perhaps they worshiped the blue tiger, perhaps they were devotees of a cult that my rash words had profaned."]],[[8,80,"Hakim's military operations (like those of another, more fortunate Prophet) were limited to his tenor chanting of prayers offered up to the Deity from the hump of a reddish-colored camel in the chaotic heart of battle. Arrows would whistle all around him, yet he was never wounded. He seemed to seek out danger\u2014the night a band of loathsome lepers surrounded his palace, he had them brought to him, he kissed them, and he made them gifts of gold and silver."],[10,157,"In the fifth, they found a marvelous mirror, great and round, of mixed metals, which had been made for Suleyman, son of David\u2014on the twain be forgiveness!\u2014wherein whoso looked might see the counterfeit presentment of his parents and his children, from the first Adam to those who shall hear the Trumpet. The sixth room was filled with that hermetic powder, one drachma of which elixir can change three thousand drachms of silver into three thousand drachms of gold. The seventh appeared empty, and it was so long that the ablest of the king's archers might have loosed an arrow from its doorway without hitting the distant wall. Carved on that far wall, they saw a terrible inscription. The king examined it, and understood it, and it spoke in this wise: \"If any hand opens the gate of this castle, the warriors of flesh at the entrance, who resemble warriors of metal, shall take possession of the kingdom.\""],[101,141,"\"The smith was not allowed to enter. There were armed men inside, all standing. Gunnlaug, the king, who was suffering under some great affliction, was lying with half-closed eyes upon a kind of dais; his pallet was of camel skins. He was a worn, yellow man, a sacred and almost forgotten object; long, time-blurred scars made a tracery across his chest. One of the soldiers made way for me. Someone had brought a harp. I knelt and softly intoned the drapa. It was adorned with the tropes, alliterations, and accents required by the genre. I am not certain that the king understood it, but he gave me a silver ring, which I still possess. Under his pillow I glimpsed the blade of a dagger. To his right there was a chessboard of a hundred or more squares and several scattered pieces."]],[[8,58,"The earth we inhabit is an error, an incompetent parody. Mirrors and paternity are abominable because they multiply and affirm it. Revulsion, disgust, is the fundamental virtue, and two rules of conduct (between which the Prophet left men free to choose) lead us to it: abstinence and utter licentiousness\u2014the indulgence of the flesh or the chastening of it."],[76,143,"This, as I said, is my fifth book of poetry. It is reasonable to assume that it will be no better or worse than the others. To the mirrors, labyrinths, and swords that my resigned reader will already have been prepared for have been added two new subjects: old age and ethics. Ethics, as we all know, was a constant preoccupation of a certain dear friend that literature brought me, Robert Louis Stevenson. One of the virtues that make me prefer Protestant nations to Catholic ones is their concern for ethics. Milton tried to educate the children in his academy in the knowledge of physics, mathematics, astronomy, and natural sciences; in the mid-seventeenth century Dr. Johnson was to observe that \"Prudence and justice are pre-eminences and virtues which belong to all times and all places; we are perpetually moralists and only sometimes geometers.\""],[98,67,"The first thing which drew my attention was the diversity of their opinion with respect to the dead. The most unschooled among them believe that they shall be buried by the spirits of those who have left this life; others, who do not cleave so tight to the letter, say that Jesus' admonition Let the dead bury the dead condemns the showy vanity of our funerary rites."],[102,76,"\"Yes. One. It is not advisable that the human race be too much encouraged. There are those who think that awareness of the universe is a faculty that comes from the deity, yet no one knows for a certainty whether this deity exists. I believe that what is being discussed now is the advantages and disadvantages of the gradual or simultaneous suicide of every person on earth. But let us return to the matter at hand.\""]],[[8,109,"First, there came a trembling. The promised face of the Apostle, the face which had journeyed to the heavens, was indeed white, but it was white with the whiteness of leprosy. It was so swollen (or so incredible) that it seemed to be a mask. It had no eyebrows; the lower eyelid of the right eye drooped upon the senile cheek; a dangling cluster of nodular growths was eating away its lips; the flat and inhuman nose resembled that of a lion. Hakim's voice attempted one final deception: Thy abominable sins forbid thee to look upon my radiance..., he began. No one was listening; he was riddled with spears."],[16,152,"At first, his dreams were chaotic; a little later, they became dialectical. The foreigner dreamed that he was in the center of a circular amphitheater, which was somehow the ruined temple; clouds of taciturn students completely filled the terraces of seats. The faces of those farthest away hung at many centuries' distance and at a cosmic height, yet they were absolutely clear. The man lectured on anatomy, cosmography, magic; the faces listened earnestly, intently, and attempted to respond with understanding\u2014as though they sensed the importance of that education that would redeem one of them from his state of hollow appearance and insert him into the real world. The man, both in sleep and when awake, pondered his phantasms' answers; he did not allow himself to be taken in by impostors, and he sensed in certain perplexities a growing intelligence. He was seeking a soul worthy of taking its place in the universe."],[50,192,"Gradually, the splendid universe began drawing away from him; a stub-born fog blurred the lines of his hand; the night lost its peopling stars, the earth became uncertain under his feet. Everything grew distant, and indistinct. When he learned that he was going blind, he cried out. (\"Stoicism\" had not yet been invented, and Hector could flee without selfdiminution.) Now (he felt) I will not be able to see the sky filled with mythological dread or this face that the years will transfigure. Days and nights passed over this despair of his flesh, but one morning he awoke, looked (with calm now) at the blurred things that lay about him, and felt, inexplicably, the way one might feel upon recognizing a melody or a voice, that all this had happened to him before and that he had faced it with fear but also with joy and hopefulness and curiosity. Then he descended into his memory, which seemed to him endless, and managed to draw up from that vertigo the lost remembrance that gleamed like a coin in the rain\u2014perhaps because he had never really looked at it except (perhaps) in a dream."],[81,117,"However odd it may seem, he never suspected the truth; it burst upon him suddenly. He realized that he was unable to remember the shapes, sounds, and colors of his dreams; there were no shapes, colors, or sounds, nor were the dreams dreams. They were his reality, a reality beyond silence and sight, and therefore beyond memory. This realization threw him into even greater consternation than the fact that from the hour of his death he had been struggling in a whirlwind of senseless images. The voices he'd heard had been echoes; the faces he'd seen had been masks; the fingers of his hands had been shadows\u2014vague and insubstantial, true, yet also dear to him, and familiar."]],[[9,265,"Because I met the man, even if this wa'n't exactly his stomping ground\u2014his was more up in the north, up around Guadalupe Lake and Bater\u00eda. Truth is, I doubt if I crossed paths with the man more than three times, and all three were on a single night\u2014though it's not one I'll be likely ever to forget. It was the night La Lujanera came home to sleep at my place\u2014just like that, just up and came\u2014and the same night Rosendo Ju\u00e1rez left Maldonado never to return. Of course you probably haven't had the experience you'd need to recognize that particular individual's name, but in his time Rosendo Ju\u00e1rez\u2014the Sticker, they called him\u2014 was one of the toughest customers in Villa Santa Rita. He was fierce with a knife, was Rosendo Ju\u00e1rez, as you'd expect with a moniker like that, and he was one of don Nicol\u00e1s Paredes' men\u2014don Nicol\u00e1s being one of Morel's men. He'd come into the cathouse just as dandified as you can imagine, head to foot in black, with his belt buckle and studs and all of silver. Men and dogs, both, had a healthy respect for him, and the whores did too; everybody knew two killings'd been laid to him already. He wore a tall sort of hat with a narrow brim, which sat down like this on a long mane of greasy hair. Rosendo was favored by fortune, as they say, and we boys in the neighborhood would imitate him right down to the way he spit. But then there came a night that showed us Rosendo Juarez's true colors."],[85,117,"\"You've heard of me, sir, though we've never met,\" the man began, \"but I know you. My name is Rosendo Ju\u00e1rez. It was Nicol\u00e1s Paredes, no doubt, God rest his soul, that told you about me. That old man was something. I'll tell you\u2014the stories he'd tell... Not so as to fool anyone, of course\u2014just to be entertaining. But since you and I are here with nothing else on our hands just now, I'd like to tell you what really happened that night... the night the Yardmaster was murdered. You've put the story in a novel, sir\u2014 and I'm hardly qualified to judge that novel\u2014but I want you to know the truth behind the lies you wrote.\""],[90,90,"How and why had the hatred between those two men begun? How, a century or more later, can we recover the shadowy story of those two men whose only fame was earned in their final duel? There was a man named Laderecha\u2014an overseer at Reyles' father's ranch, \"with a mustache like a tiger's\"\u2014who had gleaned from \"oral tradition\" certain details that I shall recount; I set them down here for what they are worth and with no further assurances as to their veracity, since both forgetfulness and recollection are creative."],[96,50,"The man with the knife went on into the whorehouse. I was told later that his name was Tapia or Paredes or something of the sort, and that he was a famous troublemaker. Out on the sidewalk, Irala, who'd been calm
