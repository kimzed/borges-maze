talgia, even after so many centuries). Ialso devoted some time to a study of the analytical language of John Wilkins, in which the definition of each word is contained in the letters that constitute it. It was under the high dome of the reading room that I met Beatrice."]],[[19,458,"Infidels claim that the rule in the Library is not \"sense,\" but \"nonsense,\" and that \"rationality\" (even humble, pure coherence) is an almost miraculous exception. They speak, I know, of \"the feverish Library, whose random volumes constantly threaten to transmogrify into others, so that they affirm all things, deny all things, and confound and confuse all things, like some mad and hallucinating deity.\" Those words, which not only proclaim disorder but exemplify it as well, prove, as all can see, the infidels' deplorable taste and desperate ignorance. For while the Library contains all verbal structures, all the variations allowed by the twenty-five orthographic symbols, it includes not a single absolute piece of nonsense. It would be pointless to observe that the finest volume of all the many hexagons that I myself administer is titled Combed Thunder, while another is titled The Plaster Cramp, and another, Axaxaxasmio. Those phrases, at first apparently incoherent, are undoubtedly susceptible to cryptographic or allegorical \"reading\"; that reading, that justification of the words' order and existence, is itself verbal and, ex hypothesis, already contained somewhere in the Library. There is no combination of characters one can make\u2014 dhcmrlchtdj, for example\u2014that the divine Library has not foreseen and that in one or more of its secret tongues does not hide a terrible significance. There is no syllable one can speak that is not filled with tenderness and terror, that is not, in one of those languages, the mighty name of a god. To speak is to commit tautologies. This pointless, verbose epistle already exists in one of the thirty volumes of the five bookshelves in one of the countless hexagons\u2014as does its refutation. (A number n of the possible languages employ the same vocabulary; in some of them, the symbol \"library\" possesses the correct definition \"everlasting, ubiquitous system of hexagonal galleries,\" while a library\u2014 the thing\u2014is a loaf of bread or a pyramid or something else, and the six words that define it themselves have other definitions. You who read me\u2014are you certain you understand my language?) Methodical composition distracts me from the present condition of humanity. The certainty that everything has already been written annuls us, or renders us phantasmal. I know districts in which the young people prostrate themselves before books and like savages kiss their pages, though they cannot read a letter. Epidemics, heretical discords, pilgrimages that inevitably degenerate into brigandage have decimated the population. I believe I mentioned the suicides, which are more and more frequent every year. I am perhaps misled by old age and fear, but I suspect that the human species\u2014 the only species\u2014teeters at the verge of extinction, yet that the Library\u2014 enlightened, solitary, infinite, perfectly unmoving, armed with precious volumes, pointless, incorruptible, and secret\u2014 will endure."],[33,207,"That particular article of faith was denied by other sects, which re-joined that the history of the world must be acted out in every man. Most men, like Pythagoras, will have to transmigrate through many bodies before obtaining their liberation; some, the Proteans, \"within the period of a single life are lions, dragons, wild boars, are water and are a tree.\" Demosthenes tells of the purification by mud to which initiates were subjected as part of the Orphic mysteries; analogously, the Proteans sought purification through evil. It was their belief, as it was Carpocrates', that no one shall emerge from the prison until the last obolus is paid (Luke 12:59: \"I tell thee, thou shalt not depart thence, till thou hast paid the very last mite\"), and they often hornswoggled penitents with this other verse: \"I am come that they might have life, and that they might have it more abundantly\" (John 10:10). They also said that not to be an evildoer was an act of Satanic arrogance... The Histrioni wove many, and diverse, mythologies; some preached asceticism, others license\u2014all preached confusion. Theopompus,a Histrion from Berenice, denied all fables; he said that every man is an organ projected by the deity in order to perceive the world."],[37,293,"I know that I am accused of arrogance and perhaps of misanthropy, and perhaps even of madness. These accusations (which I shall punish in due time) are ludicrous. It is true that I never leave my house, but it is also true that its doors (whose number is infinite1) by Asterion that stand [1The original reads \"fourteen,\" but there is more than enough cause to conclude that when spoken number stands for \"infinite.\"] open night and day to men and also to animals. Anyone who wishes to enter may do so. Here, no womanly splendors, no palatial ostentation shall be found, but only calm and solitude. Here shall be found a house like none other on the face of the earth. (Those who say there is a similar house in Egypt speak lies.) Even my detractors admit that there is not a single piece of furniture in the house. Another absurd tale is that I, Asterion, am a prisoner. Need I repeat that the door stands open? Need I add that there is no lock? Furthermore, one afternoon I did go out into the streets; if I returned before nightfall, I did so because of the terrible dread inspired in me by the faces of the people\u2014colorless faces, as flat as the palm of one's hand. The sun had already gone down, but the helpless cry of a babe and the crude supplications of the masses were signs that I had been recognized. The people prayed, fled, fell prostrate before me; some climbed up onto the stylobate of the temple of the Axes, others gathered stones. One, I believe, hid in the sea. Not for nothing was my mother a queen; I cannot mix with commoners, even if my modesty should wish it."]],[[19,134,"I have just written the word \"infinite.\" I have not included that adjective out of mere rhetorical habit; I hereby state that it is not illogical to think that the world is infinite. Those who believe it to have limits hypothesize that in some remote place or places the corridors and staircases and hexagons may, inconceivably, end\u2014which is absurd. And yet those who picture the world as unlimited forget that the number of possible books is not. I will be bold enough to suggest this solution to the ancient problem: The Library is unlimited but periodic. If an eternal traveler should journey in any direction, he would find after untold centuries that the same volumes are repeated in the same disorder\u2014which, repeated, becomes order: the Order. My solitude is cheered by that elegant hope.4"],[55,130,"I close my eyes and see a flock of birds. The vision lasts a second, or perhaps less; I am not sure how many birds I saw. Was the number of birds definite or indefinite? The problem involves the existence of God. If God exists, the number is definite, because God knows how many birds I saw. If God does not exist, the number is indefinite, because no one can have counted. In this case I saw fewer than ten birds (let us say) and more than one, but did not see nine, eight, seven, six, five, four, three, or two birds. I saw a number between ten and one, which was not nine, eight, seven, six, five, etc. That integer\u2014not-nine, not-eight, not-seven, not-six, not-five, etc.\u2014is incon-ceivable. Ergo, God exists."],[106,69,"\"It can't be, yet it is,\" the Bible peddler said, his voice little more than a whisper. \"The number of pages in this book is literally infinite. No page is the first page; no page is the last. I don't know why they're numbered in this arbitrary way, but perhaps it's to give one to understand that the terms of an infinite series can be numbered any way whatever.\""]],[[20,204,"Something\u2014perhaps the mere show of proving that my resources were nonexistent\u2014 made me go through my pockets. I found what I knew I would find: the American watch, the nickel-plated chain and quadrangular coin, the key ring with the compromising and useless keys to Runeberg's flat, the notebook, a letter I resolved to destroy at once (and never did), the false passport, one crown, two shillings, and a few odd pence, the red-and-blue pencil, the handkerchief, the revolver with its single bullet. Absurdly, I picked it up and hefted it, to give myself courage. I vaguely reflected that a pistol shot can be heard at a considerable distance. In ten minutes, my plan was ripe. The telephone book gave me the name of the only person able to communicate the information: he lived in a suburb of Fenton, less than a half hour away by train. I am a coward. I can say that, now that I have carried out a plan whose dangerousness and daring no man will deny. I know that it was a terrible thing to do. I did not do it for Germany. What do I care for a barbaric country that has forced me to the ignominy of spying?"],[41,204,"I have said that composing that piece of trivial nonsense (in the course of which I interpolated, with pseudo-erudition, a line or two from the Fafnismal) enabled me to put the coin out of my mind. There were nights when I was so certain I'd be able to forget it that I would willfully remember it. The truth is, I abused those moments; starting to recall turned out to be much easier than stopping. It was futile to tell myself that that abominable nickel disk was no different from the infinite other identical, inoffensive disks that pass from hand to hand every day. Moved by that reflection, I attempted to think about another coin, but I couldn't. I also recall another (frustrated) experiment that I performed with Chilean fiveand ten-centavo pieces and a Uruguayan two-centavo piece. On July 16, I acquired a pound sterling; I didn't look at it all that day, but that night (and others) I placed it under a magnifying glass and studied it in the light of a powerful electric lamp. Then I made a rubbing of it. The rays of light and the dragon and St. George availed me naught; I could not rid myself of my id\u00e9e fixe."],[86,152,"about heading back home. I felt, as Lugones once put it, \"the fear of the late-ness of the hour.\" I couldn't bring myself to look at the clock. To hide the loneliness I felt at being a boy among men, I drank down, without much pleasure, a glass or two of wine. Suddenly, Uriarte loudly challenged Dun-can to a game of poker, just the two of them, mano a mano. Someone objected that two-handed poker usually was a sorry sort of game, and suggested a table of four. Duncan was in favor of that, but Uriarte, with an obstinacy that I didn't understand (and didn't try to), insisted that it be just the two of them. Outside of truco(whose essential purpose is to fill time with verses and good-natured mischief) and the modest labyrinths of solitaire, I have never cared much for cards. I slipped out of the room without anyone's noticing."],[97,40,"I had one card still up my sleeve, but I put off playing it for several days, not only because I sensed how utterly useless it would be but also because it would drag me to the inevitable, the ultimate."]],[[20,182,"From that shattered state I passed into a state of almost abject cheerfulness. I told myself that my duel had begun, and that in dodging my adversary's thrust\u2014even by forty minutes, even thanks to the slightest smile from fate\u2014the first round had gone to me. I argued that this small win prefigured total victory. I argued that the win was not really even so small, since without the precious hour that the trains had given me, I'd be in gaol, or dead. I argued (no less sophistically) that my cowardly cheerfulness proved that I was a man capable of following this adventure through to its successful end. From that weakness I drew strength that was never to abandon me. I foresee that mankind will resign itself more and more fully every day to more and more horrendous undertakings; soon there will be nothing but warriors and brigands. I give them this piece of advice: He who is to perform a horrendous act should imagine to himself that it is already done, should impose upon himself a future as irrevocable as the past."],[39,115,"During the trial (which fortunately was short) I did not speak; to explain myself at that point would have put obstacles in the way of the verdict and made me appear cowardly. Now things have changed; on this night that precedes my execution, I can speak without fear. I have no desire to be pardoned, for I feel no guilt, but I do wish to be understood. Those who heed my words shall understand the history of Germany and the future history of the world. I know that cases such as mine, exceptional and shocking now, will very soon be unremarkable. Tomorrow I shall die, but I am a symbol of the generations to come."],[59,49,"And now I am going to the place where I will be given a new face and a new destiny, because history is tired of violent men. I don't know who the next man may be, what will be done with me, but I know I won't be afraid.\""],[103,80,"The story I shall tell is about two men, or rather about an incident in which two men played a part. The event, which is not at all singular or fantastic, is less important than the character of the two men involved. Both were vain, though in very different ways and with very different results. The anecdote (for it's really very little more than that) took place a short time ago in one of the states of the United States."],[111,148,"\"I am not an impostor. I am not insane. I beg you to suspend judgment until you hear me out. Major Barclay no doubt told you that I am, or was, a military physician. The story can be told very briefly. It begins in the East, in a field hospital, at dawn. The exact date is not important. An enlisted man named Adam Clay, who had been shot twice, offered me the precious memory almost literally with his last breath. Pain and fever, as you know, make us creative; I accepted his offer without crediting it\u2014and besides, after a battle, nothing seems so very strange. He barely had time to explain the singular conditions of the gift: The one who possesses it must offer it aloud, and the one who is to receive it must accept it the same way. The man who gives it loses it forever.\""]],[[20,247,"For one instant, I feared that Richard Madden had somehow seen through my desperate plan, but I soon realized that that was impossible. The boy's advice to turn always to the left reminded me that that was the common way of discovering the central lawn of a certain type of maze. I am something of a connoisseur of mazes: not for nothing am I the great-grandson of that Ts'ui Pen who was governor of Yunan province and who renounced all temporal power in order to write a novel containing more characters than the Hung Lu Meng and construct a labyrinth in which all men would lose their way. Ts'ui Pen devoted thirteen years to those disparate labours, but the hand of a foreigner murdered him and his novel made no sense and no one ever found the labyrinth. It was under English trees that I meditated on that lost labyrinth: I pictured it perfect and inviolate on the secret summit of a mountain; I pictured its outlines blurred by rice paddies, or underwater; I pictured it as infinite\u2014a labyrinth not of octagonal pavillions and paths that turn back upon themselves, but of rivers and provinces and kingdoms-----I imagined a labyrinth of labyrinths, amaze of mazes, a twisting, turning, ever-widening labyrinth that contained both past and future and somehow implied the stars. Absorbed in those illusory imaginings, I forgot that I was a pursued man; I felt myself, for an indefinite while, the abstract perceiver of the world."],[34,56,"I fleetingly thought of the Mongol horsemen who had wanted to make China an infinite pastureland, only to grow old in the cities they had yearned to destroy; but that was not the memory I sought. I found it at last\u2014it was a tale I had heard once from my English grandmother, who is now dead."],[51,179,"In my childhood I was a fervent worshiper of the tiger\u2014not the jaguar, that spotted \"tiger\" that inhabits the floating islands of water hyacinths along the Paran\u00e1 and the tangled wilderness of the Amazon, but the true tiger, the striped Asian breed that can be faced only by men of war, in a castle atop an elephant. I would stand for hours on end before one of the cages at the zoo; I would rank vast encyclopedias and natural history books by the splendor of their tigers. (I still remember those pictures, I who cannot recall without error a woman's brow or smile.) My childhood outgrown, the tigers and my passion for them faded, but they are still in my dreams. In that under-ground sea or chaos, they still endure. As I sleep I am drawn into some dream or other, and suddenly I realize that it's a dream. At those moments, I often think: This is a dream, a pure diversion of my will, and since I have unlimited power, I am going to bring forth a tiger."],[109,245,"A famous poem by Blake paints the tiger as a fire burning bright and an eternal archetype of Evil; I prefer the Chesterton maxim that casts the tiger as a symbol of terrible elegance. Apart from these, there are no words that can rune the tiger, that shape which for centuries has lived in the imagination of mankind. I have always been drawn to the tiger. I know that as a boy I would linger before one particular cage at the zoo; the others held no interest for me. I would judge encyclopedias and natural histories by their engravings of the tiger. When the Jungle Books were revealed to me I was upset that the tiger, Shere Khan, was the hero's enemy. As the years passed, this strange fascination never left me; it survived my paradoxical desire to become a hunter as it did all common human vicissitudes. Until not long ago (the date feels distant but it really is not), it coexisted peacefully with my day-to-day labors at the University of Lahore. I am a professor of Eastern and Western logic, and I consecrate my Sundays to a seminar on the philosophy of Spinoza. I should add that I am a Scotsman; it may have been my love of tigers that brought me from Aberdeen to Punjab. The outward course of my life has been the common one, but in my dreams I always saw tigers. Now it is other forms that fill them."]],[[20,34,"The vague, living countryside, the moon, the remains of the day did their work in me; so did the gently downward road, which forestalled all possibility of weariness. The evening was near, yet infinite."],[30,59,"Dahlmann accepted the walk as a small adventure. The sun had sunk below the horizon now, but one final splendor brought a glory to the living yet silent plains before they were blotted out by night. Less to keep from tiring himself than to make those things last, Dahlmann walked slowly, inhaling with grave happiness the smell of clover."],[109,82,"There was no path, and the undergrowth held me back. The moon was just at the horizon. I took note of everything with singular attentiveness, as though I sensed that this was to be an important day, perhaps the most important day of all my days. I still recall the dark, almost black, shadings of the leaves and bushes. It was close to dawn, and the sky was beginning to turn pale, but in all the jungle around, not one bird sang."]],[[20,77,"The sputtering of the music continued, but from the rear of the intimate house, a lantern was making its way toward me\u2014a lantern crosshatched and sometimes blotted out altogether by the trees, a paper lantern the shape of a drum and the colour of the moon. It was carried by a tall man. I could not see his face because the light blinded me. He opened the gate and slowly spoke to me in my own language."],[102,61,"The road was rutted and uneven. Rain began to fall. Some two or three hundred yards down the road, I saw the light of a house. It was squat and rectangular and surrounded by trees. The door was opened by a man so tall it almost frightened me. He was dressed in gray. I sensed that he was waiting for someone."],[105,99,"I keep the door of my house shut with a rock so the snow won't get in. One evening I heard heavy, dragging footsteps and then a knock. I opened the door and a stranger came in. He was a tall, elderly man all wrapped up in a worn-out old blanket. A scar sliced across his face. The years looked to have given him more authority than frailty, but even so I saw it was hard for him to walk without leaning on his stick. We exchanged a few words I don't recall now. Then finally the man said:"],[106,124,"I live alone, in a fifth-floor apartment on Calle Belgrano. One evening a few months ago, I heard a knock at my door. I opened it, and a stranger stepped in. He was a tall man, with blurred, vague features, or perhaps my nearsightedness made me see him that way. Everything about him spoke of honest poverty: he was dressed in gray, and carried a gray valise. I immediately sensed that he was a foreigner. At first I thought he was old; then I noticed that I had been misled by his sparse hair, which was blond, almost white, like the Scandinavians'. In the course of our conversation, which I doubt lasted more than an hour, I learned that he hailed from the Orkneys."]],[[20,287,"\"Exactly,\" Albert said. \"The Garden of Forking Paths is a huge riddle, or parable, whose subject is time; that secret purpose forbids Ts'ui Pen the merest mention of its name. To always omit one word, to employ awkward metaphors and obvious circumlocutions, is perhaps the most emphatic way of calling attention to that word. It is. at any rate, the tortuous path chosen by the devious Ts'ui Pen at each and every one of the turnings of his inexhaustible novel. I have compared hundreds of manuscripts, I have corrected the errors introduced through the negligence of copyists, I have reached a hypothesis for the plan of that chaos, I have reestablished, or believe I've reestablished, its fundamental order\u2014I have translated the entire work; and I know that not once does the word 'time' appear. The explanation is obvious: The Garden of Forking Paths is an incomplete, but not false, image of the universe as conceived by Ts'ui Pen. Unlike Newton and Schopenhauer, your ancestor did not believe in a uniform and absolute time; he believed in an infinite series of times, a growing, dizzying web of divergent, convergent, and parallel times. That fabric of times that approach one another, fork, are snipped off, or are simply unknown for centuries, contains all possibilities. In most of those times, we do not exist; in some, you exist but I do not; in others, I do and you do not; in others still, we both do. In this one, which the favouring hand of chance has dealt me, you have come to my home; in another, when you come through my garden you find me dead; in another, I say these same words, but I am an error, a ghost.\""],[40,449,"\"Less eloquently,\" he said, \"and yet with similar arguments, I myself have sometimes defended the proposition argued now by abu-al-Hasan. In Alexandria there is a saying that only the man who has already committed a crime and repented of it is incapable of that crime; to be free of an erroneous opinion, I myself might add, one must at some time have professed it. In his mu'allaqa, Zuhayr says that in the course of his eighty years of pain and glory many is the time he has seen destiny trample men, like an old blind camel; abu-al-Hasan says that that figure no longer makes us marvel. One might reply to that objection in many ways. First, that if the purpose of the poem were to astound, its life would be not measured in centuries but in days, or hours, or perhaps even minutes. Second, that a famous poet is less an inventor than a discoverer. In praise of ibn-Sharaf of Berkha, it has many times been said that only he was capable of imagining that the stars of the morning sky fall gently, like leaves falling from the trees; if that were true, it would prove only that the image is trivial. The image that only a single man can shape is an image that interests no man. There are infinite things upon the earth; any one of them can be compared to any other. Comparing stars to leaves is no less arbitrary than comparing them to fish, or birds. On the other hand, every man has surely felt at some moment in his life that destiny is powerful yet clumsy, innocent yet inhuman. It was in order to record that feeling, which may be fleeting or constant but which no man may escape experiencing, that Zuhayr's line was written. No one will ever say better what Zuhayr said there. Furthermore (and this is perhaps the essential point of my reflections), time, which ravages fortresses and great cities, only enriches poetry. At the time it was composed by him in Arabia, Zuhayr's poetry served to bring together two images\u2014that of the old camel and that of destiny; repeated today, it serves to recall Zuhayr and to conflate our own tribulations with those of that dead Arab. The figure had two terms; today, it has four. Time widens the circle of the verses, and I myself know some verses that are, like music, all things to all men. Thus it was that many years ago, in Marrakesh, tortured by memories of C\u00f3rdoba, I soothed myself by repeating the apostrophe which Abd-al-Rahman spoke in the gardens of al-Rusayfah to an African palm: Thou too art, oh palm! On this foreign soil..."],[41,205,"Time, which softens recollections, only makes the memory of the Zahir all the sharper. First I could see the face of it, then the reverse; now I can see both sides at once. It is not as though the Zahir were made of glass, since one side is not superimposed upon the other\u2014 rather, it is as though the vision were itself spherical, with the Zahir rampant in the center. Anything that is not the Zahir comes to me as though through a filter, and from a distance\u2014 Teodelina's disdainful image, physical pain. Tennyson said that if we could but understand a single flower we might know who we are and what the world is. Perhaps he was trying to say that there is nothing, however humble, that does not imply the history of the world and its infinite concatenation of causes and effects. Perhaps he was trying to say that the visible world can be seen entire in every image, just as Schopenhauer tells us that the Will expresses itself entire in every man and woman. The Kabbalists believed that man is a microcosm, a symbolic mirror of the universe; if one were to believe Tennyson, everything would be\u2014 everything, even the unbearable Zahir."]],[[20,79,"I felt again that pullulation I have mentioned. I sensed that the dew-drenched garden that surrounded the house was saturated, infinitely, with invisible persons. Those persons were Albert and myself\u2014secret, busily at work, multiform\u2014in other dimensions of time. I raised my eyes and the gossamer nightmare faded. In the yellow-and-black garden there was but a single man\u2014but that man was as mighty as a statue, and that man was coming down the path, and he was Capt. Richard Madden."],[69,162,"There was no one inside him; behind his face (which even in the bad paintings of the time resembles no other) and his words (which were multitudinous, and of a fantastical and agitated turn) there was no more than a slight chill, a dream someone had failed to dream. At first he thought that everyone was like him, but the surprise and bewilderment of an acquaintance to whom he began to describe that hollowness showed him his error, and also let him know, forever after, that an individual ought not to differ from its species. He thought at one point that books might hold some remedy for his condition, and so he learned the \"little Latin and less Greek\" that a contemporary would later mention. Then he reflected that what he was looking for might be found in the performance of an elemental ritual of humanity, and so he allowed himself to be initiated by Anne Hathaway one long evening in June."],[111,77,"Then came the gradual transformation of my dreams. I was to be granted neither splendid nightmares \u00e0 la De Quincey nor pious allegorical visions in the manner of his master Jean Paul; it was unknown rooms and faces that entered my nights. The first face I identified was Chapman's; later there was Ben Jonson's, and the face of one of the poet's neighbors, a person who does not figure in the biographies but whom Shakespeare often saw."]],[[22,247,"My first recollection of Funes is quite clear. I see him one afternoon in March or February of '84. That year, my father had taken me to spend the summer in Fray Bentos. I was coming back from the ranch in San Francisco with my cousin Bernardo Haedo. We were riding along on our horses, singing merrily\u2014and being on horseback was not the only reason for my cheerfulness. After a sultry day, a huge slatecolored storm, fanned by the south wind, had curtained the sky. The wind flailed the trees wildly, and I was filled with the fear (the hope) that we would be surprised in the open countryside by the elemental water. We ran a kind of race against the storm. We turned into the deep bed of a narrow street that ran between two brick sidewalks built high up off the ground. It had suddenly got dark; I heard quick, almost secret footsteps above me\u2014I raised my eyes and saw a boy running along the narrow, broken sidewalk high above, as though running along the top of a narrow, broken wall. I recall the short, baggy trousers\u2014 like a gaucho's\u2014that he wore, the straw-soled cotton slippers, the cigarette in the hard visage, all stark against the now limitless storm cloud. Unexpectedly, Bernardo shouted out to him\u2014 What's the time, Ireneo? Without consulting the sky, without a second's pause, the boy replied, Four minutes till eight, young Bernardo Juan Francisco. The voice was shrill and mocking."],[78,70,"All this, until that summer day in 1852 when the dictator Rosas fled the country. It was then that the secret man emerged into the light of day; my grandfather actually spoke with him. Puffy, slack-muscled, and obese, Pedro Salvadores was the color of wax, and he spoke in a faint whisper. The government had confiscated his land; it was never returned to him. I believe he died in poverty."],[84,70,"From that afternoon on, Francisco Ferrari was the hero that my fifteen-year-old heart yearned for. He had black hair and was rather tall, good-looking\u2014handsome in the style of those days. He always wore black. It was a second episode that actually brought us together. I was walking along with my mother and my aunt when we came upon some street toughs, and one of them said loudly to the others:"]],[[22,149,"He told me that in 1886 he had invented a numbering system original with himself, and that within a very few days he had passed the twenty-four thousand mark. He had not written it down, since anything he thought, even once, remained ineradicably with him. His original motivation, I think, was his irritation that the thirty-three Uruguayan patriots should require two figures and three words rather than a single figure, a single word. He then applied this mad principle to the other numbers. Instead of seven thousand thirteen (7013), he would say, for instance, \"M\u00e1ximo P\u00e9rez\"; instead of seven thousand fourteen (7014), \"the railroad\"; other numbers were \"Luis Meli\u00e1n Lafinur,\" \"Olimar,\" \"sulfur,\" \"clubs,\" \"the whale,\" \"gas,\" \"a stewpot,\" \"Napoleon,\" \"Agust\u00edn de Vedia.\" Instead of five hundred (500), he said \"nine.\" Every word had a particular figure attached to it, a sort of marker; the later ones were extremely complicated."],[41,330,"In the rhetorical figure known as oxymoron, the adjective applied to a noun seems to contradict that noun. Thus, gnostics spoke of a \"dark light\" and alchemists, of a \"black sun.\" Departing from my last visit to Teodelina Villar and drinking a glass of harsh brandy in a corner bar-and-grocery-store was a kind of oxymoron: the very vulgarity and facileness of it were what tempted me. (The fact that men were playing cards in the place in-creased the contrast.) I asked the owner for a brandy and orange juice; among my change I was given the Zahir; I looked at it for an instant, then walked outside into the street, perhaps with the beginnings of a fever. The thought struck me that there is no coin that is not the symbol of all the coins that shine endlessly down throughout history and fable. I thought of Charon's obolus; the alms that Belisarius went about begging for; Judas' thirty pieces of silver; the drachmas of the courtesan La'is; the ancient coin proffered by one of the Ephesian sleepers; the bright coins of the wizard in the 1001 Nights, which turned into disks of paper; Isaac Laquedem's inexhaustible denarius; the sixty thousand coins, one for every line of an epic, which Firdusi returned to a king because they were silver and not gold; the gold doubloon nailed by Ahab to the mast; Leopold Bloom's unreturning florin; the gold louis that betrayed the fleeing Louis XVI near Varennes. As though in a dream, the thought that in any coin one may read those famous connotations seemed to me of vast, inexplicable importance. I wandered, with increasingly rapid steps, through the deserted streets and plazas. Weariness halted me at a corner. My eyes came to rest on a woebegone wrought-iron fence; behind it, I saw the black-and-white tiles of the porch of La Concepci\u00f3n. I had wandered in a circle; I was just one block from the corner where I'd been given the Zahir."],[47,353,"Then he reread four or five pages of his poem to me. Verbal ostentation was the perverse principle that had guided his revisions: where he had formerly written \"blue\" he now had \"azure,\" \"cerulean,\" and even \"bluish.\" The word \"milky\" was not sufficiently hideous for him; in his impetuous description of a place where wool was washed, he had replaced it with \"lactine,\" \"lactescent,\" \"lactoreous,\" \"lacteal.\"... He railed bitterly against his critics; then, in a more benign tone, he compared them to those persons \"who possess neither precious metals nor even the steam presses, laminators, and sulfuric acids needed for minting treasures, but who can point out to others the precise location of a treasure.\" Then he was off on another tack, inveighing against the obsession for forewords, what he called \"prologomania, \" an attitude that \"had already been spoofed in the elegant preface to the Quixote by the Prince of Wits himself.\" He would, however, admit that an attention-getting recommendation might be a good idea at the portals of his new work\u2014\"an accolade penned by a writer of stature, of real import.\" He added that he was planning to publish the first cantos of his poem. It was at that point that I understood the unprecedented telephone call and the invitation: the man was about to ask me to write the preface to that pedantic farrago of his. But my fear turned out to be unfounded. Carlos Argentino remarked, with grudging admiration, that he believed he did not go too far in saying that the prestige achieved in every sphere by the man of letters Alvaro Meli\u00e1n Lafinur was \"solid,\" and that if I could be persuaded to persuade him, Alvaro \"might be enchanted to write the called-for foreword.\" In order to forestall the most unpardonable failure on my part, I was to speak on behalf of the poem's two incontrovertible virtues: its formal perfection and its scientific rigor\u2014\"because that broad garden of rhetorical devices, figures, charms, and graces will not tolerate a single detail that does not accord with its severe truthfulness.\" He added that Beatriz had always enjoyed Alvaro's company."]],[[22,186,"Babylon, London, and New York dazzle mankind's imagination with their fierce splendor; no one in the populous towers or urgent avenues of those cities has ever felt the heat and pressure of a reality as inexhaustible as that which battered Ireneo, day and night, in his poor South American hinterland. It was hard for him to sleep. To sleep is to take one's mind from the world; Funes, lying on his back on his cot, in the dimness of his room, could picture every crack in the wall, every molding of the precise houses that surrounded him. (I repeat that the most trivial of his memories was more detailed, more vivid than our own perception of a physical pleasure or a physical torment.) Off toward the east, in an area that had not yet been cut up into city blocks, there were new houses, unfamiliar to Ireneo. He pictured them to himself as black, compact, made of homogeneous shadow; he would turn his head in that direction to sleep. He would also imagine himself at the bottom of a river, rocked (and negated) by the current."],[31,275,"The impression of great antiquity was joined by others: the impression of endlessness, the sensation of oppressiveness and horror, the sensation of complex irrationality. I had made my way through a dark maze, but it was the bright City of the Immortals that terrified and repelled me. A maze is a house built purposely to confuse men; its architecture, prodigal in symmetries, is made to serve that purpose. In the palace that I imperfectly explored, the architecture had no purpose. There were corridors that led nowhere, unreachably high windows, grandly dramatic doors that opened onto monklike cells or empty shafts, incredible upside-down staircases with upside-down treads and balustrades. Other staircases, clinging airily to the side of a monumental wall, petered out after two or three landings, in the high gloom of the cupolas, arriving nowhere. I cannot say whether these are literal examples I have given; I do know that for many years they plagued my troubled dreams; I can no longer know whether any given feature is a faithful transcription of reality or one of the shapes unleashed by my nights. This City, I thought, is so horrific that its mere existence, the mere fact of its having endured \u2014 even in the middle of a secret desert\u2014 pollutes the past and the future and somehow compromises the stars. So long as this City endures, no one in the world can ever be happy or courageous. I do not want to describe it; a chaos of heterogeneous words, the body of a tiger or a bull pullulating with teeth, organs, and heads monstrously yoked together yet hating each other\u2014those might, perhaps, be approximate images."],[97,57,"What must the inhabitant of this house be like? What must it be seeking here, on this planet, which must have been no less horrible to it than it to us? From what secret regions of astronomy or time, from what ancient and now incalculable twilight, had it reached this South American suburb and this precise night?"]],[[22,48,"He had effortlessly learned English, French, Portuguese, Latin. I suspect, nevertheless, that he was not very good at thinking. To think is to ignore (or forget) differences, to generalize, to abstract. In the teeming world of Ireneo Funes there was nothing but particulars\u2014and they were virtually immediate particulars."],[45,84,"He saw tragic stories of the underworld; no doubt they had their errors; no doubt they included certain images that were also a part of Sr. Villari's previous life, but he didn't notice the errors, because the notion that there might be parallels between art and life never occurred to him. He docilely tried to like things; he tried to take things in the spirit they were offered. Unlike people who had read novels, he never saw himself as a character in a book."],[104,107,"He would have liked to wake up when the sun was high, but the habit of getting up with the dawn was stronger than his mere will. He missed his friends terribly, though he knew without bitterness that they didn't miss him, given his impregnable reserve. One afternoon, one of them came around to ask after him but was met in the vestibule and turned away. The black woman didn't know him; Arredondo never learned who it had been. An avid reader of the news, Arredondo found it hard to renounce those museums of ephemera. He was not a thinking man, or one much given to meditation."]],[[23,233,"His face was traversed by a vengeful scar, an ashen and almost perfect arc that sliced from the temple on one side of his head to his cheek on the other. His true name does not matter; everyone in Tacuaremb\u00f3 called him \"the Englishman at La Colorada.\" The owner of the land, Cardoso, hadn't wanted to sell it; I heard that the Englishman plied him with an argument no one could have foreseen\u2014he told him the secret history of the scar. He had come from the border, from Rio Grande do Sul; there were those who said that over in Brazil he had been a smuggler. The fields had gone to grass, the water was bitter; to put things to right, the Englishman worked shoulder to shoulder with his peons. People say he was harsh to the point of cruelty, but scrupulously fair. They also say he liked his drink; once or twice a year he would shut himself up in the room in the belvedere, and two or three days later he would emerge as though from a battle or a spell of dizziness\u2014 pale, shaking, befuddled, and as authoritarian as ever. I recall his glacial eyes, his lean energy, his gray mustache. He was standoffish; the fact is, his Spanish was rudimentary, and tainted with the accents of Brazil. Aside from the occasional business letter or pamphlet, he got no mail."],[83,285,"In Turdera they were known as the Nilsens. I was told by the parish priest that his predecessor recalled having seen, not without some surprise, a worn black-letter Bible in the house; on its last pages he had glimpsed handwritten names and dates. That blackbound volume was the only book they owned\u2014 its troubled chronicle of the Nilsens is now lost, as everything will one day be lost. The big ramshackle house (which is no longer standing) was of unplastered brick; from the entryway one could see a first interior patio of red tiles and another, farther back, of packed earth. Few people, however, entered that entryway; the Nilsens defended their solitude. They slept on cots in dilapidated and unfurnished bedrooms; their luxuries were horses, saddles, shortbladed daggers, flashy Saturday night clothes, and the alcohol that made them belligerent. I know that they were tall, with reddish hair\u2014the blood of Denmark or Ireland (countries whose names they probably never heard) flowed in the veins of those two criollos. The neighborhood was afraid of the Redheads, as they were called; it is not impossible that one or another killing had been their work. Once they had stood shoulder to shoulder and fought it out with the police. People say the younger brother had once traded words with Juan Iberra and not gone away with the worst of it\u2014which according to those who knew about such things was saying a great deal. They were cattle drivers, teamsters, horse thieves, and sometime cardsharps. They had a reputation for tightfisted-ness, except when drinking and gambling made them generous. About their kinspeople, nothing is known even of where they came from. They owned an oxcart and a yoke of oxen."],[92,136,"Exploring the house still cut off by the high water, he came upon a Bible printed in English. On its last pages the Guthries (for that was their real name) had kept their family history. They had come originally from Inverness and had arrived in the New World\u2014doubtlessly as peasant laborers\u2014 in the early nineteenth century; they had intermarried with Indians. The chronicle came to an end in the eighteenseventies; they no longer knew how to write. Within a few generations they had forgotten their English; by the time Espinosa met them, even Spanish gave them some difficulty. They had no faith, though in their veins, alongside the superstitions of the pampas, there still ran a dim current of the Calvinist's harsh fanaticism. Espinosa mentioned his find to them, but they hardly seemed to hear him."]],[[23,60,"I am not sure what time it was when I realized that I was drunk; I don't know what inspiration or elation or boredom led me to remark on my host's scar. His face froze; for several seconds I thought he was going to eject me from the house. But at last, his voice perfectly ordinary, he said to me:"],[41,37,"The next day I decided I'd been drunk. I also decided to free myself of the coin that was affecting me so distressingly. I looked at it\u2014 there was nothing particularly distinctive about it, except those scratches."],[95,39,"I can recall nothing further of what was said that night. The next day I came down to the dining room early. I saw through the windows that it had snowed; the moors ran on seamlessly into the morning."],[105,34,"It was toward dawn when we left the house. The rain had stopped and the ground was covered with new snow. The man dropped his stick and he ordered me to pick it up."]],[[23,157,"In that autumn of 1922 I had gone more or less underground, and was living in General Berkeley's country house. The general (whom I had never seen) was at that time posted to some administrative position or other out in Bengal; the house was less than a hundred years old but it was gloomy and dilapidated and filled with perplexing corridors and pointless antechambers. The museum-cabinet and huge library arrogated to themselves the entire lower floor\u2014there were the controversial and incompatible books that are somehow the history of the nineteenth century; there were scimitars from Nishapur, in whose frozen crescents the wind and violence of battle seemed to be living on. We entered the house (I think I recall) through the rear. Moon, shaking, his mouth dry, mumbled that the events of the night had been \"interesting\"; I salved and bandaged him, then brought him a cup of tea. The wound was superficial. Suddenly, puzzled, he stammered:"],[34,156,"One day my grandmother, half in wonder, half in jest, remarked upon her fate\u2014an Englishwoman torn from her country and her people and carried to this far end of the earth. The person to whom she made the remark told her she wasn't the only one, and months later pointed out an Indian girl slowly crossing the town square. She was barefoot, and wearing two red ponchos; the roots of her hair were blond. A soldier told her that another Englishwoman wanted to talk with her. The woman nodded; she went into the headquarters without fear but not without some misgiving. Set in her coppery face painted with fierce colors, her eyes were that half-hearted blue that the English call gray. Her body was as light as a deer's; her hands, strong and bony. She had come in from the wilderness, from \"the interior,\" and everything seemed too small for her\u2014the doors, the walls, the furniture."],[57,214,"One day in July, 1952, the man dressed in mourning weeds appeared in that little village on the Chaco River. He was a tall, thin man with vaguely Indian features and the inexpressive face of a half-wit or a mask. The townsfolk treated him with some deference, not because of who he was but because of the personage he was portraying or had by now become. He chose a house near the river; with the help of some neighbor women he laid a board across two sawhorses, and on it he set a pasteboard coffin with a blond-haired mannequin inside. In addition, they lighted four candles in tall candleholders and put flowers all around. The townsfolk soon began to gather. Old ladies bereft of hope, dumbstruck wide-eyed boys, peons who respectfully took off their pith hats\u2014they filed past the coffin and said: My condolences, General. The man in mourning sat sorrowfully at the head of the coffin, his hands crossed over his belly like a pregnant woman. He would extend his right hand to shake the hand extended to him and answer with courage and resignation: It was fate. Everything humanly possible was done. A tin collection box received the two-peso price of admission, and many could not content themselves with a single visit."],[99,264,"On the ranch they were so afraid of them they wouldn't even mention them. Gradually I learned about the raids, almost like they were a secret that nobody was supposed to tell\u2014how Indians might swarm down like a thundercloud and kill people and steal the animals. Women, they carried off to the interior, and did terrible things to them. I tried as hard as I could not to believe it. Lucas, my brother, who later got speared, swore it was all lies, but when something's true, you know it the first time you hear it. The government sends them things\u2014 tobacco, mate, liquor, hierba\u2014to keep them quiet, but they have crafty leaders\u2014spirit men\u2014 that warn them off it. If a chief of theirs orders it, they think nothing of storming down on a fort. The forts are scattered.... From thinking about it so much, I almost wished they'd come, and I would sit and look out in the direction where the sun goes down. I never learned about keeping track of time, but I do know there came frosts and summers and branding seasons and the death of the foreman's son, and then they did come. It was like the very wind off the pampas brought them. I saw a thistle flower in a ravine and I dreamed of the Indians. The next morning it happened. Like in an earthquake, the animals knew it before we did. The whole herd was skittish, and birds were flying through the air every which way. We ran to look out in the direction I always looked in...\""],[109,109,"I arrived toward the end of the rainy season. The village squatted at the foot of a hill (which looked to me wider than it was high) and was surrounded and menaced by the jungle, which was a dark brown color. Surely one of the pages of Kipling contains that village of my adventure, since all of India, all the world somehow, can be found there. Suffice it to report that a ditch, and swaying cane-stalk bridges, constituted the huts' fragile defense. Toward the south there were swamps and rice fields and a ravine with a muddy river whose name I never learned, and beyond that, again, the jungle."]],[[23,35,"I told him it was nothing. (It was the habit of civil war that impelled me to act as I acted; besides, the imprisonment of a single one of us could imperil the entire cause.)"],[104,54,"He loved his sweetheart with all his soul, but he'd been told that a man shouldn't think about women, especially when there were none to be had. Being in the country had accustomed him to chastity. As for the other matter... he tried to think as little as possible of the man he hated."],[106,33,"I told him, with perfect honesty, that such an amount of money was not within my ability to pay. But my mind was working; in a few moments I had devised my plan."]],[[23,93,"I was embarrassed by the man and his fear, shamed by him, as though I myself were the coward, not Vincent Moon. Whatsoever one man does, it is as though all men did it. That is why it is not unfair that a single act of disobedience in a garden should contaminate all humanity; that is why it is not unfair that a single Jew's crucifixion should be enough to save it. Schopenhauer may have been right\u2014I am other men, any man is all men, Shakespeare is somehow the wretched John Vincent Moon."],[39,136,"Carrying out the duties attendant on that position was not something I enjoyed, but I never sinned by omission. The coward proves himself among swords; the merciful man, the compassionate man, seeks to be tested by jails and others' pain. Nazism is intrinsically a moral act, a stripping away of the old man, which is corrupt and depraved, in order to put on the new. In battle, amid the captains' outcries and the shouting, such a transformation is common; it is not common in a crude dungeon, where insidious compassion tempts us with ancient acts of tenderness. I do not write that word \"compassion\" lightly: compassion on the part of the superior man is Zarathustra's ultimate sin. I myself (I confess) almost committed it when the famous poet David Jerusalem was sent to us from Breslau."],[111,40,"One morning I perceived a sense of guilt deep within his memory. I did not try to define it; Shakespeare himself has done so for all time. Suffice it to say that the offense had nothing in common with perversion."]],[[24,34,"In Nolan's play, the passages taken from Shakespeare are the least dramatic ones; Ryan suspected that the author interpolated them so that someone, in the future, would be able to stumble upon the truth."],[108,44,"I sensed that the evocation of Stevenson's name was a farewell, not some empty stroke of pedantry. I was he, and I understood. It takes more than life's most dramatic moments to make a Shakespeare, hitting upon memorable phrases. To distract him, I said:"],[111,128,"Without my realizing it, long and studious solitude had prepared me for the docile reception of the miracle. After some thirty days, the dead man's memory had come to animate me fully. For one curiously happy week, I almost believed myself Shakespeare. His work renewed itself for me. I know that for Shakespeare the moon was less the moon than it was Diana, and less Diana than that dark drawn-out word moon. I noted another discovery: Shakespeare's apparent instances of inadvertence\u2014those absences dans l'infini of which Hugo apologetically speaks\u2014were deliberate. Shakespeare tolerated them\u2014or actually interpolated them\u2014so that his discourse, destined for the stage, might appear to be spontaneous, and not overly polished and artificial (nicht allzu glatt und gek\u00fcnstelt). That same goal inspired him to mix his metaphors:"]],[[25,31,"No one answered him. In the little typewriter, one of the agents had found a slip of paper, with this unfinished declaration: The first letter of the Name has been written."],[84,43,"The trip on the streetcar was a long one. At the police station they made me wait, but finally one of the clerks, a man named Eald or Alt, would see me. I told him I had come to discuss a confidential matter."],[85,37,"But it was ten days. I'd almost given up hope when they finally remembered me. I signed what they put in front of me to sign and one of the cops took me over to Calle Cabrera...."]],[[25,260,"The second crime took place on the night of January 3, in the emptiest and most godforsaken of the echoing suburbs on the western outskirts of the capital. Sometime around dawn, one of the mounted gendarmes that patrolled the solitudes of those blocks saw a man, wrapped in a poncho, lying in the doorway of an old paint factory. His hard face looked as though it were wearing a mask of blood; a deep knife wound split his chest. On the wall, across the red and yellow rhombuses, someone had chalked some words, which the gendarme spelled out to himself.... That afternoon, Treviranus and L\u00f6nnrot made their way to the distant scene of the crime. To the left and right of their automobile, the city crumbled away; the sky expanded, and now houses held less and less importance, a brick kiln or a poplar tree more and more. They came to their miserable destination; a final alleyway lined with pink-colored walls that somehow seemed to reflect the rambunctious setting of the sun. By this time, the dead man had been identified. He was Daniel Sim\u00f3n Azevedo, a man of some reputation in the old slums of the Northside, where he had risen from wagon driver to election-day thug, only to degenerate thereafter into a thief and even an informer. (The singular manner of his death seemed fitting: Azevedo was the last representative of a generation of outlaws who used a knife but not a revolver.) The chalked words read as follows: The second letter of the Name has been written."],[32,404,"That a man from the outskirts of Buenos Aires, a sad sort of hoodlum whose only recommendation was his infatuation with courage, should go out into the wilderness of horse country along the Brazilian frontier and become a leader of a band of smugglers\u2014such a thing would, on the face of it, seem impossible. For those who think so, I want to tell the story of the fate of Benjamin Ot\u00e1lora, whom no one may remember anymore in the neighborhood of Balvanera but who died as he lived, by a bullet, in the province of Rio Grande do Sul. I do not know the full details of his adventure; when I am apprised of them, I will correct and expand these pages. For now, this summary may be instructive: In 1891, Benjam\u00edn Ot\u00e1lora is nineteen years old\u2014a strapping young man with a miserly brow, earnest blue eyes, and the strength and stamina of a Basque. A lucky knife thrust has revealed to him that he is a man of courage; he is not distressed by the death of his opponent, or by the immediate need to flee the country. The ward boss of his parish gives him a letter of introduction to a man named Azevedo Bandeira, over in Uruguay. Ot\u00e1loratakes ship; the crossing is stormy, creaking; the next day finds him wandering aimlessly through the streets of Montevideo, with unconfessed and perhaps unrecognized sadness. He doesn't manage to come across Azevedo Bandeira. Toward midnight, in a general-store-and-bar in Paso del Molino, he witnesses a fight between two cattle drovers. A knife gleams; Ot\u00e1lora doesn't know whose side he should be on, but he is attracted by the pure taste of danger, the way other men are attracted by gambling or music. In the confusion, he checks a low thrust meant for a man in a broad-brimmed black hat and a poncho. That man later turns out to be Azevedo Bandeira. (When Ot\u00e1lora discovers this, he tears up the letter of introduction, because he'd rather all the credit be his alone.) Though Azevedo Bandeira is a strong, well-built man, he gives the unjustifiable impression of being something of a fake, a forgery. In his face (which is always too close) there mingle the Jew, the Negro, and the Indian; in his air, the monkey and the tiger; the scar that crosses his face is just another piece of decoration, like the bristling black mustache."],[35,437,"During the last days of June in the year 1870, an order came down for the capture of an outlaw wanted for two murders. The man was a deserter from the forces on the border under the command of Col. Benito Machado; in one drunken spree he had killed a black man in a whorehouse; in another, a resident of the district of Rojas. The report added that he came from Laguna Colorada. It was at Laguna Colorada, forty years earlier, that the montoneros had gathered for the catastrophe that had left their flesh for birds and dogs; Laguna Colorado was where Manuel Mesa's career began, before he was executed in the Plaza de la Victoria as the snare drums rolled to drown out the sound of the man's fury; Laguna Colorada was where the unknown man who fathered Cruz had been born, before he died in a ditch with his skull split by a saber from the battles in Peru and Brazil. Cruz had forgotten the name of the place; with a slight but inexplicable sense of uneasiness he recognized it.... On horseback, the outlaw, harried by the soldiers, wove a long labyrinth of turns and switchbacks, but the soldiers finally cornered him on the night of July 12. He had gone to ground in a field of stubble. The darkness was virtually impenetrable; Cruz and his men, cautiously and on foot, advanced toward the brush in whose trembling depths the secret man lurked, or slept. A crested screamer cried; Tadeo Isidoro Cruz had the sense that he had lived the moment before. The outlaw stepped out from his hiding place to fight them. Cruz glimpsed the terrifying apparition\u2014the long mane of hair and the gray beard seemed to consume his face. A well-known reason prevents me from telling the story of that fight; let me simply recall that the deserter gravely wounded or killed several of Cruz' men. As Cruz was fighting in the darkness (as his body was fighting in the darkness), he began to understand. He realized that one destiny is no better than the next and that every man must accept the destiny he bears inside himself. He realized that his sergeant's epaulets and uniform were hampering him. He realized his deep-rooted destiny as a wolf, not a gregarious dog; he realized that the other man was he himself. Day began to dawn on the lawless plain; Cruz threw his cap to the ground, cried that he was not going to be a party to killing a brave man, and he began to fight against the soldiers, alongside the deserter Mart\u00edn Fierro."],[86,124,"\"There was an Acevedo that had a country place near Pergamino. And there was another brawler of some repute that made his headquarters in that area at the turn of the century\u2014Juan Almanza. From the first man he killed, at the age of fourteen, he always used one of those short knives, because he said it brought him luck. There was bad blood between Juan Almanza and Juan Almada, because people got them mixed up\u2014their names, you see... They kept their eyes open for each other a long time, but somehow their paths never crossed. Juan Almanza was killed by a stray bullet in some election or other. The other one, I think, finally died of old age in the hospital at Las Flores.\""]],[[25,213,"The owner had the following to say: Eight days earlier, Gryphius\u2014a man with sharp features, a nebulous gray beard, and a nondescript black suit\u2014had rented a room above the bar. Finnegan (who generally put the room to a use that Treviranus had no difficulty guessing) had named an exorbitant rent; Gryphius had unhesitatingly paid it. He almost never left the room; he had both lunch and dinner there and hardly ever showed his face in the bar. That night he had come down to Finnegan's office to make a call. A closed coupe had stopped in front of the tavern. The driver hadn't left the driver's seat; some of the customers recalled that he was wearing a bear mask. Two harlequin figures got out of the car; they were short, and no one could fail to notice that they were drunk. They burst into Finnegan's office, party horns bleating, and threw their arms around Gryphius, who apparently recognized them but greeted them somewhat coldly. They exchanged a few words in Yiddish\u2014Gryphius in a low, guttural voice, the harlequins in a sort of falsetto\u2014and then all went up to Gryphius' room. Fifteen minutes later the three men came down again, quite happy; Gryphius was staggering, and seemed to be as drunk as the others."],[45,80,"Another night, as he came back from the motion-picture theater, he felt someone shove him. Furious, indignant, and with secret relief, he turned on the insolent culprit; he spit out a filthy insult. The other man, dumb-founded, stammered an apology. He was a tall young man with dark hair; on his arm was a Germanlooking woman. That night Villari told himself many times that he didn't know them; still, four or five days went by before he went out again."],[84,57,"The police came into the bar one night and frisked everyone. Several of us were taken to the police station\u2014but they didn't mess with Ferrari. Two weeks later the scene was repeated; this second time, they arrested Ferrari too. He had a dagger in his belt. He may have fallen out of favor with the ward boss."],[85,74,"Anyway, while I was sitting in the bar one night, this fellow named Garmendia started trying to pick a fight with me. I ignored him for a while\u2014 playing deaf, you might say\u2014but this Garmendia, who was feeling his liquor, kept egging me on. We finally took it outside; out on the sidewalk, Garmendia turned back a second, pushed the door open again a little, and announced\u2014\"Not to worry, boys, I'll be right back.\""]],[[25,172,"South of the city of my story flows a sluggish stream of muddy water, choked with refuse and thick with the runoff of tanneries. On the other side is a suburb filled with factories where, under the protection of a Barcelona gangster, gunmen prosper. L\u00f6nnrot smiled to think that the most famous of these criminals\u2014Red Scharlach\u2014would have given anything to know about his clandestine visit. Azevedo had been one of Scharlach's gang; L\u00f6nnrot considered the remote possibility that Scharlach was to be the fourth victim, but then rejected it.... He had virtually solved the problem; the mere circumstances, the reality (names, arrests, faces, the paperwork of trial and imprisonment), held very little interest for him now. He wanted to go for a walk, he wanted a respite from the three months of sedentary investigation. He reflected that the explanation for the crimes lay in an anonymous triangle and a dusty Greek word. The mystery seemed so crystal clear to him now, he was embarrassed to have spent a hundred days on it."],[36,285,"To recount with some degree of reality the events of that evening would be difficult, and perhaps inappropriate. One characteristic of hell is its unreality, which might be thought to mitigate hell's terrors but perhaps makes them all the worse. How to make plausible an act in which even she who was to commit it scarcely believed? How to recover those brief hours of chaos that Emma Zunz's memory today repudiates and confuses? Emma lived in Amalgro, on Calle Liniers;we know that that evening she went down to the docks. On the infamous Paseo de Julio she may have seen herself multiplied in mirrors, made public by lights, and stripped naked by hungry eyes\u2014but it is more reasonable to assume that at first she simply wandered, unnoticed, through the indifferent streets.... She stepped into two or three bars, observed the routine or the maneuvers of other women. Finally she ran into some men from the Nordstj\u00e4rnan. One of them, who was quite young, she feared might inspire in her some hint of tenderness, so she chose a different one\u2014perhaps a bit shorter than she, and foul-mouthed\u2014so that there might be no mitigation of the purity of the horror. The man led her to a door and then down a gloomy entryway and then to a tortuous stairway and then into a vestibule (with lozenges identical to those of the house in Lan\u00fas) and then down a hallway and then to a door that closed behind them. The most solemn of events are outside time\u2014whether because in the most solemn of events the immediate past is severed, as it were, from the future or because the elements that compose those events seem not to be consecutive."],[45,215,"Years of solitude had taught him that although in one's memory days all tend to be the same, there wasn't a day, even when a man was in jail or hospital, that didn't have its surprises. During other periods of isolation he had given in to the temptation to count the days (and even the hours), but this isolation was different, because there was no end to it\u2014unless the newspaper should bring him news one morning of the death of Alejandro Villari. It was also possible that Villari was already dead, and then his life was a dream. That possibility disturbed him, because he couldn't quite figure out whether it felt like a relief or a misfortune; he told himself it was absurd, and he discarded it. In now-distant days\u2014distant less because of the lapse of time than because of two or three irrevocable acts\u2014he had desired many things, with a desire that lacked all scruples; that powerful urge to possess, which had inspired the hatred of men and the love of the occasional woman, no longer desired things \u2014it wanted only to endure, wanted not to end. The taste of the mate, the taste of the black tobacco, the growing band of shade that slowly crept across the patio\u2014these were reason enough to live."],[78,134,"It is at this point that the story of Pedro Salvadores truly begins. He lived in that cellar for nine years. No matter how often we tell ourselves that years are made of days, and days of hours, and that nine years is an abstraction, an impossible sum, the story still horrifies and appalls. I suspect that in the darkness that his eyes learned to fathom, he came not to think of anything\u2014not even his hatred or his danger. He was simply there, in the cellar. Now and again, echoes of that world he could not enter would reach him from above: his wife's footsteps as she went about her routine, the, thump of the water pump and the pail, the pelting of rain in the patio. Every day, too, might be his last."]],[[25,133,"The train stopped at a silent loading platform. L\u00f6nnrot got off. It was one of those deserted evenings that have the look of dawn. The air of the murky plains was wet and cold. L\u00f6nnrot began to walk cross-country. He saw dogs, he saw a van or lorry in a dead-end alleyway, he saw the horizon, he saw a silvery horse lapping at the rank water of a puddle. It was growing dark when he saw the rectangular belvedere of Villa Triste-le-Roy, which stood almost as high as the black eucalyptus trees that surrounded it. The thought occurred to him that one dawn and one sunset (an ancient glow in the east and another in the west) were all that separated him from the hour yearned for by the seekers of the Name."],[28,39,"The plains, in the last rays of the sun, were almost abstract, as though seen in a dream. A dot wavered on the horizon, then grew until it became a horseman riding, or so it seemed, toward the house."],[30,148,"From time to time he nodded off, and in his dreams there was the rushing momentum of the train. Now the unbearable white sun of midday was the yellow sun that comes before nightfall and that soon would turn to red. The car was different now, too; it was not the same car that had pulled out of the station in Buenos Aires\u2014 the plains and the hours had penetrated and transfigured it. Outside, the moving shadow of the train stretched out toward the horizon. The elemental earth was not disturbed by settlements or any other signs of humanity. All was vast, but at the same time intimate and somehow secret. In all the immense countryside, there would sometimes be nothing but a bull. The solitude was perfect, if perhaps hostile, and Dahlmann almost suspected that he was traveling not only into the South but into the past."]],[[25,33,"A stairway took him to the belvedere. The moonlight of the evening shone through the lozenges of the windows; they were yellow, red, and green. He was stopped by an astonished, dizzying recollection."],[31,118,"At the end of one corridor, a not unforeseen wall blocked my path\u2014 and a distant light fell upon me. I raised my dazzled eyes; above, vertiginously high above, I saw a circle of sky so blue it was almost purple. The metal treads of a stairway led up the wall. Weariness made my muscles slack, but I climbed the stairs, only pausing from time to time to sob clumsily with joy. Little by little I began to discern friezes and the capitals of columns, triangular pediments and vaults, confused glories carved in granite and marble. Thus it was that I was led to ascend from the blind realm of black and intertwining labyrinths into the brilliant City."],[97,78,"I felt that I had intruded, uninvited, into chaos. Outside, the rain had stopped. I looked at my watch and saw with astonishment that it was almost two a.m. I left the light on and began cautiously to climb back down the ladder. Climbing down what I had once climbed up was not impossible\u2014 climbing down before the inhabitant came back. I conjectured that it hadn't locked the front door and the gate because it hadn't known how."],[99,60,"I went from group to group, telling people what I had seen. Suddenly I was very tired; it may be I had a fever. I slipped away, found Rufino, and we started back home. From the horse we could see the white light of the dawn. More than tired, I felt dazed\u2014as though I'd been caught up in a rapids."],[108,62,"I saw by the clock at the little station that it was past eleven. I began walking through the night toward the hotel. I experienced, as I had at other times in the past, the resignation and relief we are made to feel by those places most familiar to us. The wide gate was open; the large country house itself, in darkness."]],[[25,51,"Scharlach stood there, impassive. He had not participated in the brief struggle, and now moved only to put out his hand for L\u00f6nnrot's revolver. But then he spoke, and L\u00f6nnrot heard in his voice a tired triumphance, a hatred as large as the universe, a sadness no smaller than that hatred."],[26,56,"Hladik did not smoke; he accepted the cigarette out of courtesy, or out of humility. When he lighted it, he saw that his hands were trembling. The day clouded over; the soldiers were speaking in low voices, as though he were already dead. Vainly he tried to recall the woman that Julia de Weidenau had symbolized...."],[28,129,"There is an hour just at evening when the plains seem on the verge of saying something; they never do, or perhaps they do\u2014eternally\u2014 though we don't understand it, or perhaps we do understand but what they say is as untranslatable as music.... From his cot, Recabarren saw the end. A thrust, and the black man dodged back, lost his footing, feigned a slash to his opponent's face, and then lunged out with a deep jab that buried the knife in his belly. Then came another thrust, which the storekeeper couldn't see, and Fierro did not get up. Unmoving, the black man seemed to stand watch over the agonizing death. He wiped off the bloody knife in the grass and walked slowly back toward the houses, never looking back."],[86,51,"No one summoned the courage to intervene. Uriarte had lost ground; Duncan then charged him. Their bodies were almost touching now. Uriarte's blade sought Duncan's face. Abruptly it looked shorter; it had plunged into his chest. Duncan lay on the grass. It was then that he spoke, his voice barely audible:"],[96,59,"His voice was changed. It was not the voice of the thoughtful, deliberate gentleman who presided over our Saturday meetings, nor was it the voice of the feudal seigneur who stopped a knife fight and read the word of God to his gauchos, though it did resemble this latter one. He did not look at any-one when he spoke."]],[[25,267,"\"The first term of the series was given me quite by chance. With some friends of mine\u2014 among them Daniel Azevedo\u2014I had figured out a way to steal the tetrarch's sapphires. Azevedo, however, double-crossed us; he got drunk on the money we had advanced him and pulled the job a day early. But then he got lost in that huge hotel, and sometime around two o'clock in the morning he burst into Yarmolinsky's room. Yarmolinsky, who suffered from insomnia, was sitting at his typewriter typing. As coincidence would have it, he was making some notes, or writing an article perhaps, on the Name of God; he had just typed the words The first letter of the Name has been written. Azevedo told him to keep quiet; Yarmolinsky put out his hand toward the bell that would wake everyone in the hotel; Azevedo stabbed him once in the chest. The movement was almost reflexive; a half century of violence had taught him that the easiest and safest way is simply to kill.... Ten days later I learned from the Yiddische Zeitung that you were trying to find the key to Yarmolinsky's death among Yarmolinsky's writings. I read A History of the Hasidim; I learned that the reverent fear of speaking the Name of God had been the origin of the doctrine that that Name is omnipotent and occult. I learned that some Hasidim, in the quest for that secret Name, had gone so far as to commit human sacrifice.... I realized that you would conjecture that the Hasidim had sacrificed the rabbi; I set about justifying that conjecture."],[26,75,"He had asked God for an entire year in which to finish his work; God in His omnipotence had granted him a year. God had performed for him a secret miracle: the German bullet would kill him, at the determined hour, but in Hladik's mind a year would pass between the order to fire and the discharge of the rifles. From perplexity Hladik moved to stupor, from stupor to resignation, from resignation to sudden gratitude."],[39,203,"In the first volume of Parergaund Paralipomena, I read once more that all things that can occur to a man, from the moment of his birth to the moment of his death, have been predetermined by him. Thus, all inadvertence is deliberate, every casual encounter is an engagement made beforehand, every humiliation is an act of penitence, every failure a mysterious victory, every death a suicide. There is no more cunning consolation than the thought that we have chosen our own misfortunes; that individual theology reveals a secret order, and in a marvelous way confuses ourselves with the deity. What unknown purpose (I thought) had made me seek out that evening, those bullets, this mutilation? Not the fear of war\u2014I knew that; something deeper. At last I believed I understood. To die for a religion is simpler than living that religion fully; battling savage beasts in Ephesus is less difficult (thousands of obscure martyrs did it) than being Paul, the servant of Jesus Christ; a single act is quicker than all the hours of a man. The battle and the glory are easy; Raskolnikov's undertaking was more difficult than Napoleon's. On February 7, 1941, I was made subdirector of the Tarnowitz concentration camp."]],[[26,116,"God, the librarian said, is in one of the letters on one of the pages of one of the four hundred thousand volumes in the Clementine. My parents and my parents' parents searched for that letter; I myself have gone blind searching for it. He removed his spectacles and Hladik saw his eyes, which were dead. A reader came in to return an atlas. This atlas is worthless, he said, and handed it to Hladik. Hladik opened it at random. He saw a map of India\u2014a dizzying page. Suddenly certain, he touched one of the tiny letters. A voice that was everywhere spoke to him: The time for your labor has been granted. Here Hladik awoke."],[92,147,"He leafed through the book, and his fingers opened it to the first verses of the Gospel According to St. Mark. To try his hand at translating, and perhaps to see if they might understand a little of it, he decided that that would be the text he read the Gutres after dinner. He was surprised that they listened first attentively and then with mute fascination. The presence of gold letters on the binding may have given it increased authority. \"It's in their blood,\" he thought. It also occurred to him that throughout history, humankind has told two stories: the story of a lost ship sailing the Mediterranean seas in quest of a beloved isle, and the story of a god who allows himself to be crucified on Golgotha. He recalled his elocution classes in Ramos Mejia, and he rose to his feet to preach the parables."],[108,101,"About twelve days ago, I was giving a lecture in La Plata on Book VI of the \u00c4Eneid. Suddenly, as I was scanning a hexameter, I discovered what my path was to be. I made this decision\u2014and since that moment, I have felt myself invulnerable. You shall one day meet that fate\u2014you shall receive that sudden revelation, in the midst of Latin and Virgil, yet you will have utterly forgotten this curious prophetic dialogue that is taking place in two times and two places. When you next dream it, you shall be who I am, and you shall be my dream.\""]],[[27,206,"These diverse anathemas did have their influence on Runeberg, who partially re-wrote the reprehended book and modified its doctrine. He abandoned the theological ground to his adversaries and proposed oblique arguments o
