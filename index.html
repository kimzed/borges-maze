f a moral order. He admitted that Jesus, \"who could call upon the considerable resources that Omnipotence can offer,\" had no need of a man to carry out His plan for the redemption of all mankind. Then he rebutted those who claimed that we know nothing of the inexplicable betrayer. We know, Runeberg said, that he was one of the apostles, one of those chosen to herald the kingdom of heaven, to heal the sick, cleanse the lepers, raise the dead, and cast out demons (Matthew 10:7-8, Luke 9:1). The acts of a man thus singled out by the Redeemer merit the most sympathetic interpretation we can give them. To impute his crime to greed (as some have done, citing John 12:6) is to settle for the basest motive. Nils Runeberg proposed a motive at the opposite extreme: a hyperbolic, even limitless asceticism. The ascetic, ad majorem Dei gloriam, debases and mortifies the flesh; Judas debased and mortified the spirit. He renounced honor, goodness, peace, the kingdom of heaven, as others, less heroically, renounce pleasure.1"],[33,236,"In the hermetic books, it is written that \"things below are as things above, and things above as things below\"; the Zohar tells us that the lower world is a reflection of the higher. The Histrioni founded their doctrine on a perversion of this idea. They invoked Matthew 6:12 (\"forgive us our debts, as we forgive our debtors\") and 11:12 (\"the kingdom of heaven suffereth violence\") to prove that the earth influences heaven; they cited I Corinthians 13:12 (\"For now we see through a glass, darkly\") to prove that all things we see are false. Contaminated perhaps by the Monotoni, they imagined that every man is two men, and that the real one is the other one, the one in heaven. They also imagined that our acts cast an inverted reflection, so that if we are awake, the other man is asleep; if we fornicate, the other man is chaste; if we steal, the other man is generous. When we die, they believed, we shall join him and be him. (Some echo of these doctrines continues to be heard in Bloy.) Other Histrioni believed that the world would end when the number of its possibilities was exhausted; since there can be no repetitions, the righteous are duty-bound to eliminate (commit) the most abominable acts so that those acts will not sully the future and so that the coming of the kingdom of Jesus may be hastened."],[98,89,"The prescription Whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart is an unmistakable exhortation to purity. Still, many are the members of the Sect who teach that because there is no man under heaven who has not looked upon a woman to desire her, then we have all committed adultery. And since the desire is no less sinful than the act, the just may deliver themselves up without risk of hellfire to the exercise of the most unbridled lustfulness."]],[[27,328,"In Appendix III to his Christelige Dogmatik, Erfjord rebuts this passage. He notes that the crucifixion of God has not ended, because that which happened once in time is repeated endlessly in eternity. Judas, now, continues to hold out his hand for the silver, continues to kiss Jesus' cheek, continues to scatter the pieces of silver in the temple, continues to knot the noose on the field of blood. (In order to justify this statement, Erfjord cites the last chapter of the first volume of Jaromir Hladik's Vindication of Eternity.) To claim that He was man, and yet was incapable of sin, is to fall into contradiction; the attributes impeccabilitas and humanitas are incompatible. Kemnitz will allow that the Redeemer could feel weariness, cold, distress, hunger, and thirst; one might also allow Him to be able to sin and be condemned to damnation. For many, the famous words in Isaiah 53: 2-3, He shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him. He is despised and rejected of men; a man of sorrows, and acquainted with grief, are a foreshadowing of the Crucified Christ at the hour of His death. For some (Hans Lassen Martensen, for example), they are a refutation of the loveliness that the vulgar consensus attributes to Christ; for Runeberg, they are the detailed prophecy not of a moment but of the entire horrendous future, in Time and in Eternity, of the Word made Flesh. God was made totally man, but man to the point of iniquity, man to the point of reprobation and the Abyss. In order to save us, He could have chosen any of the lives that weave the confused web of history: He could have been Alexander or Pythagoras or Rurik or Jesus; he chose an abject existence: He was Judas."],[39,271,"Down through the centuries and latitudes, the names change, the dialects, the faces, but not the eternal antagonists. Likewise, the history of nations records a secret continuity. When Arminius slaughtered the legions of Varus in a swamp, when he slashed their throats, he did not know that he was a forerunner of a German Empire; Luther, the translator of the Bible, never suspected that his destiny would be to forge a nation that would destroy the Bible forever; Christoph zur Linde, killed by a Muscovite bullet in 1758, somehow set the stage for the victories of 1914; Hitler thought he was fighting for a nation, but he was fighting for all nations, even for those he attacked and abominated. It does not matter that his ego was unaware of that; his blood, his will, knew. The world was dying of Judaism, and of that disease of Judaism that is belief in Christ; we proffered it violence and faith in the sword. That sword killed us, and we are like the wizard who weaves a labyrinth and is forced to wander through it till the end of his days, or like David, who sits in judgment on a stranger and sentences him to death, and then hears the revelation: Thou art that man. There are many things that must be destroyed in order to build the new order; now we know that Germany was one of them. We have given something more than our lives; we have given the life of our beloved nation. Let others curse and others weep; I rejoice in the fact that our gift is orbicular and perfect."],[98,59,"The Word was made flesh so that He might be a man among men, so that men might bind Him to the Cross, and be redeemed by Him. He was born from the womb of a woman of the chosen people not simply that He might teach the gospel of Love but also that He might undergo that martyrdom."]],[[28,80,"Recabarren could make out the broad-brimmed hat, the dark poncho, the piebald horse, but not the face of the rider, who finally reined in the horse and came toward the house at an easy trot. Some two hundred yards out, he veered off to the side. At that, the man was out of Recabarren's line of sight, but Recabarren heard him speak, get down off his horse, tie it to the post, and with a firm step enter the bar."],[32,74,"One thrust, he thinks, would be enough to settle that matter. Just then, he sees in the mirror that someone has come into the room. It is the redheaded woman; she is barefoot and half dressed, and staring at him with cold curiosity. Bandeira sits up; while he talks about things out on the range and sips mate after mate, his fingers toy with the woman's hair. Finally, he gives Otalora leave to go."],[83,42,"His tone was half-peremptory, half-cordial. Eduardo stood for a moment looking at him; he didn't know what to do. Cristian stood up, said good-bye to Eduardo\u2014not to Juliana, who was a mere thing\u2014mounted his horse, and rode off at an unhurried trot."]],[[28,38,"\"It'd been longer than seven years that I'd gone without seeing my children. I found them that day, and I wouldn't have it so's I looked to them like a man on his way to a knife fight.\""],[46,42,"\"A judge!\" he said with frail astonishment. \"A judge who is lost and being searched for. The event took place when I was a boy. I know nothing of dates, but Nikal Seyn had not died at the wall at Delhi yet\"\u2014"],[56,90,"That memory may have been followed by others, but the Indian could not live a life that was hemmed about by walls, and one day he went off in search of his wilderness. I would like to know what he felt in that moment of vertigo when past and present intermingled; I would like to know whether the lost son was reborn and died in that ecstatic moment, and whether he ever managed to recognize, even as little as a baby or a dog might, his parents and the house."]],[[28,32,"\"Not like me, anyway,\" said the stranger, who then added, as though thinking out loud: \"Fate would have it that I kill, and now it's put a knife in my hand again.\""],[43,57,"Everything happened again, just as it had before, but this time I understood his words. He said As you slay me now, so shall I slay you, no matter where you flee. I have sworn to foil that threat; I shall hide myself in the center of a labyrinth, so that his shade may lose its way.'"],[103,55,"\"Now I see,\" he said. \"I'm an old friend of Herbert's, whose work I admire; you attacked me, directly or indirectly. Refusing to recommend you would have been a kind of reprisal. I compared the merits of the two of you and the result was... well, we both know what the result was, don't we?\""]],[[28,38,"\"One thing I want to ask you before we get down to it. I want you to put all your courage and all your skill into this, like you did seven years ago when you killed my brother.\""],[83,31,"\"Let's go to work, brother. The buzzards'll come in to clean up after us. I killed'er today. We'll leave'er here, her and her fancy clothes. She won't cause any more hurt.\""],[85,39,"\" I know you're not afraid of him, but think about it\u2014one of two things will happen: either you kill him and you get sent off to stir, or he kills you and you get sent off to Chacarita.\""]],[[29,293,"On one altogether too famous page, Moklosich has equated the members of the cult of the Phoenix with the gypsies. In Chile and in Hungary, there are both gypsies and members of the sect; apart from their ubiquity, the two groups have very little in common. Gypsies are horse traders, pot-makers, blacksmiths, and fortune-tellers; the members of the cult of the Phoenix are generally contented practitioners of the \"liberal professions.\" Gypsies are of a certain physical type, and speak, or used to speak, a secret language; the members of the cult are indistinguishable from other men, and the proof of this is that they have never been persecuted. Gypsies are picturesque, and often inspire bad poets; ballads, photographs, and boleros fail to mention the members of the cult.... Martin Buber says that Jews are essentially sufferers; not all the members of the cult are, and some actively abhor pathos. That public and well-known truth suffices to refute the vulgar error (absurdly defended by Urmann) which sees the roots of the Phoenix as lying in Israel. People's reasoning goes more or less this way: Urmann was a sensitive man; Urmann was a Jew; Urmann made a habit of visiting the members of the cult in the Jewish ghettos of Prague; the affinity that Urmann sensed proves a real relationship. In all honesty, I cannot concur with that conclusion. That the members of the cult should, in a Jewish milieu, resemble Jews proves nothing; what cannot be denied is that they, like Hazlitt's infinite Shakespeare, resemble every man in the world. They are all things to all men, like the Apostle; a few days ago, Dr. Juan Francisco Amaro, of Paysand\u00fa, pondered the ease with which they assimilate, the ease with which they \"naturalize\" themselves."],[89,92,"We all think that fate has dealt us a wretched sort of lot in life, and that others must be better. The cult of gauchos and the Beatus ilk... are urban nostalgias; Clara Glencairn and Marta Pizarra, weary of the routines of idleness, yearned for the world of artists\u2014men and women who devoted their lives to the creation of beautiful things. I presume that in the heaven of the Blessed there are those who believe that the advantages of that locale are much exaggerated by theologists, who have never been there themselves."],[93,113,"I am writing this now in Glasgow. I have told of my stay among the Yahoos, but not of its essential horror, which never entirely leaves me, and which visits me in dreams. In the street, I sometimes think I am still among them. The Yahoos, I know, are a barbarous people, perhaps the most barbarous of the earth, but it would be an injustice to overlook certain redeeming traits which they possess. They have institutions, and a king; they speak a language based on abstract concepts; they believe, like the Jews and the Greeks, in the divine origins of poetry; and they sense that the soul survives the death of the body."]],[[30,105,"Though blind to guilt, fate can be merciless with the slightest distractions. That afternoon Dahlmann had come upon a copy (from which some pages were missing) of Weil's Arabian Nights; eager to examine his find, he did not wait for the elevator\u2014he hurriedly took the stairs. Something in the dimness brushed his forehead\u2014a bat? a bird? On the face of the woman who opened the door to him, he saw an expression of horror, and the hand he passed over his forehead came back red with blood. His brow had caught the edge of a recently painted casement window that somebody had forgotten to close."],[94,69,"I realized that he was barely listening. The elemental fear of the impossible yet true had come over him, and he was daunted. I, who have never been a father, felt a wave of love for that poor young man who was dearer to me than a child of my own flesh and blood. I saw that his hands were clutching a book. I asked what he was reading."],[106,61,"Summer was drawing to a close, and I realized that the book was monstrous. It was cold consolation to think that I, who looked upon it with my eyes and fondled it with my ten flesh-and-bone fingers, was no less monstrous than the book. I felt it was a nightmare thing, an obscene thing, and that it defiled and corrupted reality."]],[[30,151,"Reality is partial to symmetries and slight anachronisms; Dahlmann had come to the sanatorium in a cab, and it was a cab that took him to the station at Plaza Constituci\u00f3n. The first cool breath of autumn, after the oppression of the summer, was like a natural symbol of his life brought back from fever and the brink of death. The city, at that seven o'clock in the morning, had not lost that look of a ramshackle old house that cities take on at night; the streets were like long porches and corridors, the plazas like interior courtyards. After his long stay in hospital, Dahlmann took it all in with delight and a touch of vertigo; a few seconds before his eyes registered them, he would recall the corners, the marquees, the modest variety of Buenos Aires. In the yellow light of the new day, it all came back to him."],[41,165,"At wakes, the progress of corruption allows the dead person's body to recover its former faces. At some point on the confused night of June 6, Teodelina Villar magically became what she had been twenty years before; her features recovered the authority that arrogance, money, youth, the awareness of being the cr\u00e8me de la cr\u00e8me, restrictions, a lack of imagination, and stolidity can give. My thoughts were more or less these: No version of that face that had so disturbed me shall ever be as memorable as this one; really, since it could almost be the first, it ought to be the last. I left her lying stiff among the flowers, her contempt for the world growing every moment more perfect in death. It was about two o'clock, I would guess, when I stepped into the street. Outside, the predictable ranks of one- and two-story houses had taken on that abstract air they often have at night, when they are simplified by darkness and silence."],[45,81,"One night he was left shocked, speechless, and trembling by a burst of pain deep in his mouth, striking almost at the heart of him. Within a few minutes, that horrible miracle returned, and then again toward dawn. The next day Villari sent for a cab, which left him at a dentist's office in the neighborhood of Plaza del Once. There, his tooth was pulled. At the \"moment of truth,\" he was neither more cowardly nor more composed than anyone else."],[47,61,"Out in the street, on the steps of the Constituci\u00f3n Station, in the subway, all the faces seemed familiar. I feared there was nothing that had the power to surprise or astonish me anymore, I feared that I would never again be without a sense of d\u00e9j\u00e0 vu. Fortunately, after a few unsleeping nights, forgetfulness began to work in me again."],[104,42,"On August 25, Avelino Arredondo woke up at a little past nine. He thought first of Clara, and only later of what day it was. Good-bye to all this work of waiting \u2014 I've made it, he said to himself in relief."]],[[30,63,"From that fantastic conjecture he was distracted by the conductor, who seeing Dahlmann's ticket informed him that the train would not be leaving him at the usual station, but at a different one, a little before it, that Dahlmann barely knew. (The man added an explanation that Dahlmann didn't try to understand, didn't even listen to, because the mechanics of it didn't matter.)"],[45,91,"The coachman helped him lift down his trunk; a distracted- or weary-looking woman finally opened the door. From the driver's seat, the coachman handed the man back one of the coins, a Uruguayan two-centavo piece that had been in the man's pocket since that night in the hotel in Melo. The man gave him forty centavos, and instantly regretted it: \"I must act so that everyone will forget me. I've made two mistakes: I've paid with a coin from another country and I've let this man see that the mistake matters.\""],[91,88,"He begged me not to concern myself about the arrangements for his trip. (\"Negotiatives\" was the horrendous word he used.) Then in one motion he extracted from his briefcase a letter addressed to the minister, in which I explained the reasons for my withdrawal and listed the acknowledged virtues of Dr. Zimmermann, and he laid in my hand his fountain pen so that I might sign it. When he put the letter away, I could not help seeing in his briefcase his stamped ticket for the Ezeiza-Sulaco flight."]],[[30,154,"Dahlmann made himself comfortable near the window. Little by little, darkness was enveloping the countryside, but the smells and sounds of the plains still floated in through the thick iron grate at the window. The store-keeper brought him sardines and then roast meat; Dahlmann washed them down with more than one glass of red wine. Idly, he savored the harsh bouquet of the wine and let his gaze wander over the store, which by now had turned a little sleepy. The kerosene lantern hung from one of the beams. There were three customers at the other table: two looked like laborers; the other, with coarse, Indian-like features, sat drinking with his wide-brimmed hat on. Dahlmann suddenly felt something lightly brush his face. Next to the tumbler of cloudy glass, on one of the stripes in the tablecloth, lay a little ball of wadded bread. That was all, but somebody had thrown it at him."],[84,162,"One night I came into the bar to find the old man, don Eliseo, who had taken his place again beside Ferrari, in whispered conversation with him. They were plotting something. From the other end of the table, I thought I heard the name Weidemann\u2014Weidemann's weaving mill stood on the out-skirts of the neighborhood. In a few minutes Ferrari and don Eliseo sent me off to have a look around the factory. I was given no explanation, but I was told to pay special attention to the doors. Night was falling when I crossed the Maldonado and the railroad tracks. I recall a few scattered houses, a stand of willow trees, and vacant lots. The factory was new, but it had a soli-tary, seedy look about it; in my memory now, its reddish color mingles with the sunset. There was a fence around it. Besides the main door, there were two doors in back, facing south, that opened directly into the workshops."],[85,157,"It was about eleven o'clock one night; I had gone into the old-fashioned general-store-andbar, which is now simply a bar, on the corner of Bolivar and Venezuela. As I went in, I noticed that over in a corner, sitting at one of the little tables, was a man I had never seen before. He hissed to catch my eye and motioned me to come over. He must have looked like a man that one didn't want to cross, because I went at once toward his table. I felt, inexplicably, that he had been sitting there for some time, in that chair, before that empty glass. He was neither tall nor short; he looked like an honest craftsman, or perhaps an old-fashioned country fellow. His sparse mustache was grizzled. A bit stiff, as Porte\u00f1os tend to be, he had not taken off his neck scarf. He offered to buy me a drink; I sat down and we chatted."]],[[30,88,"The young thug with the Indian-looking face stood up, stumbling as he did so. At one pace from Dahlmann, he shouted insults at him, as though he were far away. He was playacting, exaggerating his drunkenness, and the exaggeration produced an impression both fierce and mocking. Amid curses and obscenities, the man threw a long knife into the air, followed it with his eyes, caught it, and challenged Dahlmann to fight. The storekeeper's voice shook as he objected that Dahlmann was unarmed. At that point, something unforeseeable happened."],[38,33,"\"Dami\u00e1n? Pedro Dami\u00e1n?\" the colonel said. \"He served with me. A little Indian-like fellow the boys called Dayman.\" He began a noisy laugh, but suddenly cut it off, with real or pretended discomfort."],[86,162,"Uriarte was shouting that Duncan had been cheating. The others were standing around them. Duncan, I recall, was taller than the others; he was a sturdy-looking, inexpressive man a bit heavy in the shoulders, and his hair was so blond that it was almost white. Maneco Uriarte was a man of many nervous gestures and quick movements; he was dark, with features that revealed, perhaps, some trace of Indian blood, and a sparse, petulant mustache. Clearly, they were all drunk; I cannot say for certain whether there were two or three bottles scattered about on the floor or whether the cinematographer's abuses have planted that false memory in my mind. Uriarte's cutting (and now obscene) insults never ceased. Duncan seemed not to hear him; finally he stood up, as though weary, and hit Uriarte, once, in the face. Uriarte screamed\u2014from the floor where he now lay sprawling\u2014that he was not going to tolerate such an affront, and he challenged Duncan to fight."]],[[31,316,"We ranged the width and breadth of other deserts\u2014deserts of black sand, where the traveler must usurp the hours of the night, for the fervency of the day is unbearable. From afar I made out the mountain which gives its name to the Ocean; on its slopes grows the euphorbia, an antidote to poisons, and on its peak live the Satyrs, a nation of wild and rustic men given to lasciviousness. That the bosom of those barbaric lands, where the Earth is the mother of monsters, might succor a famous city\u2014such a thing seemed unthinkable to us all. Thus we continued with our march, for to have regressed would have been to dishonor ourselves. Some of the men, those who were most temerarious, slept with their faces exposed to the moon; soon they burned with fever. With the depraved water of the watering holes others drank up insanity and death. Then began the desertions; a short time afterward, the mutinies. In repressing them I did not hesitate to employ severity. In that I acted justly, but a centurion warned me that the mutineers (keen to avenge the crucifixion of one of their number) were weaving a plot for my death. I fled the camp with the few soldiers who were loyal to me; in the desert, among whirlwinds of sand and the vast night, we became separated. A Cretan arrow rent my flesh. For several days I wandered without finding water\u2014or one huge day multiplied by the sun, thirst, and the fear of thirst. I left my path to the will of my horse. At dawn, the distance bristled with pyramids and towers. I dreamed, unbearably, of a small and orderly labyrinth at whose center lay a well; my hands could almost touch it, my eyes see it, but so bewildering and entangled were the turns that I knew I would die before I reached it."],[41,264,"Until the end of June I distracted myself by composing a tale of fantasy. The tale contains two or three enigmatic circumlocutions\u2014 sword-water instead of blood, for example, and dragon's-bed for gold \u2014and is written in the first person. The narrator is an ascetic who has renounced all commerce with mankind and lives on a kind of moor. (The name of the place is Gnita-heidr.) Because of the simplicity and innocence of his life, he is judged by some to be an angel; that is a charitable sort of exaggeration, because no one is free of sin\u2014he himself (to take the example nearest at hand) has cut his father's throat, though it is true that his father was a famous wizard who had used his magic to usurp an infinite treasure to himself. Protecting this treasure from cankerous human greed is the mission to which the narrator has devoted his life; day and night he stands guard over it. Soon, perhaps too soon, that watchfulness will come to an end: the stars have told him that the sword that will sever it forever has already been forged. (The name of the sword is Gram.) In an increasingly tortured style, the narrator praises the lustrousness and flexibility of his body; one paragraph offhandedly mentions \"scales\"; another says that the treasure he watches over is of red rings and gleaming gold. At the end, we realize that the ascetic is the serpent Fafnir and the treasure on which the creature lies coiled is the gold of the Nibelungen. The appearance of Sigurd abruptly ends the story."],[101,234,"\"Thus began the adventure that was to last for so many winters. I shall not tell its hazards, nor shall I attempt to recall the true order of its vicissitudes. I was oarsman, slave merchant, slave, woodcutter, robber of caravans, cantor, assayer of deep water and of metals. I suffered a year's captivity in the mercury mines, which loosens the teeth. I fought with men from Sweden in the militia of Mikligarthr\u2014 Constantinople. On the banks of the Azov I was loved by a woman I shall never forget; I left her, or she left me, which is the same. I betrayed and was betrayed. More than once fate made me kill. A Greek soldier challenged me to fight him, and offered me the choice of two swords. One was a handspan longer than the other. I realized that he was trying to intimidate me, so I chose the shorter. He asked me why. I told him that the distance from my hand to his heart did not vary. On the shore of the Black Sea sits the runic epitaph I carved for my comrade Leif Arnarson. I have fought with the Blue Men of Serkland, the Saracens. In the course of time I have been many men, but that whirlwind of events was one long dream. The essential thing always was the Word. There were times when I did not believe in it."]],[[31,130,"Out of avidity to see the Immortals, to touch that more than human City, I could hardly sleep. And as though the Troglodytes could divine my goal, they did not sleep, either. At first I presumed they were keeping a watch over me; later, I imagined that my uneasiness had communicated itself to them, as dogs can be infected in that way. For my departure from the barbarous village I chose the most public of times, sunset, when almost all the men emerged from their holes and crevices in the earth and gazed out unseeingly toward the west. I prayed aloud, less to plead for divine favor than to intimidate the tribe with articulate speech. I crossed the stream bed clogged with sandbars and turned my steps toward the City."],[42,103,"At that, my soul was filled with holiness. I imagined to myself the first morning of time, imagined my god entrusting the message to the living flesh of the jaguars, who would love one another and engender one another endlessly, in caverns, in cane fields, on islands, so that the last men might receive it. I imagined to myself that web of tigers, that hot labyrinth of tigers, bringing terror to the plains and pastures in order to preserve the design. In the other cell, there was a jaguar; in its proximity I sensed a confirmation of my conjecture, and a secret blessing."],[46,179,"I felt, almost immediately, the infinite presence of a spell cast to hide Glencairn's whereabouts. There is not a soul in this city (I came to suspect) that doesn't know the secret, and that hasn't sworn to keep it. Most people, when I interrogated them, pleaded unbounded ignorance; they didn't know who Glencairn was, had never seen the man, never heard of him. Others, contrariwise, had seen him not a quarter of an hour ago talking to Such-andsuch, and they would even show me the house the two men had gone into, where of course nobody knew a thing about them\u2014or where I'd just missed them, they'd left just a minute earlier. More than once I balled my fist and hit one of those tellers of precisely detailed lies smack in the face. Bystanders would applaud the way I got my frustrations off my chest, and then make up more lies. I didn't believe them, but I didn't dare ignore then. One evening somebody left me an envelope containing a slip of paper on which were written some directions...."],[106,128,"I showed no one my treasure. To the joy of possession was added the fear that it would be stolen from me, and to that, the suspicion that it might not be truly infinite. Those two points of anxiety aggravated my already habitual misanthropy. I had but few friends left, and those, I stopped seeing. A prisoner of the Book, I hardly left my house. I examined the worn binding and the covers with a magnifying glass, and rejected the possibility of some artifice. I found that the small illustrations were spaced at two-thousand-page intervals. I began noting them down in an alphabetized notebook, which was very soon filled. They never repeated themselves. At night, during the rare intervals spared me by insomnia, I dreamed of the book."],[109,232,"After a few nights I realized that these false alarms were a sort of routine. Like Daniel Defoe, the men of the village were skilled at inventing circumstantial details. The tiger might be glimpsed at any hour, out toward the rice fields to the south or up toward the jungle to the north, but it did not take me long to realize that there was a suspicious regularity in the way the villagers seemed to take turns spotting it. My arrival upon the scene of the sighting invariably coincided with the precise instant that the tiger had just run off. I was always shown a trail, a paw mark, some broken twig, but a man's fist can counterfeit a tiger's prints. Once or twice I witnessed a dead dog. One moonlit night we staked out a goat as a lure, but we watched fruitlessly until dawn. I thought at first that these daily fables were meant to encourage me to prolong my stay, for it did benefit the village\u2014the people sold me food and did domestic chores for me. To verify this conjecture, I told them that I was thinking of moving on to another region, downstream, in quest of the tiger. I was surprised to find that they welcomed my decision. I continued to sense, however, that there was a secret, and that every-one was keeping a wary eye on me."],[111,138,"In spite of that long night without sleep, I hardly slept at all the following night. I found, as I had so many times before, that I was a coward. Out of fear of disappointment, I could not deliver myself up to openhanded hope. I preferred to think that Thorpe's gift was illusory. But hope did, irresistibly, come to prevail. I would possess Shakespeare, and possess him as no one had ever possessed anyone before\u2014not in love, or friendship, or even hatred. I, in some way, would be Shakespeare. Not that I would write the tragedies or the intricate sonnets\u2014but I would recall the instant at which the witches (who are also the Fates) had been revealed to me, the other instant at which I had been given the vast lines: And shake the yoke of inauspicious stars"]],[[31,267,"I have said that the City was builded on a stone plateau. That plateau, with its precipitous sides, was as difficult to scale as the walls. In vain did my weary feet walk round it; the black foundation revealed not the slightest irregularity, and the invariance of the walls proscribed even a single door. The force of the day drove me to seek refuge in a cavern; toward the rear there was a pit, and out of the pit, out of the gloom below, rose a ladder. I descended the ladder and made my way through a chaos of squalid galleries to a vast, indistinct circular chamber. Nine doors opened into that cellarlike place; eight led to a maze that returned, deceitfully, to the same chamber; the ninth led through another maze to a second circular chamber identical to the first. I am not certain how many chambers there were; my misery and anxiety multiplied them. The silence was hostile, and virtually perfect; aside from a subterranean wind whose cause I never discovered, within those deep webs of stone there was no sound; even the thin streams of iron-colored water that trickled through crevices in the stone were noiseless. Horribly, I grew used to that dubious world; it began to seem incredible that anything could exist save nine-doored cellars and long, forking subterranean corridors. I know not how long I wandered under the earth; I do know that from time to time, in a confused dream of home, I conflated the horrendous village of the barbarians and the city of my birth, among the clusters of grapes."],[43,64,"To the sound of their footsteps was added the sound of rain. It occurred to Unwin that they would have to sleep in the labyrinth, in the central chamber of the tale, and that in retrospect he would surely see that long discomfort as adventure. He remained silent. Dunraven could not contain himself; like a man who will not forgive a debt, he asked:"],[99,98,"Without making a sound I crept over to one of the doors, which opened into a narrow hallway and a flight of stairs. Upstairs, I hid in a dark bedroom. Except for the bed, which was a low, squat affair, I couldn't say what sort of furniture there might have been. I was shaking all over. Downstairs there was yelling and shrieking, and then the sound of breaking glass. I heard a woman's footsteps coming up the stairs, and then I saw a slice of light. Then the voice of the Captive called me, almost in a whisper."]],[[31,70,"I emerged into a kind of small plaza\u2014a courtyard might better describe it. It was surrounded by a single building, of irregular angles and varying heights. It was to this heterogeneous building that the many cupolas and columns belonged. More than any other feature of that incredible monument, I was arrested by the great antiquity of its construction. I felt that it had existed before humankind, before the world itself."],[94,64,"Some five hundred yards to my right there was a tall building whose name I never learned. Large chunks of ice were floating down the gray current. Inevitably, the river made me think of time... Heraclitus' ancient image. I had slept well; the class I'd given the previous evening had, I think, managed to interest my students. There was not a soul in sight."],[96,39,"We saw the building from a distance. A score or so of men had raised a sort of amphitheater, still in bits and pieces. I recall scaffolding, and tiers of seats through which one could glimpse stretches of sky."]],[[31,92,"I cannot recall the stages by which I returned, nor my path through the dusty, humid crypts. I know only that I was accompanied by the constant fear that when I emerged from the last labyrinth I would be surrounded once again by the abominable City of the Immortals. I remember nothing else. That loss of memory, now insurmountable, was perhaps willful; it is possible that the circumstances of my escape were so unpleasant that on some day no less lost to memory I swore to put them out of my mind."],[42,73,"I have lost count of the years I have lain in this darkness; I who once was young and could walk about this prison do nothing now but wait, in the posture of my death, for the end the gods have destined for me. With the deep flint blade I have opened the breast of victims, but now I could not, without the aid of magic, lift my own body from the dust."],[109,36,"For several days I imposed upon myself the private obligation to think continually about the stones, because I knew that forgetting them was possible only for a moment, and that rediscovering my torment would be unbearable."]],[[31,118,"Those who have read the story of my travails attentively will recall that a man of the Troglodyte tribe had followed me, as a dog might have, into the jagged shadow of the walls. When I emerged from the last cellar, I found him at the mouth of the cavern. He was lying in the sand, clumsily drawing and rubbing out a row of symbols that resembled those letters in dreams that one is just on the verge of understanding when they merge and blur. At first I thought that this was some sort of barbaric writing; then I realized that it was absurd to imagine that men who had never learned to speak should have invented writing."],[93,83,"The intellectual power of abstraction demanded by such a language suggests to me that the Yahoos, in spite of their barbarity, are not a primitive people but a degenerate one. This conjecture is confirmed by inscriptions which I have discovered up on the tableland. The characters employed in these inscriptions, resembling the runes that our own forebears carved, can no longer be deciphered by the tribe; it is as though the tribe had for-gotten the written language and retained only the spoken one."],[101,46,"As one might imagine, the use of pen, inkhorn, and parchment is unknown to them. They carve their characters in stone, as our forebears carved the runes revealed to them by Odin, after having hung from the ash tree\u2014 Odin sacrificed to Odin\u2014for nine long nights."]],[[31,172,"Nor did any one of the shapes resemble any other\u2014a fact that ruled out (or made quite remote) the possibility that they were symbols. The man would draw them, look at them, and correct them. Then suddenly, as though his game irritated him, he would rub them out with his palm and forearm. He looked up at me, though he seemed not to recognize me. Still, so great was the relief I felt (or so great, so dreadful had my loneliness been) that I actually thought that this primitive Troglodyte looking up at me from the floor of a cave had been waiting for me. The sun warmed the plain; as we began our return to the village, under the first stars of evening, the sand burned our feet. The Troglodyte walked ahead of me; that night I resolved to teach him to recognize, perhaps even to repeat, a few words. Dogs and horses, I reflected, are able to do the first; many birds, like the Caesars' nightingale, can do the second."],[42,82,"Long years I devoted to learning the order and arrangement of the spots on the tiger's skin. During the course of each blind day I was granted an instant of light, and thus was I able to fix in my mind the black shapes that mottled the yellow skin. Some made circles; others formed transverse stripes on the inside of its legs; others, ringlike, occurred over and over again\u2014perhaps they were the same sound, or the same word. Many had red borders."],[65,63,"In a hallway I saw a sign with an arrow pointing the way, and I was struck by the thought that that inoffensive symbol had once been a thing of iron, an inexorable, mortal projectile that had penetrated the flesh of men and lions and clouded the sun of Thermopylae and bequeathed to Harald Sigurdson, for all time, six feet of English earth."],[101,96,"\"I am of the line of skalds; the moment I learned that the poetry of the Urns is a poetry of a single word, I went in quest of them, in quest of the route that would lead me to their land. Not without weariness and labor did I reach it, one year later. It was night; I noticed that the men I met along my way regarded me curiously, and I could not fail to note that I was struck by an occasional stone. I saw the glow of a smith's forge, and I entered."],[109,92,"The ground was cracked and sandy. In one of the cracks\u2014which by the way were not deep, and which branched into others\u2014I caught a glimpse of a color. Incredibly, it was the same color as the tiger of my dreams. I wish I had never laid eyes on it. I looked closely. The crevice was full of little stones, all alike, circular, just a few centimeters in diameter and very smooth. Their regularity lent them an air almost of artificiality, as though they were coins, or buttons, or counters in some game."]],[[31,57,"Death (or reference to death) makes men precious and pathetic; their ghostliness is touching; any act they perform may be their last; there is no face that is not on the verge of blurring and fading away like the faces in a dream. Everything in the world of mortals has the value of the irrecoverable and contingent."],[63,134,"Things, events, that occupy space yet come to an end when someone dies may make us stop in wonder\u2014and yet one thing, or an infinite number of things, dies with every man's or woman's death, unless the universe itself has a memory, as theosophists have suggested. In the course of time there was one day that closed the last eyes that had looked on Christ; the Battle of Junin and the love of Helen died with the death of one man. What will die with me the day I die? What pathetic or frail image will be lost to the world? The voice of Macedonia Fernandez, the image of a bay horse in a vacant lot on the corner of Sarrano and Charcas, a bar of sulfur in the drawer of a mahogany desk?"],[67,70,"Those features are lost to us, as a magical number created from our customary digits can be lost, as the image in a kaleidoscope is lost forever. We can see them and yet not grasp them. A Jew's profile in the subway might be the profile of Christ; the hands that give us back change at a ticket booth may mirror those that soldiers nailed one day to the cross."]],[[31,113,"... A year has passed, and I reread these pages. I can attest that they do not stray beyond the bounds of truth, although in the first chapters, and even in certain paragraphs of others, I believe I detect a certain falseness. That is due, perhaps, to an over-employment of circumstantial details, a way of writing that I learned from poets; it is a procedure that infects everything with falseness, since there may be a wealth of details in the event, yet not in memory.... I believe, nonetheless, that I have discovered a more private and inward reason. I will reveal it; it does not matter that I may be judged a fantast."],[76,65,"Poetry is no less mysterious than the other elements of the orb. A lucky line here and there should not make us think any higher of ourselves, for such lines are the gift of Chance or the Spirit; only the errors are our own. I hope the reader may find in my pages something that merits being remembered; in this world, beauty is so common."],[94,134,"Except in the austere pages of history, memorable events go unaccompanied by memorable phrases. A man about to die tries to recall a print that he glimpsed in his childhood; soldiers about to go into battle talk about the mud or their sergeant. Our situation was unique and, frankly, we were unprepared. We talked, inevitably, about literature; I fear I said no more than I customarily say to journalists. My alter ego believed in the imagination, in creation\u2014in the discovery of new metaphors; I myself believed in those that correspond to close and widely acknowledged likenesses, those our imagination has already accepted: old age and death, dreams and life, the flow of time and water. I informed the young man of this opinion, which he himself was to express in a book, years later."],[111,56,"I realized that the three faculties of the human soul\u2014memory, understanding, and will\u2014are not some mere Scholastic fiction. Shakespeare's memory was able to reveal to me only the circumstances of the man Shakespeare. Clearly, these circumstances do not constitute the uniqueness of the poet; what matters is the literature the poet produced with that frail material."]],[[31,68,"As the end approaches, there are no longer any images from memory\u2014 there are only words. It is not strange that time may have confused those that once portrayed me with those that were symbols of the fate of the person that accompanied me for so many centuries. I have been Homer; soon, like Ulysses, I shall be Nobody; soon, I shall be all men\u2014I shall be dead."],[41,134,"Before the year 1948, Julia's fate will have overtaken me. I will have to be fed and dressed, I will not know whether it's morning or night, I will not know who the man Borges was. Calling that future terrible is a fallacy, since none of the future's circumstances will in any way affect me. One might as well call \"terrible\" the pain of an anesthetized patient whose skull is being trepanned. I will no longer perceive the universe, I will perceive the Zahir. Idealist doctrine has it that the verbs \"to live\" and \"to dream\" are at every point synonymous; for me, thousands upon thousands of appearances will pass into one; a complex dream will pass into a simple one. Others will dream that I am mad, while I dream of the Zahir."],[42,104,"Let the mystery writ upon the jaguars die with me. He who has glimpsed the universe, he who has glimpsed the burning designs of the universe, can have no thought for a man, for a man's trivial joys or calamities, though he himself be that man. He was that man, who no longer matters to him. What does he care about the fate of that other man, what does he care about the other man's nation, when now he is no one? That is why I do not speak the formula, that is why, lying in darkness, I allow the days to forget me."],[108,50,"\"Not for me,\" he said shortly. \"For me, there's almost no time left. At any moment I may die, at any moment I may fade into that which is un-known to me, and still I dream these dreams of my double... that tiresome subject I got from Stevenson and mirrors.\""]],[[31,52,"To my way of thinking, that conclusion is unacceptable. As the end approaches, wrote Cartaphilus, there are no longer any images from memory \u2014 there are only words. Words, words, words taken out of place and mutilated, words from other men\u2014those were the alms left him by the hours and the centuries."],[47,36,"I come now to the ineffable center of my tale; it is here that a writer's hopelessness begins. Every language is an alphabet of symbols the employment of which assumes a past shared by its interlocutors."],[91,54,"The linear nature of language, wherein each word occupies its own place on the page and its own instant in the reader's mind, unduly distorts the things we would make reference to; in addition to the visual trivialities that I have listed, the man gave one the impression of a past dogged by adversity."]],[[32,231,"This life is new to him, and sometimes terrible, and yet it is in his blood, for just as the men of other lands worship the sea and can feel it deep inside them, the men of ours (including the man who weaves these symbols) yearn for the inexhaustible plains that echo under the horses' hooves. Ot\u00e1lora has been brought up in neighborhoods full of cart drivers and leather braiders; within a year, he has become a gaucho. He learns to ride, to keep the horses together, to butcher the animals, to use the rope that lassos them and the bolas that bring them down, to bear up under weariness, storms, cold weather, and the sun, to herd the animals with whistles and shouts. Only once during this period of apprenticeship does he see Azevedo Bandeira, but he is always aware of his presence, because to be a \"Bandeira man\" is to be taken seriously\u2014in fact, to be feared\u2014and because no matter the deed of manly strength or courage they see done, the gauchos say Bandeira does it better. One of them says he thinks Bandeira was born on the other side of the Cuareim, in Rio Grande do Sul; that fact, which ought to bring him down a notch or two in their estimation, lends his aura a vague new wealth of teeming forests, swamps, impenetrable and almost infinite distances."],[35,221,"There are many gaps in his dark and courageous story. In about 1868, we come across him again on the Pergamino: married or domesticated, the father of a son, the owner of a parcel of land. In 1869 he was made sergeant of the rural police. He had set his past right; at that point in his life, he should have considered himself a happy man, though deep down he wasn't. (In the future, secretly awaiting him, was one lucid, fundamental night\u2014 the night when he was finally to see his own face, the night when he was finally to hear his own true name. Once fully understood, that night encompasses his entire story\u2014or rather, one incident, one action on that night does, for actions are the symbol of our selves.) Any life, however long and complicated it may be, actually consists of a single moment \u2014the moment when a man knows forever more who he is. It is said that Alexander of Macedonia saw his iron future reflected in the fabulous story of Achilles; Charles XII of Sweden, in the story of Alexander. It was not a book that revealed that knowledge to Tadeo Isidoro Cruz, who did not know how to read; he saw himself in a hand-to-hand cavalry fight and in a man. This is how it happened:"],[38,70,"There was one shoot-out with the Zumacos where he'd acted like a man, but it was another thing when the armies squared off and the cannon started in and every man felt like five thousand other men had ganged up to kill'im. Poor little mestizo bastard, he'd spent his whole life dipping sheep, and all of a sudden he'd gotten himself swept up in that call to defend the nation...."],[78,239,"A man, a woman, and the vast shadow of a dictator are the story's three protagonists. The man's name was Pedro Salvadores; my grandfather Acevedo was a witness to his existence, a few days or weeks after the Battle of Monte Caseros. There may have been no real difference between Pedro Salvadores and the common run of mankind, but his fate, the years of it, made him unique. He was a gentleman much like the other gentlemen of his day, with a place in the city and some land (we may imagine) in the country; he was a member of the Unitarian party. His wife's maiden name was Planes; they lived together on Calle Suipacha, not far from the corner of Temple. The house in which the events took place was much like the others on the street: the front door, the vestibule, the inner door, the rooms, the shadowy depth of the patios. One night in 1842, Pedro Salvadores and his wife heard the dull sound of hoofbeats coming closer and closer up the dusty street, and the wild huzzahs and imprecations of the horses' riders. But this time the horsemen of the tyrant's posse did not pass them by. The whooping and shouting became insistent banging on the door. Then, as the men were breaking down the door, Salvadores managed to push the dining table to one side, lift the rug, and hide himself in the cellar."],[90,224,"Manuel Cardoso's and Carmen Silveira's small ranches bordered one another. As with the origins of other passions, the origins of a hatred are al-ways obscure, but there was talk of a dispute over some unmarked animals, or, alternately, of a bareback horse race during which Silveira, who was the stronger, had bumped Cardoso's horse off the track. Months later, in the town's general store, there had been a long game of two-handed truco; Silveira congratulated his opponent on his play to virtually every trick, but he left him at the end without a penny. As he was raking the money into his purse, he thanked Cardoso for the lesson he had given him. It was then, I think, that they almost came to blows. The game had been hard fought; the onlookers (there had been many) had to separate them. On that frontier and at that time, man stood up to man and blade to blade; an unusual feature of this story is, as we will see, that Manuel Cardoso and Carmen Silveira crossed paths up in the mountains twice a day, morning and evening, though they never actually fought until the end. Perhaps their only possession in their coarse primitive lives was their hatred, and therefore they saved it and stored it up. Without suspecting, each of the two became the other's slave."]],[[32,93,"Another year goes by before Otalora returns to Montevideo. They ride through the outskirts, and then through the city (which seems enormous to Otalora); they come to the boss's house; the men lay out their bedrolls in the back patio. Days go by, and Otalora hasn't seen Bandeira. They say, timorously, that he's sick; a black man takes the kettle and mate up to him in his room. One afternoon, Otalora is asked to carry the things up to Bandeira. He feels somehow humiliated by this, but derives some pride from it, too."],[78,67,"His wife moved the table back into place. The posse burst into the house; they had come to get Salvadores. His wife told them he'd fled\u2014to Montevideo, she told them. They didn't believe her; they lashed her with their whips, smashed all the sky blue china, and searched the house, but it never occurred to them to lift the rug. They left at midnight, vowing to return."],[83,100,"At first, Eduardo lived with them. Then he went off to Arrecifes on some business, and on his return he brought a girl home with him, too; he had picked her up on the road. Within a few days he threw her out. He grew ever more sullen and bad-tempered; he would get drunk by himself in the corner general-store-and-bar and would not answer when someone spoke to him. He was in love with Cristian's woman. The neighborhood (which probably knew that before he himself did) sensed with secret and perfidious delight the latent rivalry that throbbed between the brothers."],[90,95,"Cardoso, less out of love than for something to do, took a fancy to a girl who lived nearby, a girl everyone called La Serviliana, and he began to court her; no sooner had Silveira discovered this than he began to court the girl in his own way, and carried her off to his ranch. After a few months he threw her out; she got on his nerves. Indignant, the woman sought refuge at Cardoso's place; Cardoso spent one night with her and sent her off at noon. He didn't want the other man's leftovers."]],[[32,102,"Crates of firearms begin to arrive; a silver washbowl and pitcher arrive for the woman's bedroom, then curtains of elaborately figured damask; one morning a somber-faced rider with a thick beard and a poncho rides down from up in the mountains. His name is Ulpiano Suarez, and he is Azevedo Bandeira's capanga, his foreman. He talks very little, and there is something Brazilian about his speech when he does. Ot\u00e1lora doesn't know whether to attribute the man's reserve to hostility, contempt, or mere savagery, but he does know that for the plan he has in mind he has to win his friendship."],[83,141,"One day, the brothers ordered Juliana to take two chairs out into the first patio and then make herself scarce; the two of them needed to talk. She was expecting a long talk, so she lay down for her siesta, but soon they called her back. They had her put everything she owned, even the rosary of glass beads and the little crucifix her mother had left her, in a sack. Without a word of explanation, they loaded her onto the oxcart and set off on a tedious and silent journey. It had rained; the roads were heavy, and it was sometime around five in the morning when they finally reached Mor\u00f3n. There, they woke up the madam of a whorehouse and offered to sell her Juliana. The deal was struck; Cristian took the money, and divided it later with Eduardo."],[92,106,"Within a few days, Daniel had to go to Buenos Aires to close a deal on some livestock. At the most, he said, the trip would take a week. Espinosa, who was already a little tired of his cousin's bonnes fortunes and his indefatigable interest in the vagaries of men's tailoring, stayed behind on the ranch with his textbooks. The heat was oppressive, and not even nightfall brought relief. Then one morning toward dawn, he was awakened by thunder. Wind lashed the casuarina trees. Espinosa heard the first drops of rain and gave thanks to God. Suddenly the wind blew cold. That afternoon, the Salado overflowed."]],[[32,150,"Through days of common danger he manages to win Su\u00e1rez 'friendship. He confides his plan to him, and Su\u00e1rez promises to help. Many things happen after this, some of which I know about: Ot\u00e1lora doesn't obey Bandeira; he keeps forgetting, improving his orders, even turning them upside down. The universe seems to conspire with him, and things move very fast. One noon, there is a shoot-out with men from Rio Grande do Sul on the prairies bordering the Tacuaremb\u00f3. Ot\u00e1lora usurps Bandeira's place and gives the Uruguayans orders. He is shot in the shoulder, but that afternoon Ot\u00e1lora goes back to El Suspiro on the boss's sorrel and that afternoon a few drops of his blood stain the jaguarskin and that night he sleeps with the woman with the shining hair. Other versions change the order of these events and even deny that they all occurred on a single day."],[35,144,"On February 6, 1829, the montoneros \u2014who by this time were being hounded by Lavalle \u2014 were marching northward to join L\u00f3pez' divisions; they halted at a ranch whose name they did not know, three or four leagues from the Pergamino. Toward dawn, one of the men had a haunting night-mare: in the gloom of the large bunkhouse, his confused cry woke the woman that was sleeping with him. No one knows what his dream was because the next day at four o'clock the montoneros were put to rout by Su\u00e1rez' cavalry and the pursuit went on for nine leagues, all the way to the now-dusky stubble fields, and the man perished in a ditch, his skull split by a saber from the wars in Peru and Brazil. The woman was named Isidora Cruz; the son she bore was given the name Tadeo Isidoro."],[38,204,"The second episode took place in Montevideo, months later. The fever and agonizing death of the man from Entre R\u00edos suggested to me a tale of fantasy based on the defeat at Masoller; when I told the plot of the story to Emir Rodriguez Monegal, he gave me a letter of introduction to Col. Dionisio Tabares, who had led the campaign. The colonel received me after dinner. From his comfortable rocking chair out in the courtyard, he lovingly and confusedly recalled the old days. He spoke of munitions that never arrived and of exhausted horses, of grimy, sleepy men weaving labyrinths of marches, and of Saravia, who could have entered Montevideo but turned aside \"because gauchos have an aversion to the city,\" of men whose throats were slashed through to the spine, of a civil war that struck me as more some outlaw's dream than the collision of two armies. He talked about Illescas, Tupambae, Masoller, and did so with such perfectly formed periods, and so vividly, that I realized that he'd told these same stories many times before\u2014indeed, it all made me fear that behind his words hardly any memories remained. As he took a breath, I managed to mention the name Dami\u00e1n."]],[[32,93,"He adds a vulgar detail. The woman tries to resist, but two men have taken her by the arms, and they throw her on top of Ot\u00e1lora. In tears, she kisses his face and his chest. Ulpiano Su\u00e1rez has pulled his gun.Ot\u00e1lora realizes, before he dies, that he has been betrayed from the beginning, that he has been sentenced to death, that he has been allowed to love, to command, and win because he was already as good as dead, because so far as Bandeira was concerned, he was already a dead man."],[85,39,"But Luis Irala wasn't interested in hearing what I had to say, so he left. The next day we heard that he'd picked a fight with Rufino in some bar over in Mor\u00f3n and that Rufino had killed him."],[90,67,"The part Nigger Nolan had been given to play went to his head, and he overacted\u2014he slashed Silveira's throat from ear to ear. The man from Corrientes made do with a neat slice. The blood gushed, though, from both men's throats; they stumbled a few steps and then fell headlong. As he fell, Cardoso stretched out his arms. He had won, but he likely never knew that."]],[[33,92,"He could not find the necessary words; the admonitions of the new doctrine were too affected and metaphorical to be transcribed. (\"Wouldst thou see what no human eyes have seen? Look upon the moon. Wouldst thou hear what no ears have heard? Hearken to the cry of the bird. Wouldst thou touch what no hands have touched? Put thy hand to the earth. Truly I say unto thee, that the moment of God's creation of the world is yet to come.\") Then suddenly a sentence of twenty words came to his spirit."],[42,214,"I will not tell of the difficulties of my labor. More than once I cried out to the vault above that it was impossible to decipher that text. Gradually, I came to be tormented less by the concrete enigma which occupied my mind than by the generic enigma of a message written by a god. What sort of sentence, I asked myself, would be constructed by an absolute mind? I reflected that even in the languages of humans there is no proposition that does not imply the entire universe; to say \"the jaguar\" is to say all the jaguars that engendered it, the deer and turtles it has devoured, the grass that fed the deer, the earth that was mother to the grass, the sky that gave light to the earth. I reflected that in the language of a god every word would speak that infinite concatenation of events, and not implicitly but explicitly, and not linearly but instantaneously. In time, the idea of a divine utterance came to strike me as puerile, or as blasphemous. A god, I reflected, must speak but a single word, and in that word there must be absolute plenitude. No word uttered by a god could be less than the universe, or briefer than the sum of time."],[96,107,"I believe I mentioned that Wren, in exchange for a few lessons in Italian, had initiated me into the study of that infinite language English. He passed over grammar and those manufactured \"classroom\" sentences (insofar as possible) and we plunged straight into poetry, whose forms demand brevity. My first contact with the language that would fill my life was Stevenson's courageous \"Requiem\"; after that came the ballads that Percy unveiled to the decorous eighteenth century. A short while before my departure for London, I was introduced to the dazzling verse of Swinburne, which led me (though it felt like sin) to doubt the pre-eminence of Irala's alexandrines."],[101,61,"I would tell myself that renouncing the lovely game of combining lovely words was foolish, that there was no reason to seek the single, perhaps illusory, One. That argument failed. A missionary suggested the word God, which I rejected. One sunrise, on the banks of a river that widened into the sea, I believed that the revelation had been vouchsafed me."],[111,71,"I had hypothesized that the images of that wondrous memory would be primarily visual. Such was not the case. Days later, as I was shaving, I spoke into the mirror a string of words that puzzled me; a colleague informed me that they were from Chaucer's \"A. B. C.\" One afternoon, as I was leaving the British Museum, I began whistling a very simple melody that I had never heard before."]],[[35,473,"It is not my purpose to repeat the story of his life. Of the days and nights that composed it, I am interested in only one; about the rest, I will recount nothing but that which is essential to an understanding of that single night. The adventure is recorded in a very famous book\u2014 that is, in a book whose subject can be all things to all men (I Corinthians 9:22), for it is capable of virtually inexhaustible repetitions, versions, perversions. Those who have commented upon the story of Tadeo Isidoro Cruz, and there are many, stress the influence of the wide plains on his formation, but gauchos just like to him were born and died along the forested banks of the Piranha and in the eastern mountain ranges. He did live in a world of monotonous barbarity\u2014 when he died in 1874 of the black pox, he had never seen a mountain or a gas jet or a windmill. Or a city: In 1849, he helped drive a herd of stock from Francisco Xavier Acevedo's ranch to Buenos Aires; the drovers went into the city to empty their purses; Cruz, a distrustful sort, never left the inn in the neighborhood of the stockyards. He spent many days there, taciturn, sleeping on the ground, sipping his mate, getting up at dawn and lying down again at orisons. He realized (beyond words and even beyond understanding) that the city had nothing to do with him. One of the peons, drunk, made fun of him. Cruz said nothing in reply, but during the nights on the return trip, sitting beside the fire, the other man's mockery continued, so Cruz (who had never shown any anger, or even the slightest resentment) killed him with a single thrust of his knife. Fleeing, he took refuge in a swamp; a few nights later, the cry of a crested screamer warned him that the police had surrounded him. He tested his knife on a leaf. He took off his spurs, so they wouldn't get in his way when the time came\u2014he would fight before he gave himself up. He was wounded in the forearm, the shoulder, and the left hand; he gravely wounded the bravest of the men who'd come to arrest him. When the blood ran down between his fingers, he fought more courageously than ever; toward dawn, made faint by the loss of blood, he was disarmed. Back then, the army served as the country's prison: Cruz was sent to a small fort on the northern frontier. As a low private, he took part in the civil wars; sometimes he fought for his native province, sometimes against it. On January 23, 1856, at the Cardoso Marshes, he was one of the thirty Christian men who, under the command of Sgt. Maj. Eugenie Laprida, battled two hundred Indians."],[90,179,"In the winter of '70, Aparicio's revolution caught Cardoso and Silveira drinking in that same general-store-and-bar where they'd played their game of truco. A Brazilian soldier with mulatto features, heading up a small band of montoneros came through the door. He gave the men gathered there a rousing speech; their country needed them, he said \u2014 the government's oppression was intolerable. He passed out white badges to pin on, and at the end of that exordium which they had not understood, he and his platoon impressed them into service \u2014 they were not even allowed to say good-bye to their families. Manuel Cardoso and Carmen Silveira accepted their fate; a soldier's life was no harder than a gaucho's. They were used to sleeping in the open with a horse blanket as a mattress and a saddle as a pillow, and for the hand accustomed to killing animals, killing a man was not a great deal different. Their lack of imagination freed them from fear and pity alike, though fear did touch them sometimes, just as the cavalry charged them."],[104,170,"Every Saturday the friends took the same table, off to one side, in the Caf\u00e9 del Globo, like the poor honest men they were, knowing they cannot invite their friends home, or perhaps escaping it. They were all from Montevideo; at first it had been hard to make friends with Arredondo, a man from the interior who didn't allow confidences or ask questions. He was hardly more than twenty, a lean, dark-skinned young man, a bit on the short side, and perhaps a little clumsy. His face would have been anonymous had it not been rescued by his eyes, which were both sleepy and full of energy. He was a clerk in a dry goods store on Calle Buenos Aires, and he studied law in his spare time. When the others condemned the war that was ravaging the country and that the president (so general opinion believed) was waging for reprehensible reasons, Arredondo remained silent. He also remained silent when the others laughed at him and called him a tightwad."]],[[36,141,"Sadness and revulsion lay upon Emma like chains, but slowly she got up and began to dress. The room had no bright colors; the last light of evening made it all the drearier. She managed to slip out without being seen. On the corner she mounted a westbound Lacroze and following her plan, she sat in the car's frontmost seat, so that no one would see her face. Perhaps she was comforted to see, in the banal bustle of the streets, that what had happened had not polluted everything. She rode through gloomy, shrinking neighborhoods, seeing them and forgetting them instantly, and got off at one of the stops on Warnes. Paradoxically, her weariness turned into a strength, for it forced her to concentrate on the details of her mission and masked from her its true nature and its final purpose."],[77,169,"Murdock leaped at the suggestion. One of his ancestors had died in the frontier wars; that bygone conflict of his race was now a link. He must have foreseen the difficulties that lay ahead for him; he would have to convince the red men to accept him as one of their own. He set out upon the long adventure. He lived for more than two years on the prairie, sometimes sheltered by adobe walls and sometimes in the open. He rose before dawn, went to bed at sundown, and came to dream in a language that was not that of his fathers. He conditioned his palate to harsh flavors, he covered himself with strange clothing, he forgot his friends and the city, he came to think in a fashion that the logic of his mind rejected. During the first few months of his new education he secretly took notes; later, he tore the notes up\u2014 perhaps to avoid drawing suspicion upon himself, perhaps because he no longer needed them."],[104,80,"At first he tried to construct a routine. Drink some mate, smoke the black cigarettes he rolled, read and review a certain number of pages, try to chat a bit with Clementina when she brought his dinner on a tray, repeat and embellish a certain speech before he blew out the lamp. Talking with Clementina, a woman along in years, was not easy, because her memory had halted far from the city, back in the mundane life of the country."]],[[36,50,"Things didn't happen the way Emma Zunz had foreseen. Since early the previous morning, many times she had dreamed that she would point the firm revolver, force the miserable wretch to confess his miserable guilt, explain to him the daring stratagem that would allow God's justice to triumph over man's."],[92,182,"One afternoon, he surprised them as they were discussing him in brief, respectful words. When he came to the end of the Gospel According to St. Mark, he started to read another of the three remaining gospels, but the father asked him to reread the one he'd just finished, so they could understand it better. Espinosa felt they were like children, who prefer repetition to variety or novelty. One night he dreamed of the Flood (which is not surprising) and was awakened by the hammering of the building of the Ark, but he told himself it was thunder. And in fact the rain, which had let up for a while, had begun again; it was very cold. The Gutres told him the rain had broken through the roof of the toolshed; when they got the beams repaired, they said, they'd show him where. He was no longer a stranger, a foreigner, and they all treated him with respect; he was almost spoiled. None of them liked coffee, but there was always a little cup for him, with spoonfuls of sugar stirred in."],[104,76,"He went through it page by page, sometimes with interest and some-times with boredom, and he set himself the task of memorizing an occasional chapter of Exodus and the last of Ecclesiastes. He did not try to understand what he was reading. He was a freethinker, but he let not a night go by without repeating the Lord's Prayer, as he'd promised his mother when he came to Montevideo\u2014breaking that filial promise might bring bad luck."]],[[37,208,"Of course I do not lack for distractions. Sometimes I run like a charging ram through the halls of stone until I tumble dizzily to the ground; sometimes I crouch in the shadow of a wellhead or at a corner in one of the corridors and pretend I am being hunted. There are rooftops from which I can hurl myself until I am bloody. I can pretend anytime I like that I am asleep, and lie with my eyes closed and my breathing heavy. (Sometimes I actually fall asleep; sometimes by the time I open my eyes, the color of the day has changed.) But of all the games, the one I like best is pretending that there is another Assertion\u2019s pretend that he has come to visit me, and I show him around the house. Bowing majestically, I say to him: Now let us return to our previous intersection or Let us go this way, now, out into another courtyard or I knew that you would like this rain gutter or Now you will see a cistern that has filled with sand or Now you will see how the cellar forks. Sometimes I make a mistake and the two of us have a good laugh over it."],[40,95,"\"Let us imagine that someone shows a story instead of telling it\u2014the story of the seven sleepers of Ephesus, say. We see them retire into the cavern, we see them pray and sleep, we see them sleep with their eyes open, we see them grow while they are asleep, we see them awaken after three hundred nine years, we see them hand the merchant an ancient coin, we see them awaken in paradise, we see them awaken with the dog. It was something like that that the persons on the terrace showed us that evening.\""],[88,97,"Sleeping, as we all know, is the most secret thing we do. We devote one third of our lives to sleep, yet we do not understand it. Some believe it is only an eclipse of wakefulness; others, a more complex state which embraces at once yesterday, the present, and tomorrow; still others see it as an uninterrupted series of dreams. To say that the elderly lady of my story spent ten years in a state of serene chaos is perhaps an error; every moment of those ten years may have been pure present, without past or future."]],[[37,101,"Every nine years, nine men come into the house so that I can free them from all evil. I hear their footsteps or their voices far away in the galleries of stone, and I run joyously to find them. The ceremony lasts but a few minutes. One after another, they fall, without my ever having to bloody my hands. Where they fall, they remain, and their bodies help distinguish one gallery from the others. I do not know how many there have been, but I do know that one of them predicted as he died that someday my redeemer would come."],[104,92,"He knew that his goal was the morning of August 25. He knew exactly how many days he had to get through. Once he'd reached his goal, time would cease, or rather nothing that happened afterward would matter. He awaited the day like a man waiting for his joy and his liberation. He had stopped his watch so he wouldn't always be looking at it, but every night, when he heard the dark, far-off sound of the twelve chimes, he would pull a page off the calendar and think One day less."],[111,52,"I have forgotten the date on which I decided to free myself. I hit upon the easiest way: I dialed telephone numbers at random. The voice of a child or a woman would answer; I believed it was my duty to respect their vulnerable estates. At last a man's refined voice answered."]],[[38,184,"Absurdly, Col. Tabares' version of the events embarrassed me. I'd have preferred that they not have taken place quite that way. Out of the aged Dami\u00e1n, a man I'd had a glimpse of on a single afternoon, and that, many years ago, I had unwittingly constructed a sort of idol; Tabares' version shattered it. Suddenly I understood Dami\u00e1n's reserve and stubborn solitude; they had been dictated not by modesty, but by shame. Futilely I told myself, over and over, that a man pursued by an act of cowardice is more complex and more interesting than a man who is merely brave. The gaucho Mart\u00edn Fierro, I thought, is less memorable than Lord Jim or Razumov. Yes, but Dami\u00e1n, as a gaucho, had an obligation to be Mart\u00edn Fierro\u2014especially so in the company of Uruguayan gauchos. With respect to what Tabares said and failed to say, I caught the gamy taste of what was called Artiguismo \u2014 the (perhaps unarguable) awareness that Uruguay is more elemental than our own country, and therefore wilder... I recall that that night we said our goodbyes with exaggerated effusiveness."],[47,102,"I hung up before he could tell me not to come. Sometimes learning a fact is enough to make an entire series of corroborating details, previously unrecognized, fall into place; I was amazed that I hadn't realized until that moment that Carlos Argentino was a madman. All the Viterbos, in fact\u2014Beatriz (I myself have said this many times) was a woman, a girl of implacable clear-sightedness, but there were things about her\u2014oversights, distractions, moments of contempt, downright cruelty\u2014that perhaps could have done with a pathological explanation. Carlos Argentine's madness filled me with malign happiness; deep down, we had always detested one another."],[91,48,"The man's grandiloquent generalities irritated me, so I curtly observed that within the Great Enigma that surrounds us, the meeting in Guayaquil, in which Gen. San Martin renounced mere ambition and left the fate of the continent in the hands of Bolivar, is also an enigma worth studying."]],[[38,163,"In Buenos Aires, another incident was to make me feel yet again that shiver that the colonel's forgetfulness had produced in me. Down in the basement of Mitchell's English bookshop, I came upon Patricio Gannon one afternoon, standing before the eleven delectable volumes of the works of Emerson. I asked him how his translation of \"The Past\" was going. He said he had no plans to translate it; Spanish literature was tedious enough already without Emerson. I reminded him that he had promised me the translation in the same letter in which he'd written me the news of Dami\u00e1n's death. He asked who this \"Dami\u00e1n\" was. I told him, but drew no response. With the beginnings of a sense of terror I saw that he was looking at me strangely, so I bluffed my way into a literary argument about the sort of person who'd criticize Emerson\u2014a poet more complex, more accomplished, and unquestionably more remarkable, I contended, than poor Edgar Allan Poe."],[47,117,"Carlos Argentino read me many another stanza, all of which earned the same profuse praise and comment from him. There was nothing memorable about them; I could not even judge them to be much worse than the first one. Application, resignation, and chance had conspired in their composition; the virtues that Daneri attributed to them were afterthoughts. I realized that the poet's work had lain not in the poetry but in the invention of reasons for accounting the poetry admirable; naturally, that later work modified the poem for Daneri, but not for anyone else. His oral expression was extravagant; his metrical clumsiness prevented him, except on a very few occasions, from transmitting that extravagance to the poem.1"],[87,36,"
