Hamlet on La Cannabi\u00e8re, or don Quixote on Wall Street. Like every man of taste, Menard abominated those pointless travesties, which, Menard would say, were good for nothing but occasioning a plebeian delight in anachronism or (worse yet) captivating us with the elementary notion that all times and places are the same, or are different. It might be more interesting, he thought, though of contradictory and superficial execution, to attempt what Daudet had so famously suggested: conjoin in a single figure (Tartarin, say) both the Ingenious Gentleman don Quixote and his squire-----Those who have insinuated that Menard devoted his life to writing a contemporary Quixote besmirch his illustrious memory. Pierre Menard did not want to compose another Quixote, which surely is easy enough\u2014he wanted to compose the Quixote. Nor, surely, need one have to say that his goal was never a mechanical transcription of the original; he had no intention of copying it. His admirable ambition was to produce a number of pages which coincided\u2014word for word and line for line\u2014with those of Miguel de Cervantes."],[40,267,"In the preceding tale, I have tried to narrate the process of failure, the process of defeat. I thought first of that archbishop of Canterbury who set himself the task of proving that God exists; then I thought of the alchemists who sought the philosopher's stone; then, of the vain trisectors of the angle and squarers of the circle. Then I reflected that a more poetic case than these would be a man who sets himself a goal that is not forbidden to other men, but is forbidden to him. I recalled Averro\u00ebs, who, bounded within the circle of Islam, could never know the meaning of the words tragedy and comedy. I told his story; as I went on, I felt what that god mentioned by Bur-ton must have felt\u2014the god who set himself the task of creating a bull but turned out a buffalo. I felt that the work mocked me, foiled me, thwarted me. I felt that Averro\u00ebs, trying to imagine what a play is without ever having suspected what a theater is, was no more absurd than I, trying to imagine Averro\u00ebs yet with no more material than a few snatches from Renan, Lane, and As\u00edn Palacios.I felt, on the last page, that my story was a symbol of the man I had been as I was writing it, and that in order to write that story I had had to be that man, and that in order to be that man I had had to write that story, and so on, ad infinitum. (And just when I stop believing in him, \"Averro\u00ebs\" disappears.)"],[57,93,"What kind of man, I ask myself, thought up and then acted out that funereal farce\u2014a fanatic? a grief-stricken mourner? a madman? a cynical impostor? Did he, in acting out his mournful role as the macabre widower, believe himself to be Per\u00f3n? It is an incredible story, but it actually happened\u2014and perhaps not once but many times, with different actors and local variants. In it, one can see the perfect symbol of an unreal time, and it is like the reflection of a dream or like that play within a play in Hamlet."],[69,150,"Haunted, hounded, he began imagining other heroes, other tragic fables. Thus while his body, in whorehouses and taverns around London, lived its life as body, the soul that lived inside it would be Cassar, who ignores the admonition of the sibyl, and Juliet, who hates the lark, and Macbeth, who speaks on the moor with the witches who are also the Fates, the Three Weird Sisters. No one was as many men as that man\u2014that man whose repertoire, like that of the Egyptian Proteus, was all the appearances of being. From time to time he would leave a confession in one corner or another of the work, certain that it would not be deciphered; Richard says that inside himself, he plays the part of many, and Iago says, with curious words, I am not what I am. The fundamental identity of living, dreaming, and performing inspired him to famous passages."]],[[15,85,"\"My purpose is merely astonishing,\" he wrote me on September 30, 1934, from Bayonne. \"The final term of a theological or metaphysical proof\u2014the world around us, or God, or chance, or universal Forms\u2014is no more final, no more uncommon, than my revealed novel. The sole difference is that philosophers publish pleasant volumes containing the intermediate stages of their work, while I am resolved to suppress those stages of my own.\" And indeed there is not a single draft to bear witness to that yearslong labor."],[20,79,"The testimony of his contemporaries proclaims his metaphysical, mystical leanings\u2014 and his life is their fullest confirmation. Philosophical debate consumes a good part of his novel. I know that of all problems, none disturbed him, none gnawed at him like the unfathomable problem of time. How strange, then, that that problem should be the only one that does not figure in the pages of his Garden. He never even uses the word. How do you explain that willful omission?\""],[37,87,"The fact is, I am unique. I am not interested in what a man can publish abroad to other men; like the philosopher, I think that nothing can be communicated by the art of writing. Vexatious and trivial minutiae find no refuge in my spirit, which has been formed for greatness; I have never grasped for long the difference between one letter and another. A certain generous impatience has prevented me from learning to read. Sometimes I regret that, because the nights and the days are long."],[75,115,"God grant that the essential monotony of this miscellany (which time has compiled, not I, and into which have been bundled long-ago pieces that I've not had the courage to revise, for I wrote them out of a different concept of literature) be less obvious than the geographical and historical diversity of its subjects. Of all the books I have sent to press, none, I think, is as personal as this motley, disorganized anthology, precisely because it abounds in reflections and interpolations. Few things have happened to me, though many things I have read. Or rather, few things have happened to me more worthy of remembering than the philosophy of Schopenhauer or England's verbal music."],[76,110,"Without realizing at first that I was doing so, I have devoted my long life to literature, teaching, idleness, the quiet adventures of conversation, philology (which I know very little about), the mysterious habit of Buenos Aires, and the perplexities which not without some arrogance are called metaphysics. Nor has my life been without its friendships, which are what really matter. I don't believe I have a single enemy\u2014if I do, nobody ever told me. The truth is that no one can hurt us except the people we love. Now, at my seventy years of age (the phrase is Whitman's), I send to the press this fifth book of verse."]],[[15,215,"Initially, Menard's method was to be relatively simple: Learn Spanish, return to Catholicism, fight against the Moor or Turk, forget the history of Europe from 1602 to 1918\u2014 be Miguel de Cervantes. Pierre Menard weighed that course (I know he pretty thoroughly mastered seventeenth-century Castilian) but he discarded it as too easy. Too impossible, rather!, the reader will say. Quite so, but the undertaking was impossible from the outset, and of all the impossible ways of bringing it about, this was the least interesting. To be a popular novelist of the seventeenth century in the twentieth seemed to Menard to be a diminution. Being, somehow, Cervantes, and arriving thereby at the Quixote\u2014that looked to Menard less challenging (and therefore less interesting) than continuing to be Pierre Menard and coming to the Quixote through the experiences of Pierre Menard. (It was that conviction, by the way, that obliged him to leave out the autobiographical foreword to Part II of the novel. Including the prologue would have meant creating another character\u2014 \"Cervantes\"\u2014and also presenting Quixote through that character's eyes, not Pierre Menard's. Menard, of course, spurned that easy solution.) \"The task I have undertaken is not in essence difficult,\" I read at another place in that letter. \"If I could just be immortal, I could do it.\""],[38,184,"As for myself, I don't think I run a similar risk. I have guessed at and recorded a process inaccessible to humankind, a sort of outrage to rationality; but there are circumstances that mitigate that awesome privilege. For the moment, I am not certain that I have always written the truth. I suspect that within my tale there are false recollections. I suspect that Pedro Dami\u00e1n (if he ever existed) was not called Pedro Dami\u00e1n, and that I remember him under that name in order to be able to believe, someday in the future, that his story was suggested to me by the arguments of Pier Damiani. Much the same thing occurs with that poem that I mentioned in the first paragraph, the poem whose subject is the irrevocability of the past. In 1951 or thereabouts I will recall having concocted a tale of fantasy, but I will have told the story of a true event in much the way that naive Virgil, two thousand years ago, thought he was heralding the birth of a man though he had foretold the birth of God."],[96,94,"At any rate, the task I have set myself is not an easy one. I have never attempted to produce narrative prose, even in its epistolary form; to make matters worse, no doubt, the story I am about to tell is not believable. It was the pen of Jos\u00e9 Fern\u00e1ndez Kraal, the undeservedly forgotten poet of Los m\u00e1rmoles, that fate had destined for this enterprise, but now it is too late. I will not deliberately misrepresent the facts, but I can foresee that sloth and clumsiness will more than once lead me into error."]],[[15,46,"The contrast in styles is equally striking. The archaic style of Menard\u2014 who is, in addition, not a native speaker of the language in which he writes\u2014is somewhat affected. Not so the style of his precursor, who employs the Spanish of his time with complete naturalness."],[72,162,"to. I walk through Buenos Aires and I pause\u2014 mechanically now, perhaps\u2014to gaze at the arch of an entryway and its inner door; news of Borges reaches me by mail, or I see his name on a list of academics or in some biographical dictionary. My taste runs to hourglasses, maps, seventeenth-century typefaces, etymologies, the taste of coffee, and the prose of Robert Louis Stevenson; Borges shares those preferences, but in a vain sort of way that turns them into the accoutrements of an actor. It would be an exaggeration to say that our relationship is hostile\u2014I live, I allow myself to live, so that Borges can spin out his literature, and that literature is my justification. I willingly admit that he has written a number of sound pages, but those pages will not save me, perhaps because the good in them no longer belongs to any individual, not even to that other man, but rather to language itself, or to tradition."],[76,158,"My poverty, my will, resist that suggestion. I do not have an aesthetics. Time has taught me a few tricks\u2014avoiding synonyms, the drawback to which is that they suggest imaginary differences; avoiding Hispanicisms, Argentinisms, archaisms, and neologisms; using everyday words rather than shocking ones; inserting circumstantial details, which are now demanded by readers, into my stories; feigning a slight uncertainty, since even though reality is precise, memory isn't; narrating events (this I learned from Kipling and the Icelandic sagas) as though I didn't fully understand them; remembering that tradition, conventions, \"the rules,\" are not an obligation, and that time will surely repeal them\u2014but such tricks (or habits) are most certainly not an aesthetics. Anyway, I don't believe in those formulations that people call \"an aesthetics.\" As a general rule, they are no more than useless abstractions; they vary from author to author and even from text to text, and can never be more than occasional stimuli or tools."],[82,152,"I have renounced the shocks of a baroque style as well as those afforded by unforeseen or unexpected endings. I have, in short, preferred to prepare my readers for my endings, rather than to astound them. For many years I believed that it would be my fortune to achieve literature through variations and novelties; now that I am seventy years old I think I have found my own voice. A word changed here or there will neither spoil nor improve what I dictate, except when those alterations succeed in leavening a heavy sentence or softening an emphasis. Each language is a tradition, each word a shared symbol; the changes that an innovator may make are trifling\u2014we should remember the dazzling but often unreadable work of a Mallarm\u00e9 or a Joyce. These reasonable, rational arguments are quite likely the result of weariness; advanced age has taught me to resign myself to being Borges."]],[[15,97,"Those nihilistic observations were not new; what was remarkable was the decision that Pierre Menard derived from them. He resolved to anticipate the vanity that awaits all the labors of mankind; he undertook a task of infinite complexity, a task futile from the outset. He dedicated his scruples and his nights \"lit by midnight oil\" to repeating in a foreign tongue a book that already existed. His drafts were endless; he stubbornly corrected, and he ripped up thousands of handwritten pages. He would allow no one to see them, and took care that they not survive him.3"],[23,118,"He couldn't have been more than twenty. He was thin yet slack-muscled, all at once\u2014he gave the uncomfortable impression of being an invertebrate. He had studied, ardently and with some vanity, virtually every page of one of those Communist manuals; he would haul out his dialectical materialism to cut off any argument. There are infinite reasons a man may have for hating or loving another man; Moon reduced the history of the world to one sordid economic conflict. He declared that the Revolution was foreordained to triumph. I replied that only lost causes were of any interest to a gentleman.... Night had fallen; we pursued our crosspurposes in the hallway, down the stairs, then through the vague streets."],[91,51,"I could sense no trace of mockery in those words; they were simply the expression of a will that made the future as irrevocable as the past. Zimmermann's arguments were the least of it, however; the power lay in the man, not in the dialectic. He continued with a pedagogue's deliberateness:"]],[[15,72,"\"Thinking, meditating, imagining,\" he also wrote me, \"are not anomalous acts\u2014they are the normal respiration of the intelligence. To glorify the occasional exercise of that function, to treasure beyond price ancient and foreign thoughts, to recall with incredulous awe what some doctor universalis thought, is to confess our own languor, or our own barbarie. Every man should be capable of all ideas, and I believe that in the future he shall be.\""],[91,37,"\"Our teacher, our master\u2014our common master\u2014surmised that no act is unintentional. If you remain in this house, in this elegant patrician house, it is because deep inside, you wish to. I respect your wish, and am grateful.\""],[102,50,"Illness and inadvertent death are not things to be feared. He practices one of the arts, or philosophy or mathematics, or plays a game of one-handed chess. When he wishes, he kills himself. When a man is the master of own life, he is also the master of his death.\""],[108,38,"\"The Stoics teach,\" he said to me, \"that we should not complain of life\u2014the door of the prison is open. I have always understood that; I myself saw life that way, but laziness and cowardice held me back."]],[[16,180,"No one saw him slip from the boat in the unanimous night, no one saw the bamboo canoe as it sank into the sacred mud, and yet within days there was no one who did not know that the taciturn man had come there from the South, and that his homeland was one of those infinite villages that lie up-river, on the violent flank of the mountain, where the language of the Zend is uncontaminated by Greek and where leprosy is uncommon. But in fact the gray man had kissed the mud, scrambled up the steep bank (without pushing back, probably without even feeling, the sharp-leaved bulrushes that slashed his flesh), and dragged himself, faint and bloody, to the circular enclosure, crowned by the stone figure of a horse or tiger, which had once been the color of fire but was now the color of ashes. That ring was a temple devoured by an ancient holocaust; now, the malarial jungle had profaned it and its god went unhonored by mankind. The foreigner lay down at the foot of the pedestal."],[31,78,"Urgent thirst lent me temerity. I estimated that I was some thirty paces from the sand; I closed my eyes and threw myself down the mountain, my hands bound behind my back. I plunged my bloodied face into the dark water and lapped at it like an animal. Before I lost myself in sleep and delirium once more, I inexplicably repeated a few words of Greek: Those from Zeleia, wealthy Trojans, who drink the water of dark Aisepos..."],[33,145,"Under the midday sun, John of Pannonia lay with his face in the dust, howling like a beast. He clawed at the ground, but the executioners seized him, stripped him, and tied him to the stake. On his head they put a crown of straw sprinkled with sulfur; beside him, a copy of the pestilential Adversus Annul\u00e2tes. It had rained the night before, and the wood burned smokily. John of Pannonia prayed in Greek, and then in an unknown language. The pyre was about to consume him, when Aurelian screwed up his courage to raise his eyes. The fiery gusts fell still; Aurelian saw for the first and last time the face of the man he hated. It reminded him of someone, but he couldn't quite remember whom. Then, the flames swallowed him; he screamed and it was as though the fire itself were screaming."]],[[16,163,"He was awakened by the sun high in the sky. He examined his wounds and saw, without astonishment, that they had healed; he closed his pale eyes and slept, not out of any weakness of the flesh but out of willed determination. He knew that this temple was the place that his unconquerable plan called for; he knew that the unrelenting trees had not succeeded in strangling the ruins of another promising temple downriver\u2014like this one, a temple to dead, incinerated gods; he knew that his immediate obligation was to sleep. About midnight he was awakened by the inconsolable cry of a bird. Prints of unshod feet, a few figs, and a jug of water told him that the men of the region had respectfully spied upon his sleep and that they sought his favor, or feared his magic. He felt the coldness of fear, and he sought out a tomblike niche in the crumbling wall, where he covered himself with unknown leaves."],[30,86,"They went outside, and while there was no hope in Dahlmann, there was no fear, either. As he crossed the threshold, he felt that on that first night in the sanatorium, when they'd stuck that needle in him, dying in a knife fight under the open sky, grappling with his adversary, would have been a liberation, a joy, and a fiesta. He sensed that had he been able to choose or dream his death that night, this is the death he would have dreamed or chosen."],[31,115,"I disembarked; there came to my mind other mornings, long in the past, when I had also looked out over the Red Sea\u2014when I was a Roman tribune, and fever and magic and inactivity consumed the soldiers. Outside the city I saw a spring; impelled by habit, I tasted its clear water. As I scaled the steep bank beside it, a thorny tree scratched the back of my hand. The unaccustomed pain seemed exceedingly sharp. Incredulous, speechless, and in joy, I contemplated the precious formation of a slow drop of blood. I am once more mortal, I told myself over and over, again I am like all other men. That night, I slept until daybreak."],[50,201,"He had never lingered among the pleasures of memory. Impressions, momentary and vivid, would wash over him: a potter's vermilion glaze; the sky-vault filled with stars that were also gods; the moon, from which a lion had fallen; the smoothness of marble under his sensitive, slow fingertips; the taste of wild boar meat, which he liked to tear at with brusque, white bites; a Phoenician word; the black shadow cast by a spear on the yellow sand; the nearness of the sea or women; heavy wine, its harsh edge tempered by honey\u2014these things could flood the entire circuit of his soul. He had known terror, but he had known wrath and courage as well, and once he had been the first to scale an enemy wall. Keen, curious, inadvertent, with no law but satisfaction and immediate indifference, he had wandered the various world and on now this, now that seashore, he had gazed upon the cities of men and their palaces. In teeming marketplaces or at the foot of a mountain upon whose uncertain peak there might be satyrs, he had listened to complex stories, which he took in as he took in reality\u2014without asking whether they were true or false."]],[[16,123,"The goal that led him on was not impossible, though it was clearly supernatural: He wanted to dream a man. He wanted to dream him completely, in painstaking detail, and impose him upon reality. This magical objective had come to fill his entire soul; if someone had asked him his own name, or inquired into any feature of his life till then, he would not have been able to answer. The uninhabited and crumbling temple suited him, for it was a minimum of visible world; so did the proximity of the woodcutters, for they saw to his frugal needs. The rice and fruit of their tribute were nourishment enough for his body, which was consecrated to the sole task of sleeping and dreaming."],[50,116,"With grave wonder, he understood. In this night of his mortal eyes into which he was descending, love and adventure were also awaiting him. Ares and Aphrodite\u2014because now he began to sense (because now he began to be surrounded by) a rumor of glory and hexameters, a rumor of men who defend a temple that the gods will not save, a rumor of black ships that set sail in search of a beloved isle, the rumor of the Odysseys and Iliads that it was his fate to sing and to leave echoing in the cupped hands of human memory. These things we know, but not those that he felt as he descended into his last darkness."],[71,99,"Years later, Dante was to die in Ravenna, as unjustified and alone as any other man. In a dream, God told him the secret purpose of his life and work; Dante, astonished, learned at last who he was and what he was, and he blessed the bitternesses of his life. Legend has it that when he awoke, he sensed that he had received and lost an infinite thing, something he would never be able to recover, or even to descry from afar, because the machine of the world is exceedingly complex for the simplicity of men. Borges And I"],[81,86,"Somehow he sensed that it was his duty to leave all these things be-hind; now he belonged to this new world, removed from past, present, and future. Little by little this new world surrounded him. He suffered many agonies, journeyed through realms of desperation and loneliness\u2014appalling peregrinations, for they transcended all his previous perceptions, memories, and hopes. All horror lay in their newness and their splendor. He had deserved grace\u2014he had earned it; every second since the moment of his death, he had been in heaven."]],[[16,272,"On the ninth or tenth night, he realized (with some bitterness) that nothing could be expected from those students who passively accepted his teachings, but only from those who might occasionally, in a reasonable way, venture an objection. The first\u2014the accepting\u2014though worthy of affection and a degree of sympathy, would never emerge as individuals; the latter\u2014 those who sometimes questioned\u2014had a bit more pr\u00e9existence. One afternoon (afternoons now paid their tribute to sleep as well; now the man was awake no more than two or three hours around daybreak) he dismissed the vast illusory classroom once and for all and retained but a single pupil\u2014a taciturn, sallow-skinned young man, at times intractable, with sharp features that echoed those of the man that dreamed him. The pupil was not disconcerted for long by the elimination of his classmates; after only a few of the private classes, his progress amazed his teacher. Yet disaster would not be forestalled. One day the man emerged from sleep as though from a viscous desert, looked up at the hollow light of the evening (which for a moment he confused with the light of dawn), and realized that he had not dreamed. All that night and the next day, the unbearable lucidity of insomnia harried him, like a hawk. He went off to explore the jungle, hoping to tire himself; among the hemlocks he managed no more than a few intervals of feeble sleep, fleetingly veined with the most rudimentary of visions\u2014useless to him. He reconvened his class, but no sooner had he spoken a few brief words of exhortation than the faces blurred, twisted, and faded away."],[77,79,"After a period of time (determined upon in advance by certain practices, both spiritual and physical), the priest instructed Murdock to start remembering his dreams, and to recount them to him at daybreak each morning. The young man found that on nights of the full moon he dreamed of buffalo. He reported these recurrent dreams to his teacher; the teacher at last revealed to him the tribe's secret doctrine. One morning, without saying a word to anyone, Murdock left."],[109,107,"In the middle of the night, they woke me. A boy told me that a goat had escaped from the corral and that as he'd gone to look for it, he'd seen the blue tiger on the far bank of the river. I reflected that the scant light of the new moon would hardly have allowed him to make out the color, but every-one confirmed the tale; one of them, who had been silent up until that moment, said he had seen it, too. We went out with the rifles and I saw, or thought I saw, a feline shadow slink into the shadows of the jungle."]],[[16,146,"He dreamed the heart warm, active, secret\u2014 about the size of a closed fist, a garnet-colored thing inside the dimness of a human body that was still faceless and sexless; he dreamed it, with painstaking love, for fourteen brilliant nights. Each night he perceived it with greater clarity, greater certainty. He did not touch it; he only witnessed it, observed it, corrected it, perhaps, with his eyes. He perceived it, he lived it, from many angles, many distances. On the fourteenth night, he stroked the pulmonary artery with his forefinger, and then the entire heart, inside and out. And his inspection made him proud. He deliberately did not sleep the next night; then he took up the heart again, invoked the name of a planet, and set about dreaming another of the major organs. Before the year was out he had reached the skeleton, the eyelids."],[30,365,"Dahlmann managed to sleep, but by the early hours of morning he was awake, and from that time on, the flavor of all things was monstrous to him. Fever wore him away, and illustrations from the Arabian Nights began to illuminate nightmares. Friends and members of his family would visit him and with exaggerated smiles tell him how well he looked. Dahlmann, in a kind of feeble stupor, would hear their words, and it would amaze him that they couldn't see he was in hell. Eight days passed, like eight hundred years. One afternoon, his usual physician appeared with a new man, and they drove Dahlmann to a sanatorium on Calle Ecuador; he needed to have an X-ray. Sitting in the cab they had hired to drive them, Dahlmann reflected that he might, at last, in a room that was not his own, be able to sleep. He felt happy, he felt like talking, but the moment they arrived, his clothes were stripped from him, his head was shaved, he was strapped with metal bands to a table, he was blinded and dizzied with bright lights, his heart and lungs were listened to, and a man in a surgical mask stuck a needle in his arm. He awoke nauseated, bandaged, in a cell much like the bottom of a well, and in the days and nights that followed, he realized that until then he had been only somewhere on the outskirts of hell. Ice left but the slightest trace of coolness in his mouth. During these days, Dahlmann hated every inch of himself; he hated his identity, his bodily needs, his humiliation, the beard that prickled his face. He stoically suffered the treatments administered to him, which were quite painful, but when the surgeon told him he'd been on the verge of death from septicemia, Dahlmann, suddenly self-pitying, broke down and cried. The physical miseries, the unending anticipation of bad nights had not allowed him to think about anything as abstract as death. The next day, the surgeon told him he was coming right along, and that he'd soon be able to go out to the country house to convalesce. Incredibly, the promised day arrived."],[31,221,"When I disentangled myself at last from that nightmare, I found that my hands were bound behind my back and I was lying in an oblong stone niche no bigger than a common grave, scraped into the caustic slope of a mountain. The sides of the cavity were humid, and had been polished as much by time as by human hands. In my chest I felt a painful throbbing, and I burned with thirst. I raised my head and cried out weakly. At the foot of the mountain ran a noiseless, impure stream, clogged by sand and rubble; on the far bank, the patent City of the Immortals shone dazzlingly in the last (or first) rays of the sun. I could see fortifications, arches, frontispieces, and forums; the foundation of it all was a stone plateau. A hundred or more irregular niches like my own riddled the mountain and the valley. In the sand had been dug shallow holes; from those wretched holes, from the niches, emerged naked men with gray skin and neglected beards. I thought I recognized these men: they belonged to the bestial lineage of the Troglodytes, who infest the shorelines of the Persian Gulf and the grottoes of Ethiopia; I was surprised neither by the fact that they did not speak nor by seeing them devour serpents."],[42,69,"I felt lost. The sand crushed my mouth, but I cried out: I cannot be killed by sand that I dream \u2014 nor is there any such thing as a dream within a dream. A bright light woke me. In the darkness above me, there hovered a circle of light. I saw the face and hands of the jailer, the pulley, the rope, the meat, and the water jugs."],[94,35,"I know that it was almost horrific while it lasted\u2014and it grew worse yet through the sleepless nights that followed. That does not mean that anyone else will be stirred by my telling of it."]],[[16,265,"In the cosmogonies of the Gnostics, the demiurges knead up a red Adam who cannot manage to stand; as rude and inept and elementary as that Adam of dust was the Adam of dream wrought from the sorcerer's nights. One afternoon, the man almost destroyed his creation, but he could not bring himself to do it. (He'd have been better off if he had.) After making vows to all the deities of the earth and the river, he threw himself at the feet of the idol that was perhaps a tiger or perhaps a colt, and he begged for its untried aid. That evening, at sunset, the statue filled his dreams. In the dream it was alive, and trembling\u2014yet it was not the dread-inspiring hybrid form of horse and tiger it had been. It was, instead, those two vehement creatures plus bull, and rose, and tempest, too\u2014and all that, simultaneously. The manifold god revealed to the man that its earthly name was Fire, and that in that circular temple (and others like it) men had made sacrifices and worshiped it, and that it would magically bring to life the phantasm the man had dreamed\u2014so fully bring him to life that every creature, save Fire itself and the man who dreamed him, would take him for a man of flesh and blood. Fire ordered the dreamer to send the youth, once instructed in the rites, to that other ruined temple whose pyramids still stood downriver, so that a voice might glorify the god in that deserted place. In the dreaming man's dream, the dreamed man awoke."],[26,52,"He remembered that the dreams of men belong to God and that Maimonides had written that the words of a dream, when they are clear and distinct and one cannot see who spoke them, are holy. Hladik put his clothes on; two soldiers entered the cell and ordered him to follow them."],[31,133,"Nights in the desert can be frigid, but that night had been like a cauldron. I dreamed that a river in Thessaly (into whose waters I had thrown back a golden fish) was coming to save me; I could hear it approaching over the red sand and the black rock; a coolness in the air and the scurrying sound of rain awakened me. I ran out naked to welcome it. The night was waning; under the yellow clouds, the tribe, as joyously as I, was offering itself up to the vivid torrents in a kind of ecstasy\u2014they reminded me of Corybantes possessed by the god. Argos, his eyes fixed on the empyrean, was moaning; streams of water rolled down his face\u2014not just rain, but also (I later learned) tears. Argos, I cried, Argos!"]],[[16,154,"The man's victory, and his peace, were dulled by the wearisome sameness of his days. In the twilight hours of dusk and dawn, he would prostrate himself before the stone figure, imagining perhaps that his unreal son performed identical rituals in other circular ruins, downstream. At night he did not dream, or dreamed the dreams that all men dream. His perceptions of the universe's sounds and shapes were somewhat pale: the absent son was nourished by those diminutions of his soul. His life's goal had been accomplished; the man lived on now in a sort of ecstasy. After a period of time (which some tellers of the story choose to compute in years, others in decades), two rowers woke the man at midnight. He could not see their faces, but they told him of a magical man in a temple in the North, a man who could walk on fire and not be burned."],[19,213,"When it was announced that the Library contained all books, the first reaction was unbounded joy. All men felt themselves the possessors of an intact and secret treasure. There was no personal problem, no world problem, whose eloquent solution did not exist\u2014somewhere in some hexagon. The universe was justified; the universe suddenly became congruent with the unlimited width and breadth of humankind's hope. At that period there was much talk of The Vindications\u2014books of apologi\u00e0 and prophecies that would vindicate for all time the actions of every person in the universe and that held wondrous arcana for men's futures. Thousands of greedy individuals abandoned their sweet native hexagons and rushed downstairs, up-stairs, spurred by the vain desire to find their Vindication. These pilgrims squabbled in the narrow corridors, muttered dark imprecations, strangled one another on the divine staircases, threw deceiving volumes down ventilation shafts, were themselves hurled to their deaths by men of distant regions. Others went insane.... The Vindications do exist (I have seen two of them, which refer to persons in the future, persons perhaps not imaginary), but those who went in quest of them failed to recall that the chance of a man's finding his own Vindication, or some perfidious version of his own, can be calculated to be zero."],[20,105,"His face, in the vivid circle of the lamp, was undoubtedly that of an old man, though with something indomitable and even immortal about it. He read with slow precision two versions of a single epic chapter. In the first, an army marches off to battle through a mountain wilderness; the horror of the rocks and darkness inspires in them a disdain for life, and they go on to an easy victory. In the second, the same army passes through a palace in which a ball is being held; the brilliant battle seems to them a continuation of the f\u00eate, and they win it easily."],[31,196,"The notion of the world as a system of exact compensations had an enormous influence on the Immortals. In the first place, it made them immune to pity. I have mentioned the ancient quarries that dotted the countryside on the far bank of the stream; a man fell into the deepest of those pits; he could not be hurt, could not die, and yet he burned with thirst; seventy years passed before he was thrown a rope. Nor was he much interested in his own fate. His body was a submissive domestic animal; all the charity it required each month was a few hours' sleep, a little water, and a scrap of meat. But let no one imagine that we were mere ascetics. There is no more complex pleasure than thought, and it was to thought that we delivered ourselves over. From time to time, some extraordinary stimulus might bring us back to the physical world\u2014for example, on that dawn, the ancient elemental pleasure of the rain. But those lapses were extremely rare; all Immortals were capable of perfect quietude. I recall one whom I never saw standing\u2014a bird had made its nest on his breast."],[39,123,"Meanwhile, the grand days and grand nights of a thrilling war washed over us. In the air we breathed there was an emotion that resembled love. As though the ocean were suddenly nearby, there was a tonic and an exultation in the blood. In those years, everything was different\u2014even the taste of one's sleep. (I may never have been happy, but it is common knowledge that misery requires paradises lost.) There is no man who does not long for plenitude\u2014the sum of the experiences of which a man is capable; there is no man who does not fear being defrauded of a part of that infinite inheritance. But my generation has had it all, for first it was given glory, and then defeat."],[50,80,"Another memory, in which there was also a night and the foretaste of adventure, sprouted from that first one. A woman, the first woman the gods had given him, had awaited him in the darkness of a subterranean crypt, and he searched for her through galleries that were like labyrinths of stone and down slopes that descended into darkness. Why had those memories come to him, and why did they come without bitterness, like some mere foreshadowing of the present?"]],[[16,129,"The sorcerer suddenly remembered the god's words. He remembered that of all the creatures on the earth, Fire was the only one who knew that his son was a phantasm. That recollection, comforting at first, soon came to torment him. He feared that his son would meditate upon his unnatural privilege and somehow discover that he was a mere simulacrum. To be not a man, but the projection of another man's dream\u2014 what incomparable humiliation, what vertigo! Every parent feels concern for the children he has procreated (or allowed to be procreated) in happiness or in mere confusion; it was only natural that the sorcerer should fear for the future of the son he had conceived organ by organ, feature by feature, through a thousand and one secret nights."],[50,162,"As though he weren't paying attention, or didn't understand, his father let him talk, but then he took a bronze knife down from the wall\u2014a beautiful knife, charged with power, that the boy had furtively coveted. Now he held it in his hands, and the surprise of pos-session wiped away the insult that he had suffered, but his father's voice was speaking: Let it be known that you are a man, and there was a command in the voice. Night's blindness was upon the paths; clutching to himself the knife in which he sensed a magical power, the boy descended the steep rough hillside that his house stood on and ran to the seashore, dreaming that he was Ajax and Perseus and peopling the dark salt air with wounds and battles. It was the precise flavor of that moment that he sought for now; the rest didn't matter\u2014the insulting words of his challenge, the clumsy combat, the return with the bloodied blade."],[110,35,"The young man was ashamed. Paracelsus was a charlatan, or a mere visionary, and he, an intruder, had come through his door and forced him now to confess that his famed magic arts were false."]],[[16,179,"The end of his meditations came suddenly, but it had been foretold by certain signs: first (after a long drought), a distant cloud, as light as a bird, upon a mountaintop; then, toward the South, the sky the pinkish color of a leopard's gums; then the clouds of smoke that rusted the iron of the nights; then, at last, the panicked flight of the animals\u2014for that which had occurred hundreds of years ago was being repeated now. The ruins of the sanctuary of the god of Fire were destroyed by fire. In the birdless dawn, the sorcerer watched the concentric holocaust close in upon the walls. For a moment he thought of taking refuge in the water, but then he realized that death would be a crown upon his age and absolve him from his labors. He walked into the tatters of flame, but they did not bite his flesh\u2014they caressed him, bathed him without heat and without combustion. With relief, with humiliation, with terror, he realized that he, too, was but appearance, that another man was dreaming him."],[26,227,"The weapons converged upon Hladik, but the men who were to kill him were immobile. The sergeant's arm seemed to freeze, eternal, in an inconclusive gesture. On one of the paving stones of the yard, a bee cast a motionless shadow. As though in a painting, the wind had died. Hladik attempted a scream, a syllable, the twisting of a hand. He realized that he was paralyzed. He could hear not the slightest murmur of the halted world. I am in hell, he thought, I am dead. Then I am mad, he thought. And then, time has halted. Then he reflected that if that were true, his thoughts would have halted as well. He tried to test this conjecture: he repeated (without moving his lips) Virgil's mysterious fourth eclogue. He imagined that the now-remote soldiers must be as disturbed by this as he was; he wished he could communicate with them. He was surprised and puzzled to feel neither the slightest weariness nor any faintness from his long immobility. After an indeterminate time, he slept. When he awoke, the world was still motionless and muffled. The drop of water still hung on his cheek; on the yard, there still hung the shadow of the bee; in the air the smoke from the cigarette he'd smoked had never wafted away. Another of those \"days\" passed before Hladik understood."],[43,140,"Dunraven burst forth in a torrent of curses and invoked the eyewitness of the rector's elder son\u2014Allaby, apparently, having died\u2014and of every inhabitant of Pentreath. No less taken aback than Dunraven must have been, Unwin begged his pardon. Time, in the dark, seemed slower, longer; both men feared they had lost their way, and they were very tired by the time a dim brightness coming from above showed them the first steps of a narrow staircase. They climbed the stairs and found themselves in a round apartment, a good bit run-down and gone to seed. Two signs of the ill-fated king remained: a narrow window that looked out over the moors and the sea, and, in the floor, the trap door that opened onto the curve of the staircase. The apartment, though spacious, was very much like a jail cell."],[71,211,"From the half-light of dawn to the half-light of evening, the eyes of a leopard, in the last years of the twelfth century, looked upon a few wooden boards, some vertical iron bars, some varying men and women, a blank wall, and perhaps a stone gutter littered with dry leaves. The leopard did not know, could not know, that it yearned for love and cruelty and the hot pleasure of tearing flesh and a breeze with the scent of deer, but something in-side it was suffocating and howling in rebellion, and God spoke to it in a dream: You shall live and die in this prison, so that a man that I have knowledge of may see you a certain number of times and never forget you and put your figure and your symbol into a poem, which has its exact place in the weft of the universe. You suffer captivity, but you shall have given a word to the poem. In the dream, God illuminated the animal's rude understanding and the animal grasped the reasons and accepted its fate, but when it awoke there was only an obscure resignation in it, a powerful ignorance, because the machine of the world is exceedingly complex for the simplicity of a savage beast."],[110,73,"Night was coming on. The guttering fire in the hearth threw irregular shadows into the room. Getting up to light the iron lamp was too much trouble. Paracelsus, weary from the day, grew absent, and the prayer was forgotten. Night had expunged the dusty retorts and the furnace when there came a knock at his door. Sleepily he got up, climbed the short spiral stair-case, and opened one side of the double door."]],[[17,165,"On nights when the moon is full, this symbol gives me power over men with the mark of Gimel, but it subjects me to those with the Aleph, who on nights when there is no moon owe obedience to those marked with the Gimel. In the half-light of dawn, in a cellar, standing before a black altar, I have slit the throats of sacred bulls. Once, for an entire lunar year, I was declared invisible\u2014I would cry out and no one would heed my call, I would steal bread and not be beheaded. I have known that thing the Greeks knew not\u2014uncertainty. In a chamber of brass, as I faced the strangler's silent scarf, hope did not abandon me; in the river of delights, panic has not failed me. Heraclides Ponticus reports, admiringly, that Pythagoras recalled having been Pyrrhus, and before that, Euphorbus, and before that, some other mortal; in order to recall similar vicissitudes, I have no need of death, nor even of imposture."],[31,101,"I cannot say how many days and nights passed over me. In pain, unable to return to the shelter of the caverns, naked on the unknown sand, I let the moon and the sun cast lots for my bleak fate. The Troglodytes, childlike in their barbarity, helped me neither survive nor die. In vain did I plead with them to kill me. One day, with the sharp edge of a flake of rock, I severed my bonds. The next, I stood up and was able to beg or steal\u2014I, Marcus Flaminius Rufus, military tribune of one of the legions of Rome"],[42,82,"On the day before the burning of the Pyramid, the men who got down from their high horses scourged me with burning irons, to compel me to re-veal the site of a buried treasure. Before my eyes they toppled the idol to the god, yet the god did not abandon me, and I held my silence through their tortures. They tore my flesh, they crushed me, they mutilated me, and then I awoke in this prison, which I will never leave alive."],[109,145,"The villagers' attitude toward me began to change. I had been touched by something of the divinity that inhered in the stones the villagers had named \"blue tigers,\" but I was also known to have profaned the summit. At any moment of the night, at any moment of the day, the gods might punish me. The villagers dared not attack me or condemn what I had done, but I noticed that everyone was now dangerously servile. I never again laid eyes on the child who had played with the stones. I feared poison, or a knife in the back. One morning before dawn I slipped out of the village. I sensed that its entire population had been keeping an eye on me, and that my escape would be a relief to them. Since that first morning, no one had ever asked to see the stones."]],[[17,94,"I owe that almost monstrous variety to an institution\u2014the Lottery\u2014 which is unknown in other nations, or at work in them imperfectly or secretly. I have not delved into this institution's history. I know that sages cannot agree. About its mighty purposes I know as much as a man untutored in astrology might know about the moon. Mine is a dizzying country in which the Lottery is a major element of reality; until this day, I have thought as little about it as about the conduct of the indecipherable gods or of my heart."],[97,71,"Such reports, as the reader may imagine, disturbed me. I know that I am notorious for my curiosity, which has, variously, led me into marriage with a woman utterly unlike myself (solely so that I might discover who she was and what she was really like), into trying laudanum (with no appreciable result), into an exploration of transfinite numbers, and into the terrifying adventure whose story I am about to tell."],[109,66,"The same yearning for order that had created mathematics in the first place made me seek some order in that aberration of mathematics, the insensate stones that propagate themselves. I attempted to find a law within their unpredictable variations. I devoted days and nights alike to establishing statistics on the changes. From that stage of my investigations I still have several notebooks, vainly filled with ciphers."]],[[17,506,"The lower-caste neighborhoods of the city voiced a different complaint. The members of the priestly class gambled heavily, and so enjoyed all the vicissitudes of terror and hope; the poor (with understandable, or inevitable, envy) saw themselves denied access to that famously delightful, even sensual, wheel. The fair and reasonable desire that all men and women, rich and poor, be able to take part equally in the Lottery inspired indignant demonstrations\u2014the memory of which, time has failed to dim. Some stubborn souls could not (or pretended they could not) understand that this was a novu sordo sedorum, a necessary stage of history.... A slave stole a crimson ticket; the drawing determined that that ticket entitled the bearer to have his tongue burned out. The code of law provided the same sentence for stealing a lottery ticket. Some Babylonians argued that the slave deserved the burning iron for being a thief; others, more magnanimous, that the executioner should employ the iron because thus fate had decreed.... There were disturbances, there were regrettable instances of bloodshed, but the masses of Babylon at last, over the opposition of the well-to-do, imposed their will; they saw their generous objectives fully achieved. First, the Company was forced to assume all public power. (The unification was necessary because of the vastness and complexity of the new operations.) Second, the Lottery was made secret, free of charge, and open to all. The mercenary sale of lots was abolished; once initiated into the mysteries of Baal, every free man automatically took part in the sacred drawings, which were held in the labyrinths of the god every sixty nights and determined each man's destiny until the next drawing. The consequences were incalculable. A lucky draw might bring about a man's elevation to the council of the magi or the imprisonment of his enemy (secret, or known by all to be so), or might allow him to find, in the peaceful dimness of his room, the woman who would begin to disturb him, or whom he had never hoped to see again; an unlucky draw: mutilation, dishonor of many kinds, death itself. Sometimes a single event\u2014the murder of C in a tavern, B's mysterious apotheosis\u2014would be the inspired outcome of thirty or forty drawings. Combining bets was difficult, but we must recall that the individuals of the Company were (and still are) all-powerful, and clever. In many cases, the knowledge that certain happy turns were the simple result of chance would have lessened the force of those outcomes; to forestall that problem, agents of the Company employed suggestion, or even magic. The paths they followed, the intrigues they wove, were invariably secret. To penetrate the innermost hopes and innermost fears of every man, they called upon astrologers and spies. There were certain stone lions, a sacred latrine called Qaphqa, some cracks in a dusty aqueduct\u2014 these places, it was generally believed, gave access to the Company, and well- or ill-wishing persons would deposit confidential reports in them. An alphabetical file held those dossiers of varying veracity."],[19,96,"The certainty that some bookshelf in some hexagon contained precious books, yet that those precious books were forever out of reach, was almost unbearable. One blasphemous sect proposed that the searches be discontinued and that all men shuffle letters and symbols until those canonical books, through some improbable stroke of chance, had been constructed. The authorities were forced to issue strict orders. The sect disappeared, but in my childhood I have seen old men who for long periods would hide in the latrines with metal disks and a forbidden dice cup, feebly mimicking the divine disorder."],[25,158,"L\u00f6nnrot resisted a smile. Suddenly turned bibliophile or Hebraist, he ordered one of the officers to wrap up the dead man's books, and he took them to his apartment. Then, indifferent to the police investigation, he set about studying them. One book, an octavo volume, revealed to him the teachings of Israel Baal Shem Tov, the founder of the sect of the Pious; another, the virtues and terrors of the Tetragrammaton, the ineffable name of God; yet another, the notion that God has a secret name, which (much like the crystal sphere attributed by the Persians to Alexander of Macedonia) contains His ninth attribute, the eternity\u2014that is, immediate knowledge\u2014 of all things that shall be, are, and have been in the universe. Tradition reckons the names of God at ninety-nine; while Hebraists attribute that imperfect sum to the magical fear of even numbers, the Hasidim argue that the lacuna points toward a hundredth name \u2014 the Absolute Name."],[27,215,"In vain did the bookstores of Stockholm and Lund offer readers this revelation. The incredulous considered it, a priori, a vapid and tedious theological game; theologians disdained it. Runeberg sensed in that ecumenical indifference an almost miraculous confirmation. God had ordered that indifference; God did not want His terrible secret spread throughout the earth. Runeberg realized that the hour was not yet come. He felt that ancient, divine curses were met in him. He recalled Elijah and Moses, who covered their faces upon the mountain so as not to look upon God; Isaiah, who was terrified when his eyes beheld the One whose glory fills the earth; Saul, whose eyes were blinded on the road to Damascus; the rabbi Simeon ben Azai, who saw the Garden and died; the famous wizard John of Viterbo, who went mad when the Trinity was revealed to him; the Midrashim, who abominate those who speak the Shem Ham ephorash, the Secret Name of God. Was it not that dark sin that he, Runeberg, was guilty of? Might not that be the blasphemy against the Holy Ghost (Matthew 12:31) which shall not be forgiven? Valerius Soranus died for revealing the hidden name of Rome; what infinite punishment would be Runeberg's for having discovered and revealed the terrible name of God?"],[29,515,"Lacking a sacred book to unite them as the Scriptures unite Israel, lacking a common memory, lacking that other memory that is a common language, scattered across the face of the earth, diverse in color and in feature, there is but one thing\u2014the Secret\u2014that unites them, and that will unite them until the end of time. Once, in addition to the Secret there was a legend (and perhaps a cosmogonie myth), but the superficial men of the Phoenix have forgotten it, and today all that is left to them is the dim and obscure story of a punishment. A punishment, or a pact, or a privilege\u2014versions differ; but what one may dimly see in all of them is the judgment of a God who promises eternity to a race of beings if its men, generation upon generation, perform a certain ritual. I have compared travelers' reports, I have spoken with patriarchs and theologians; I can attest that the performance of that ritual is the only religious practice observed by the members of the cult. The ritual is, in fact, the Secret. The Secret, as I have said, is transmitted from generation to generation, but tradition forbids a mother from teaching it to her children, as it forbids priests from doing so; initiation into the mystery is the task of the lowest individuals of the group. A slave, a leper, or a beggar plays the role of mystagogue. A child, too, may catechize another child. The act itself is trivial, the matter of a moment's time, and it needs no description. The materials used are cork, wax, or gum arabic. (In the liturgy there is mention of \"slime\"; pond slime is often used as well.) There are no temples dedicated expressly to the cult's worship, but ruins, cellars, or entryways are considered appropriate sites. The Secret is sacred, but that does not prevent its being a bit ridiculous; the performance of it is furtive, even clandestine, and its adepts do not speak of it. There are no decent words by which to call it, but it is understood that all words somehow name it, or rather, that they inevitably allude to it\u2014and so I have said some insignificant thing in conversation and have seen adepts smile or grow uncomfortable because they sensed I had touched upon the Secret. In Germanic literatures there are poems written by members of the cult whose nominal subject is the sea or twilight; more than once I have heard people say that these poems are, somehow, symbols of the Secret. Orbis terrarium est speculum Ludi, goes an apocryphal saying reported by du Gange in his Glossary. A kind of sacred horror keeps some of the faithful from performing that simplest of rituals; they are despised by the other members of the sect, but they despise themselves even more. Those, on the other hand, who deliberately renounce the Practice and achieve direct commerce with the Deity command great respect; such men speak of that commerce using figures from the liturgy, and so we find that John of the Rood wrote as follows:"],[98,189,"Divine mercy, to which I myself owe so many blessings, has allowed me to discover the true and secret reason for the Sect's name. In Kerioth, where it is plausibly reputed to have arisen, there has survived a conventicle known as the Thirty Pieces of Silver. That was the Sect's original name, and it provides us with the key. In the tragedy of the Cross (and I write this with all the reverence which is its due) there were those who acted knowingly and those who acted unknowingly; all were essential, all inevitable. Unknowing were the priests who delivered the pieces of silver; unknowing, too, was the mob that chose Barabbas; unknowing the Judean judge, the Romans who erected the Cross on which He was martyred and who drove the nails and cast the lots. Of knowing actors, there were but two: Judas and the Redeemer. Judas cast away the thirty coins that were the price of our souls' salvation and immediately hanged himself. At that moment he was thirty-three years old, the age of the Son of Man. The Sect venerates the two equally, and absolves the others."]],[[18,97,"incomprehensible murder in the early pages of the book, a slow discussion in the middle, and a solution of the crime toward the end. Once the mystery has been cleared up, there is a long retrospective paragraph that contains the following sentence: Everyone believed that the chess players had meta-accidentally. That phrase allows one to infer that the solution is in fact in error, and so, uneasy, the reader looks back over the pertinent chapters and discovers another solution, which is the correct one. The reader of this remarkable book, then, is more perspicacious than the detective."],[24,30,"This sentence does not jibe with Kilpatrick's customary mercifulness. Ryan investigates the matter (his investigation being one of the gaps in the book's narration) and manages to decipher the enigma."],[43,57,"Dunraven, who had read a great many detective novels, thought that the solution of a mystery was always a good deal less interesting than the mystery itself; the mystery had a touch of the supernatural and even the divine about it, while the solution was a sleight of hand. In order to postpone the inevitable, he said:"]],[[18,282,"In the works we have looked at so far, a formal complexity hobbles the author's imagination; in The Secret Mirror, that imagination is given freer rein. The play's first (and longer) act takes place in the country home of General Thrale, C.I.E., near Melton Mowbray. The unseen center around which the plot revolves is Miss Ulrica Thrale, the general's elder daughter. Snatches of dialog give us glimpses of this young woman, a haughty Amazon-like creature; we are led to suspect that she seldom journeys to the realms of literature. The newspapers have announced her engagement to the duke of Rutland; the newspapers then report that the engagement is off. Miss Thrale is adored by a playwright, one Wilfred Quarles; once or twice in the past, she has bestowed a distracted kiss upon this young man. The characters possess vast fortunes and ancient blood-lines; their affections are noble though vehement; the dialog seems to swing between the extremes of a hollow grandiloquence worthy of Bulwer-Lytton and the epigrams of Wilde or Philip Guedalla. There is a nightingale and a night; there is a secret duel on the terrace. (Though almost entirely imperceptible, there are occasional curious contradictions, and there are sordid details.) The characters of the first act reappear in the second\u2014 under different names. The \"playwright\" Wilfred Quarles is a traveling salesman from Liverpool; his real name is John William Quigley. Miss Thrale does exist, though Quigley has never seen her; he morbidly clips pictures of her out of the Tatler or the Sketch. Quigley is the author of the first act; the implausible or improbable \"country house\" is the Jewish-Irish rooming house he lives in, transformed and magnified by his imagination\u2026"],[24,535,"Kilpatrick was a conspirator and a secret and glorious captain of conspirators. Like Moses, who from the land of Moab glimpsed yet could not reach the promised land, Kilpatrick perished on the eve of the victorious rebellion he had planned for and dreamed of. The date of the first centenary of his death is approaching; the circumstances of the crime are enigmatic; Ryan, who is writing a biography of the hero, discovers that the enigma goes deeper than mere detective work can fathom. Kilpatrick was murdered in a theater; the English police never apprehended the assassin. Historians claim that this failure does not tarnish the good name of the police, since it is possible that the police themselves had Kilpatrick murdered. Other aspects of the mystery disturb Ryan; certain things seem almost cyclical, seem to repeat or combine events from distant places, distant ages. For example: Everyone knows that the constables who examined the hero's body found a sealed letter warning Kilpatrick not to go to the theater that night; Julius Caesar, too, as he was walking toward the place where the knives of his friends awaited him, received a note he never read\u2014a note telling him of his betrayal and revealing the names of his betrayers. Caesar's wife, Calpurnia, saw in dreams a tower felled by order of the Senate; on the eve of Kilpatrick's death, false and anonymous rumors of the burning of the circular tower of Kilgarvan spread throughout the country\u2014an event that might be taken as an omen, since Kilpatrick had been born in Kilgarvan. These (and other) parallels between the story of Julius Caesar and the story of an Irish conspirator induce Ryan to imagine some secret shape of time, a pattern of repeating lines. His thoughts turn to the decimal history conceived by Condorcet, the morphologies proposed by Hegel, Spengler, and Vico, mankind as posited by Hesiod, degenerating from gold to iron. He thinks of the transmigration of souls, a doctrine that lends horror to Celtic literature and that Caesar himself attributed to the Druids of Britain; he toys with the idea that before Fergus Kilpatrick was Fergus Kilpatrick, he was Julius Caesar. He is saved from those circular labyrinths by a curious discovery, a discovery which, however, will plunge him deep into other, yet more tangled and heterogeneous mazes: It seems that certain words spoken by a beggar who spoke with Fergus Kilpatrick on the day of his death had been pre-figured by Shakespeare, in Macbeth. The idea that history might have copied history is mind-boggling enough; that history should copy literature is inconceivable-- ---Ryan digs further, and he finds that in 1814 James Alexander Nolan, the oldest of the hero's comrades, had translated Shakespeare's major plays into Gaelic\u2014among them Julius Caesar. He also finds in the archives a manuscript article by Nolan on the Swiss Festspiele \u2014 vast peripatetic theatrical performances that require thousands of actors and retell historical episodes in the same cities, the same mountains in which they occurred. Another unpublished document reveals to Ryan that a few days before the end, Kilpatrick, presiding over the last gathering of his chiefs, had signed the death sentence of a traitor, whose name has been scratched out."],[26,308,"This play observed the unities of time, place, and action; it took place in Hradcany, in the library of Baron R\u00f6merstadt, on one of the last evenings of the nineteenth century. In Act I, Scene I, a stranger pays a visit to R\u00f6merstadt. (A clock strikes seven, a vehemence of last sunlight exalts the window-panes, on a breeze float the ecstatic notes of a familiar Hungarian melody.) This visit is followed by others; the persons who come to importune R\u00f6merstadt are strangers to him, though he has the uneasy sense that he has seen them before, perhaps in a dream. All fawn upon him, but it is clear\u2014 first to the play's audience, then to the baron himself\u2014that they are secret enemies, sworn to his destruction. R\u00f6merstadt manages to check or fend off their complex intrigues; in the dialogue they allude to his fianc\u00e9e, Julia de Weidenau, and to one Jaroslav Kubin, who once importuned her with his love. Kubin has now gone mad, and believes himself to be R\u00f6merstadt.... The dangers mount; by the end of the second act, R\u00f6merstadt finds himself forced to kill one of the conspirators. Then the third and last act begins. Little by little, incoherences multiply; actors come back onstage who had apparently been discarded from the plot; for one instant, the man that R\u00f6merstadt killed returns. Someone points out that the hour has grown no later: the clock strikes seven; upon the high windowpanes the western sunlight shimmers; the thrilling Hungarian melody floats upon the air. The first interlocutor comes onstage again and repeats the same words he spoke in Act I, Scene I. Without the least surprise or astonishment, R\u00f6merstadt talks with him; the audience realizes that R\u00f6merstadt is the pitiable Jaroslav Kubin. The play has not taken place; it is the circular delirium that Kubin endlessly experiences and re-experiences."]],[[18,69,"The plot of the two acts is parallel, though in the second everything is slightly menacing\u2014 everything is put off, or frustrated. When The Secret Mirror first opened, critics spoke the names \"Freud\" and \"Julian Green.\" In my view, the mention of the first of those is entirely unjustified. Report had it that The Secret Mirror was a Freudian comedy; that favorable (though fallacious) reading decided the play's success."],[21,108,"Postscript, 1956. 1 have added three stories to this volume: \"The South,\" \"The Cult of the Phoenix,\" and \"The End.\" Aside from one character, Recabarren, whose immobility and passivity serve as contrast, nothing (or almost nothing) in the brief course of that last story is of my invention\u2014everything in it is implicit in a famous book, though I have been the first to perceive it, or at least to declare openly that I have. In the allegory of the Phoenix, I set myself the problem of suggesting a common act\u2014the Secret\u2014hesitatingly, gradually, and yet, in the end, unequivocally; I am not sure to what extent I have succeeded."],[29,95,"On three continents I have merited the friendship of many worshipers of the Phoenix; I know that the Secret at first struck them as banal, shameful, vulgar, and (stranger still) unbelievable. They could not bring themselves to admit that their parents had ever stooped to such acts. It is odd that the Secret did not die out long ago; but in spite of the world's vicissitudes, in spite of wars and exoduses, it does, in its full awesomeness, come to all the faithful. Someone has even dared to claim that by now it is instinctive."]],[[19,133,"Like all the men of the Library, in my younger days I traveled; I have journeyed in quest of a book, perhaps the catalog of catalogs. Now that my eyes can hardly make out what I myself have written, I am preparing to die, a few leagues from the hexagon where I was born. When I am dead, compassionate hands will throw me over the railing; my tomb will be the unfathomable air, my body will sink for ages, and will decay and dissolve in the wind engendered by my fall, which shall be infinite. I declare that the library is endless. Idealists argue that the hexagonal rooms are the necessary shape of absolute space, or at least of our perception of space. They argue that a triangular or pentagonal chamber is inconceivable."],[49,95,"At this point, my dream begins to fade and melt away, like water in water. The vast library surrounding me is on Calle Mexico, not Rodr\u00edguez Pe\u00f1a, and you, Lugones, killed yourself in early '38. My vanity and my nostalgia have confected a scene that is impossible. Maybe so, I tell myself, but tomorrow I too will be dead and our times will run together and chronology will melt into an orb of symbols, and somehow it will be true to say that I have brought you this book and that you have accepted it."],[91,86,"\"Here, history is kinder,\" I said. \"I expect to die in this house, where I was born. It was to this house that my great-grandfather, who had been all over the continent, returned when he brought home that sword; it is in this house that I have sat to contemplate the past and write my books. I might almost say that I have never left this library\u2014but now, at last, I am to leave it, to journey across the landscape I have only traveled on maps.\""]],[[19,192,"That discovery enabled mankind, three hundred years ago, to formulate a general theory of the Library and thereby satisfactorily solve the riddle that no conjecture had been able to divine\u2014the formless and chaotic nature of virtually all books. One book, which my father once saw in a hexagon in circuit 15-94, consisted of the letters M C V perversely repeated from the first line to the last. Another (much consulted in this zone) is a mere labyrinth of letters whose penultimate page contains the phrase O Time thy pyramids. This much is known: For every rational line or forthright statement there are leagues of senseless cacophony, verbal nonsense, and incoherency. (I know of one semi-barbarous zone whose librarians repudiate the \"vain and superstitious habit\" of trying to find sense in books, equating such a quest with attempting to find meaning in dreams or in the chaotic lines of the palm of one's hand.... They will acknowledge that the inventors of writing imitated the twenty-five natural symbols, but contend that that adoption was fortuitous, coincidental, and that books in themselves have no meaning. That argument, as we shall see, is not entirely fallacious.)"],[20,188,"\"A labyrinth of symbols,\" he corrected me. \"An invisible labyrinth of time. I, an English barbarian, have somehow been chosen to unveil the diaphanous mystery. Now, more than a hundred years after the fact, the precise details are irrecoverable, but it is not difficult to surmise what happened. Ts'ui Pen must at one point have remarked, 'I shall retire to write a book,' and at another point, 'I shall retire to construct a labyrinth.' Everyone pictured two projects; it occurred to no one that book and labyrinth were one and the same. The Pavillion of Limpid Solitude was erected in the centre of a garden that was, perhaps, most intricately laid out; that fact might well have suggested a physical labyrinth. Ts'ui Pen died; no one in all the wide lands that had been his could find the labyrinth. The novel's confusion\u2014confusedness, I mean, of course\u2014suggested to me that it was that labyrinth. Two circumstances lent me the final solution of the problem\u2014one, the curious legend that Ts'ui Pen had intended to construct a labyrinth which was truly infinite, and two, a fragment of a letter I discovered.\""],[31,136,"Its patent antiquity (though somehow terrible to the eyes) seemed to accord with the labor of immortal artificers. Cautiously at first, with indifference as time went on, desperately toward the end, I wandered the staircases and inlaid floors of that labyrinthine palace. (I discovered afterward that the width and height of the treads on the staircases were not constant; it was this that explained the extraordinary weariness I felt.) This palace is the work of the gods, was my first thought. I explored the uninhabited spaces, and I corrected myself: The gods that built this place have died. Then I reflected upon its peculiarities, and told myself: The gods that built this place were mad. I said this, I know, in a tone of incomprehensible reproof that verged upon remorse\u2014with more intellectual horror than sensory fear."],[42,156,"That thought gave me spirit, and then filled me with a kind of vertigo. In the wide realm of the world there are ancient forms, incorruptible and eternal forms \u2014 any one of them might be the symbol that I sought. A mountain might be the word of the god, or a river or the empire or the arrangement of the stars. And yet, in the course of the centuries mountains are leveled and the path of a river is many times diverted, and empires know mutability and ruin, and the design of the stars is altered. In the firmament there is change. The mountain and the star are individuals, and the life of an individual runs out. I sought something more tenacious, more invulnerable. I thought of the generations of grain, of grasses, of birds, of men. Perhaps the spell was written upon my very face, perhaps I myself was the object of my search."],[109,131,"During that time, I often dreamed about the stones. The fact that the dream did not recur every night left me a sliver of hope, though a hope that soon turned to terror. The dream was always more or less the same; the be-ginning heralded the feared end. A spiral staircase\u2014an iron railing and a few iron treads\u2014and then a cellar, or system of cellars, leading through the depths to other stairways that might abruptly end, or suddenly lead into ironworks, locksmith's forges, dungeons, or swamps. At the bottom, in their expected crevice in the earth, the stones, which were also Behemoth, or Leviathan\u2014the creatures of the Scriptures that signify that God is irrational. I would awaken trembling, and there the stones would be, in their box, ready to transform themselves."]],[[19,160,"For many years it was believed that those impenetrable books were in ancient or fardistant languages. It is true that the most ancient peoples, the first librarians, employed a language quite different from the one we speak today; it is true that a few miles to the right, our language devolves into dialect and that ninety floors above, it becomes incomprehensible. All of that, I repeat, is true\u2014but four hundred ten pages of unvarying M C V's cannot belong to any language, however dialectal or primitive it may be. Some have suggested that each letter influences the next, and that the value of M C V on page 71, line 3, is not the value of the same series on another line of another page, but that vague thesis has not met with any great acceptance. Others have mentioned the possibility of codes; that conjecture has been universally accepted, though not in the sense in which its originators formulated it."],[102,71,"On one of the walls I noticed a bookshelf. I opened a volume at random; the letters were clear and indecipherable and written by hand. Their angular lines reminded me of the runic alphabet, though it had been used only for inscriptions. It occurred to me that the people of the future were not only taller, they were more skilled as well. I instinctively looked at the man's long elegant fingers."],[106,35,"I opened it at random. The characters were unfamiliar to me. The pages, which seemed worn and badly set, were printed in double columns, like a Bible. The text was cramped, and composed into versicles."]],[[19,76,"He showed his find to a traveling decipherer, who told him that the lines were written in Portuguese; others said it was Yiddish. Within the century experts had determined what the language actually was: a Samoyed-Lithuanian dialect of Guaran\u00ed, with inflections from classical Arabic. The content was also determined: the rudiments of combinatory analysis, illustrated with examples of endlessly repeating variations. Those examples allowed a librarian of genius to discover the fundamental law of the Library."],[22,271,"It was not without some self-importance that about that same time I had embarked upon a systematic study of Latin. In my suitcase I had brought with me Lhomond's De virisi llustribus, Quicherat's Thesaurus, Julius Caesar's commentaries, and an odd-numbered volume of Pliny's Naturalis historia\u2014a work which exceeded (and still exceeds) my modest abilities as a Latinist. There are no secrets in a small town; Ireneo, in his house on the outskirts of the town, soon learned of the arrival of those out-landish books. He sent me a flowery, sententious letter, reminding me of our \"lamentably ephemeral\" meeting \"on the seventh of February, 1884.\" He dwelt briefly, elegiacally, on the \"glorious services\" that my uncle, Gregorio Haedo, who had died that same year, \"had rendered to his two motherlands in the valiant Battle of Ituzaingo,\" and then he begged that I lend him one of the books I had brought, along with a dictionary \"for a full understanding of the text, since I must plead ignorance of Latin.\" He promised to return the books to me in good condition, and \"straightway.\" The penmanship was perfect, the letters exceptionally well formed; the spelling was that recommended by Andr\u00e9s Bello: i for y, j for g. At first, of course, I thought it was some sort of joke. My cousins assured me it was not, that this \"was just... just Ireneo.\" I didn't know whether to attribute to brazen conceit, ignorance, or stupidity the idea that hard-won Latin needed no more teaching than a dictionary could give; in order to fully disabuse Funes, I sent him Quicherat's Gradus ad Parnassum and the Pliny."],[96,168,"I arrived in London in early January of 1902.1 recall the caress of the snow, which I had never seen before, and which I must say I liked. Happily, I had not had to travel with Eguren. I stayed at a modest inn behind the British Museum, to whose library I would repair morning and afternoon, in search of a language worthy of the Congress of the World. I did not neglect the universal languages; I looked into Esperanto (which Lugones' Lunario sentimental calls \"reasonable, simple, and economical\") and Volapuk, which attempts to explore all the possibilities of language, declining verbs and conjugating nouns. I weighed the arguments for and against reviving Latin (for which one still finds some nos
