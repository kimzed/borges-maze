In 1930, I devoted an essay to Evaristo Carriego, our neighbor, a poet whose songs glorified those neighborhoods on the outskirts of the city. A short time after that, chance threw Emilio Tr\u00e0pani in my way."]],[[39,145,"I was born in Marienburg in 1908. Two passions, music and metaphysics, now almost forgotten, allowed me to face many terrible years with bravery and even happiness. I cannot list all my benefactors, but there are two names I cannot allow myself to omit: Brahms and Schopenhauer. Frequently, I also repaired to poetry; to those two names, then, I would add another colossal Germanic name: William Shakespeare. Early on, theology had held some interest for me, but I was forever turned from that fantastic discipline (and from Christianity) by Schopenhauer with his direct arguments and Shakespeare and Brahms with the infinite variety of their worlds. I wish anyone who is held in awe and wonder, quivering with tenderness and gratitude, transfixed by some passage in the work of these blessed men\u2014 anyone so touched\u2014to know that I too was once transfixed like them\u2014I the abominable."],[107,122,"In England the double is called the fetch or, more literarily, the wraith of the living; in Germany it is known as the Doppelg\u00e4nger. I suspect that one of its first aliases was the alter ego. This spectral apparition no doubt emerged from mirrors of metal or water, or simply from the memory, which makes each person both spectator and actor. My duty was to ensure that the interlocutors were different enough from each other to be two, yet similar enough to each other to be one. Do you suppose it's worth saying that I conceived the story on the banks of the Charles River, in New England, and that its cold stream reminded me of the distant waters of the Rh\u00f4ne?"],[111,99,"A scattering of critical and philological \"notes,\" as they are called, signed with my initials, complete, I believe, my literary biography. Although perhaps I might also be permitted to include an unpublished translation of Macbeth, which I began in order to distract my mind from the thought of the death of my brother, Otto Julius, who fell on the western front in 1917, I never finished translating the play; I came to realize that English has (to its credit) two registers\u2014the Germanic and the Latinate\u2014while our own German, in spite of its greater musicality, must content itself with one."]],[[39,96,"I shall say little about my years of apprenticeship. They were harder for me than for many others, for in spite of the fact that I did not lack valor, I felt no calling for violence. I did, however, realize that we were on the threshold of a new age, and that that new age, like the first years of Islam or Christianity, demanded new men. As individuals, my comrades were odious to me; I strove in vain to convince myself that for the high cause that had brought us all together, we were not individuals."],[86,72,"event swore an oath of solemn silence. I too raised my hand to swear, and I felt, with all the romantic seriousness of my nine or ten years, the gravity of that rite. I can't say whether the others noticed that I gave my word; I can't say whether they kept their own. However that may be, this is the story\u2014with the inevitable changes that time, and good (or bad) literature, occasion."],[94,51,"A half century does not pass without leaving its mark. Beneath our conversation, the conversation of two men of miscellaneous readings and diverse tastes, I realized that we would not find common ground. We were too different, yet too alike. We could not deceive one another, and that makes conversation hard."],[102,34,"I tried several languages, but we couldn't make ourselves understood to each other. When he spoke, it was in Latin. I gathered my recollections of my distant student days and girded myself for conversation."]],[[40,33,"\"Some traveler, I recall,\" mused the poet Abd-al-Malik, \"speaks of a tree whose branches put forth green birds. I am pained less by believing in that tree than in roses adorned with letters.\""],[41,137,"Over and over I read Barlach's monograph. I cannot sort out my emotions; I recall my desperation when I realized that nothing could any longer save me; the inward relief of knowing that I was not to blame for my misfortune; the envy I felt for those whose Zahir was not a coin but a slab of marble or a tiger. How easy it is not to think of a tiger!, I recall thinking. I also recall the remarkable uneasiness I felt when I read this paragraph: \"One commentator of the Guishan i Raz states that 'he who has seen the Zahir soon shall see the Rose' and quotes a line of poetry interpolated into Attar's Asrar \u00d1ama('The Book of Things Unknown'): 'the Zahir is the shadow of the Rose and the rending of the Veil.' \""],[43,103,"\"Three years after the house was built, the Rose of Sharon anchored at the foot of the cliffs. I was not one of those who saw the ship, so it's altogether possible that the image I have of her is influenced by some forgotten print of Aboukir or Trafalgar, but my understanding is that she was one of those very elaborately carved vessels that seem less the work of shipwrights than of carpenters, and less that of carpenters than of cabinetmakers. She was (if not in reality, at least in my dreams) a burnished, dark, silent, swift craft, manned by Arabs and Malays."]],[[40,30,"\"A remarkable gift, the gift bestowed by poetry\u2014words written by a king homesick for the Orient served to comfort me when I was far away in Africa, homesick for Spain.\""],[94,32,"I now recall that shortly before this, he had fervently recited that short poem in which Whitman recalls a night shared beside the sea\u2014 a night when Whitman had been truly happy."],[100,75,"When the rains and snow have passed, when the nightingale has returned from its journey to the lands of the south, you shall recite your verses before the court and the Guild of Poets assembled. I give you one full year. Every letter and every word, you shall burnish to a fine gleam. The recompense, as you know, shall not be unworthy of my royal wont, nor of the hours you spend in sleepless inspiration.\""]],[[41,208,"I turned the corner; the chamfered curb in darkness at the far end of the street showed me that the establishment had closed. On Belgrano I took a cab. Possessed, without a trace of sleepiness, almost happy, I reflected that there is nothing less material than money, since any coin (a twenty-centavo piece, for instance) is, in all truth, a panoply of possible futures. Money is abstract, I said over and over, money is future time. It can be an evening just outside the city, or a Brahms melody, or maps, or chess, or coffee, or the words of Epictetus, which teach contempt of gold; it is a Proteus more changeable than the Proteus of the isle of Pharos. It is unforeseeable time, Bergsonian time, not the hard, solid time of Islam or the Porch. Adherents of determinism deny that there is any event in the world that is possible, i.e., that might occur; a coin symbolizes our free will. (I had no suspicion at the time that these \"thoughts\" were an artifice against the Zahir and a first manifestation of its demonic influence.) After long and pertinacious musings, I at last fell asleep, but I dreamed that I was a pile of coins guarded by a gryphon."],[99,89,"We were debating the problem of knowledge. Someone invoked the Platonic idea that we have already seen all things in some former world, so that \"knowing\" is in fact \"recognizing\"; my father, I think it was, said that Bacon had written that if learning was remembering, then not knowing a thing was in fact having forgotten it. Another member of the group, an elderly gentleman, who was no doubt a bit lost in all that metaphysics, decided to put in his two cents' worth. He spoke with slow assurance."],[102,86,"People believed only what they could read on the printed page. The principle, means, and end of our singular conception of the world was esse est percipi\u2014'to be is to be portrayed.' In the past I lived in, people were credulous; they believed that a piece of merchandise was good because the manufacturer of that piece of merchandise said it was. Robbery was also a frequent occurrence, though everyone knew that the possession of money brings with it neither greater happiness nor greater peace of mind.\""]],[[42,157,"The cell is deep and made of stone; its shape is that of an almost perfect hemisphere, although the floor (which is also of stone) is something less than a great circle, and this fact somehow deepens the sense of oppression and vastness. A wall divides the cell down the center; though it is very high, it does not touch the top of the vault. I, Tzinacan, priest of the Pyramid of Qaholom, which Pedrode Alvarado burned, am on one side of the wall; on the other there is a jaguar, which with secret, unvarying paces measures the time and space of its captivity. At floor level, a long window with thick iron bars interrupts the wall. At the shadowless hour [midday] a small door opens above us, and a jailer (whom the years have gradually blurred) operates an iron pulley, lowering to us, at the end of a rope, jugs of water and hunks of meat."],[48,313,"Aside from \"Emma Zunz\" (whose wonderful plot\u2014much superior to its timid execution\u2014was given me by Cecilia Ingenieros) and \"Story of the Warrior and the Captive Maiden\" (which attempts to interpret two supposedly real occurrences), the stories in this book belong to the genre of fantasy. Of them, the first is the most fully realized; its subject is the effect that immortality would have on humankind. That outline for an ethics of immortality is followed by \"The Dead Man\"; in that story, Azevedo Bandeirais a man from Rivera or Cerro Largo and also an uncouth sort of deity\u2014a mulatto, renegade version of Chesterton's incomparable Sunday. (Chapter XXIX of The Decline and Fall of the Roman Empire tells of a fate much like Otalora's, though considerably grander and more incredible.) About \"The Theologians,\" suffice it to say that they are a dream\u2014a somewhat melancholy dream\u2014of personal identity; about the \"Biography of Tadeo Isidoro Cruz,\" that it is a gloss on the Mart\u00edn Fierro. I owe to a canvas painted by Watts in 1896 the story called \"The House of Asterion\" and the character of its poor protagonist. \"The Other Death\" is a fantasy about time, which I wove under the suggestion of some of Pier Damiani's arguments. During the last war, no one could have wished more earnestly than I for Germany's defeat; no one could have felt more strongly than I the tragedy of Germany's fate; \"Deutsches Requiem\" is an attempt to understand that fate, which our own \"Germanophiles\" (who know nothing of Germany) neither wept over nor even suspected. \"The Writing of the God\" has been judged generously; the jaguar obliged me to put into the mouth of a \"priest of the Pyramid of Qaholom\" the arguments of a Kabbalist or a theologian. In \"The Zahir\" and \"The Aleph,\" I think I can detect some influence of Wells' story \"The Crystal Egg\" (1899)."],[104,70,"For the man in prison, or the blind man, time flows downstream as though down a slight decline. As he reached the midpoint of his reclusi\u00f3n, Arredondo more than once achieved that virtually timeless time. In the first patio there was a wellhead, and at the bottom, a cistern where a toad lived; it never occurred to Arredondo that it was the toad's time, bordering on eternity, that he sought."]],[[42,255,"Driven by the inevitability of doing something, of somehow filling time, I tried, in my darkness, to remember everything I knew. I squandered entire nights in remembering the order and the number of certain stone serpents, or the shape of a medicinal tree. Thus did I gradually conquer the years, thus did I gradually come to possess those things I no longer possessed. One night I sensed that a precise recollection was upon me; before the traveler sees the ocean, he feels a stirring in his blood. Hours later, I began to make out the memory; it was one of the legends of the god. On the first day of creation, foreseeing that at the end of time many disasters and calamities would befall, the god had written a magical phrase, capable of warding off those evils. He wrote it in such a way that it would pass down to the farthest generations, and remain untouched by fate. No one knows where he wrote it, or with what letters, but we do know that it endures, a secret text, and that one of the elect shall read it. I reflected that we were, as always, at the end of time, and that it would be my fate, as the last priest of the god, to be afforded the privilege of intuiting those words. The fact that I was bounded within a cell did not prevent me from harboring that hope; I might have seen Qaholom's inscription thousands of times, and need only to understand it."],[80,340,"Thousands of times, and in both of the languages that are a part of me, my lips have pronounced, and shall go on pronouncing, the Paternoster, yet I only partly understand it. This morning\u2014July 1, 1969\u2014I want to attempt a prayer that is personal, not inherited. I know that such an undertaking demands a sincerity that is more than human. First of all, obviously I am barred from asking for anything. Asking that my eyes not be filled with night would be madness; I know of thousands of people who can see, yet who are not particularly happy, just, or wise. Time's march is a web of causes and effects, and asking for any gift of mercy, however tiny it might be, is to ask that a link be broken in that web of iron, ask that it be already broken. No one deserves such a miracle. Nor can I plead that my trespasses be forgiven; forgiveness is the act of another, and only I myself can save me. Forgiveness purifies the offended party, not the offender, who is virtually untouched by it. The freeness of my \"free will\" is perhaps illusory, but I am able to give, or to dream that I give. I can give courage, which I do not possess; I can give hope, which does not lie within me; I can teach a willingness to learn that which I hardly know myself, or merely glimpse. I want to be remembered less as poet than as friend; I want someone to repeat a cadence from Dunbar or Frost or that man who, at midnight, looked upon that tree that bleeds, the Cross, and to reflect that he heard those words for the first time from my lips. None of the rest matters to me; I hope that oblivion will not long delay. The designs of the universe are unknown to us, but we do know that to think with lucidity and to act with fairness is to aid those designs (which shall never be revealed to us)."],[110,54,"\"I am ready to walk that Path with you, even if we must walk for many years. Allow me to cross the desert. Allow me to glimpse, even from afar, the promised land, though the stars prevent me from setting foot upon it. All I ask is a proof before we begin the journey.\""]],[[42,158,"One day or one night\u2014between my days and nights, what difference can there be?\u2014I dreamed that there was a grain of sand on the floor of my cell. Unconcerned, I went back to sleep; I dreamed that I woke up and there were two grains of sand. Again I slept; I dreamed that now there were three. Thus the grains of sand multiplied, little by little, until they filled the cell and I was dying beneath that hemisphere of sand. I realized that I was dreaming; with a vast effort I woke myself. But waking up was useless\u2014I was suffocated by the countless sand. Someone said to me: You have wakened not out of sleep, but into a prior dream, and that dream lies within another, and so on, to infinity, which is the number of the grains of sand. The path that you are to take is endless, and you will die before you have truly awakened."],[59,41,"\"Maybe I'm not cut out to be dead, but this place and this conversation seem like a dream to me, and not a dream that /am dreaming, either. More like a dream dreamed by somebody else, somebody that's not born yet.\""],[94,67,"\"If this morning and this encounter are dreams,\" I replied, \"then each of us does have to think that he alone is the dreamer. Perhaps our dream will end, perhaps it won't. Meanwhile, our clear obligation is to accept the dream, as we have accepted the universe and our having been brought into it and the fact that we see with our eyes and that we breathe.\""]],[[42,40,"Little by little, a man comes to resemble the shape of his destiny; a man is, in the long run, his circumstances. More than a decipherer or an avenger, more than a priest of the god, I was a prisoner."],[86,46,"Maneco Uriarte leaned down to the dead man and begged him to forgive him. He was undisguisedly sobbing. The act he had just committed overwhelmed and terrified him. I now know that he regretted less having committed a crime than having committed an act of senselessness."],[91,36,"After all, when one confesses to an act, one ceases to be an actor in it and becomes its witness, becomes a man that observes and narrates it and no longer the man that performed it."]],[[43,113,"\"That version works just as well,\" Unwin agreed. \"What's important is the correspondence between the monstrous house and the monstrous creature that lives inside it. The Minotaur more than justifies the existence of the labyrinth\u2014but no one can say the same for a threat dreamed in a dream. Once one seizes upon the image of the Minotaur (an image that's unavoidable when there's a labyrinth in the case) the problem is all but solved. I do have to confess, however, that I didn't see that that ancient image was the key to it, which is why it was necessary for your story to furnish me with a better, a more exact, symbol\u2014the spiderweb.\""],[97,129,"That night I couldn't sleep. Toward sunrise I dreamed of an engraving in the style of Piranesi, one I'd never seen before or perhaps had seen and forgotten\u2014an engraving of a kind of labyrinth. It was a stone amphitheater with a border of cypresses, but its walls stood taller than the tops of the trees. There were no doors or windows, but it was pierced by an infinite series of narrow vertical slits. I was using a magnifying glass to try to find the Minotaur. At last I saw it. It was the monster of a monster; it looked less like a bull than like a buffalo, and its human body was lying on the ground. It seemed to be asleep, and dreaming\u2014but dreaming of what, or of whom?"],[109,113,"It may be that I have tried to forget the rest of that day, which was the first of a misfortunate series that continues even until now. Whether I tried to forget the day or not, I do not remember it. Toward evening, I began to think back on the night before, which had not been a particularly happy one, with a sort of nostalgia; at least it, like so many others, had been filled with my obsession with the tiger. I tried to find solace in that image once charged with power, now trivial. The blue tiger seemed no less innocuous than the Roman's black swan, which was discovered subsequently in Australia."]],[[45,208,"Preceded by the woman, the man walked through the long entryway and on through the first patio; the room he'd reserved was, as good luck would have it, off the second patio, in the rear. There was a bed of ironwork that art had distorted into fantastic curves suggesting vines and branches; there were also a tall pine chifforobe, a night table, a bookcase with books on the bottommost shelf, two mismatched chairs, and a washstand with its bowl, pitcher, and soap dish and a carafe of cloudy glass. A crucifix and a map of Buenos Aires province adorned the walls; the wallpaper was crimson, with a pattern of large peacocks, tails outspread. The room's only door opened onto the patio. The chairs had to be rearranged to make room for the trunk. The tenant gave his nod to everything; when the woman asked him what his name was, he said Villari\u2014not as a secret act of defiance, not to mitigate a humiliation that quite honestly he didn't feel, but rather be-cause that name haunted him, he couldn't come up with another one. Certainly he was not seduced by the literary error of imagining that adopting the name of his enemy would be the astute thing to do."],[86,115,"A big house that one has never been in before, its rooms in darkness (there was light only in the dining room), means more to a boy than an un-explored country to a traveler. Step by step I explored the house; I recall a billiard room, a conservatory with glass panes of rectangles and lozenges, a pair of rocking chairs, and a window from which there was a glimpse of a gazebo. In the dimness, I became lost; the owner of the house\u2014whose name, after all these years, might have been Acevedo or Acebal\u2014finally found me. Out of kindness, or, being a collector, out of vanity, he led me to a sort of museum case."],[99,109,"The front door was open a bit, and I could see a crack of light. Off the back of the vestibule there was a long room with plank benches all along the walls and between one bench and another all these dark doorways that led who knew where. An ugly little yellow dog scurried out yapping to make us feel welcome. There were quite a few people; half a dozen women wearing flowered housecoats were wandering around. A respectable-looking woman, dressed in black from head to toe, looked to me to be the owner of the house. Rufino walked up and said hello to her, then gestured toward me."],[108,89,"I went into the vestibule, whose pale mirrors echoed back the plants of the salon. Strangely, the owner did not recognize me; he turned the guest register around for me to sign. I picked up the pen chained to the register stand, dipped it in the brass inkwell, and then, as I leaned over the open book, there occurred the first of the many surprises the night would have in store for me\u2014my name, Jorge Luis Borges, had already been written there, and the ink was not yet dry."]],[[45,172,"The peacocks on the crimson wallpaper seemed the perfect thing for feeding persistent nightmares, but Sr. Villari never dreamed of a monstrous gazebo of living birds all intertangled. In the early-morning hours he would dream a dream of unvarying backdrop but varying details. Villari and two other men would come into a room with revolvers drawn, or he would be jumped by them as he came out of the motion-picture theater, or they\u2014all three of them at once\u2014would be the stranger that had shoved him, or they would wait for him sadfaced out in the courtyard and pretend not to know him. At the end of the dream, he would take the revolver out of the drawer in the nightstand that stood beside the bed (and there was a gun in that drawer) and fire it at the men. The noise of the gun would wake him, but it was always a dream\u2014and in another dream the attack would occur again and in another dream he would have to kill them again."],[64,136,"Also in this land have generations known those common yet somehow eternal vicissitudes that are the stuff of art. These things are now as though they had never been, but in a hotel room in eighteen-hundred sixty-something a man dreamed of a knife fight. A gaucho lifts a black man off the ground with the thrust of his knife, drops him like a bag of bones, watches him writhe in pain and die, squats down to wipe off his knife, unties his horse's bridle and swings up into the saddle slowly, so no one will think he's running away from what he's done. This thing that was once, returns again, infinitely; the visible armies have gone and what is left is a common sort of knife fight; one man's dream is part of all men's memory."],[86,149,"Nine or ten men, all of them now dead, saw what my eyes saw\u2014the long thrust at the body and the body sprawled beneath the sky\u2014but what they saw was the end of another, older story. Maneco U\u00f1arte did not kill Duncan; it was the weapons, not the men, that fought. They had lain sleeping, side by side, in a cabinet, until hands awoke them. Perhaps they stirred when they awoke; perhaps that was why Uriarte's hand shook, and Duncan's as well. The two knew how to fight\u2014the knives, I mean, not the men, who were merely their instruments\u2014 and they fought well that night. They had sought each other for a long time, down the long roads of the province, and at last they had found each other; by that time their gauchos were dust. In the blades of those knives there slept, and lurked, a human grudge."],[87,163,"One night during this time, I had a dream that turned into a nightmare. It was a dream about my uncle Juan. I'd never known him, but in my dream he was a strong, muscular man with Indian features and a sparse mustache and long flowing hair. We were riding toward the south, through big quarries and stands of underbrush, but those quarries and stands of underbrush were also Calle Thames. In my dream, the sun was high in the sky. Uncle Juan was dressed all in black. He stopped in a narrow pass, near some sort of scaffolding. He had his hand under his coat, over his heart\u2014not like a man who's about to draw his weapon, but like one who's trying to hide it. He said to me, in a voice filled with sadness, \"I've changed a great deal.\" Then he slowly pulled out his hand, and what I saw was a vulture's claw. I woke up screaming in the dark."]],[[45,157,"One murky morning in July, the presence of strange people (not the sound of the door when they opened it) woke him. Tall in the shadowy dimness of the room, oddly simplified by the dimness (in the frightening dreams, they had always been brighter), motionless, patient, and watching, their eyes lowered as though the weight of their weapons made them stoopshouldered, Alejandro Villari and a stranger had at last caught up with him. He gestured at them to wait, and he turned over and faced the wall, as though going back to sleep. Did he do that to awaken the pity of the men that killed him, or because it's easier to endure a terrifying event than to imagine it, wait for it endlessly\u2014 or (and this is perhaps the most likely possibility) so that his murderers would become a dream, as they had already been so many times, in that same place, at that same hour?"],[70,83,"The place was the College of Philosophy and Letters; the hour, nightfall. Everything (as is often the case in dreams) was slightly different; a slight magnification altered things. We chose authorities; I would speak with Pedro Henriquez Urefta, who in waking life had died many years before. Suddenly, we were dumbfounded by a great noise of demonstrators or street musicians. From the Underworld, we heard the cries of humans and animals. A voice cried: Here they come! and then: The gods! the gods!"],[84,307,"Beginning early Friday morning and all throughout that day, I was filled with a sense of relief that the day had come at last, and of remorse at feeling no remorse whatever. The hours seemed endless. I barely touched my food. At ten that night we began gathering, less than a block from the factory. There was one of us that didn't come; don Eliseo said there was always one washout. It occurred to me that the blame for what was to happen would fall on the absent man. It was about to rain. I was afraid that one of the others might stay behind with me, but I was left by myself at one of the back doors. Pretty soon the police came, an officer and several patrolmen. They came on foot, for stealth; they had left their horses in a field. Ferrari had forced the factory door, so the police were able to slip inside without a sound. Then I was stunned to hear four shots. There inside, in the darkness, I thought, they were killing each other. Then I saw the police come out with the men in handcuffs. Then two more policemen emerged, dragging the bodies of Francisco Ferrari and don Eliseo Amaro, who'd been shot at point-blank range. In their report the police said the robbers had failed to halt when they were ordered, and that Ferrari and don Eliseo had fired the first shots. I knew that was a lie, because I had never seen either of them with a revolver. The police had taken advantage of the occasion to settle an old score. Days later, I was told that Ferrari tried to get away, but one shot was all it took. The newspapers, of course, made him the hero that perhaps he never was, but that I had dreamed of."],[87,194,"She didn't say a word to her sister, who would never have allowed her to lower herself that way. I'd never been in Barracas; to my eyes there were more people, more traffic, and fewer vacant lots than where we lived. When we came to a certain corner, we saw policemen and a crowd in front of the number we were looking for. One man who lived there on the street was going from group to group, telling the story of how he'd been awakened at three in the morning by banging noises; he'd heard the door open and somebody step inside. Nobody had ever closed the door\u2014at dawn Luchessi was found lying in the entryway, half dressed. He'd been stabbed repeatedly. He had lived alone; the police never found the culprit. Nothing had been stolen. Someone recalled that recently the deceased man had been losing his eyesight. \"His time had come,\" another person said in a voice of authority. That verdict, and the tone with which it was delivered, impressed me; as the years have gone by I've noticed that whenever someone dies, there's always some sententious soul who has the same revelation."]],[[46,367,"Nicholson he meant, you see. \"The past lives on in memory; surely I shall be able to recover what in that time took place. Allah had permitted, in His wrath, that mankind grow corrupted; filled with curses were men's mouths, and with falsehoods and deception. And yet not all men were perverse, so that when it was proclaimed that the queen was going to send a man to enforce the laws of England in this land, the least evil of men were glad, because they felt that law is better than disorder. The Christian came, but no time did it take him to prevaricate and oppress, to find extenuation for abominable crimes, and to sell his verdicts. At first, we did not blame him; none of us were familiar with the English justice he administered, and for all we knew, this judge's seeming abuses were inspired by valid, though arcane, reasons. Surely all things have justification in his book, we tried to think, but his similarity to the other evil judges of the world was too clear, and at last we had to admit that he was simply an evil man. He soon became a tyrant, and my poor people (in order to avenge themselves for the mistaken hope that once they had reposed in him) came to entertain the idea of kidnapping him and putting him to trial. Talking was not sufficient; from fine words, it was necessary that we move onward to acts. No one, perhaps, with the exception of the simplest of mind or the youngest of years, believed that such a terrible purpose would ever be fulfilled, but thousands of Sikhs and Muslims kept their word, and one day, incredulous, they did what each of them had thought impossible. They kidnapped the judge, and for a prison they put him in a farmhouse in the distant outskirts of the town. Then they consulted with the subjects who had been aggrieved by him, or in some cases with the subjects' orphans and widows, for the executioner's sword had not rested during those years. At last\u2014and this was perhaps the most difficult thing of all\u2014they sought for and appointed a judge to judge the judge.\""],[96,123,"\"It has taken me four years to grasp what I am about to tell you. The task we have undertaken is so vast that it embraces\u2014as I now recognize\u2014 the entire world. It is not a handful of prattling men and women muddying issues in the barracks of some remote cattle ranch. The Congress of the World began the instant the world itself began, and it will go on when we are dust. There is no place it is not. The Congress is the books we have burned. It is the Caledonians who defeated the Cassars' legions. It is Job on the dunghill and Christ on the Cross. The Congress is even that worthless young man who is squandering my fortune on whores.\""],[102,88,"\"All this was no sooner read than forgotten, for within a few hours it would be blotted out by new trivialities. Of all functions, that of the politician was without doubt the most public. An ambassador or a minister was a sort of cripple who had to be transported in long, noisy vehicles surrounded by motorcyclists and grenadiers and stalked by eager photographers. One would have thought their feet had been cut off, my mother used to say. Images and the printed word were more real than things."]],[[47,318,"That same sweltering morning that Beatriz Viter bodied, after an imperious confrontation with her illness in which she had never for an instant stooped to either sentimentality or fear, I noticed that a new advertisement for some cigarettes or other (blondes, I believe they were) had been posted on the iron billboards of the Plaza Constituci\u00f3n; the fact deeply grieved me, for I realized that the vast unceasing universe was already growing away from her, and that this change was but the first in an infinite series. The universe may change, but I shall not, thought I with melancholy vanity. I knew that more than once my futile devotion had exasperated her; now that she was dead, I could consecrate myself to her memory\u2014 without hope, but also without humiliation. I reflected that April 30 was her birthday; stopping by her house on Calle Garay that day to pay my respects to her father and her first cousin Carlos Argentino Daneri was an irreproachable, perhaps essential act of courtesy. Once again I would wait in the half-light of the little parlor crowded with furniture and draperies and bric-a-brac, once again I would study the details of the many photographs and portraits of her: Beatriz Viterbo, in profile, in color; Beatriz in a mask at the Carnival of 1921; Beatriz' first communion; Beatriz on the day of her wedding to Roberto Alessandri; Beatriz shortly after the divorce, lunching at the Jockey Club; Beatriz in Quilines with Delia San Marco Porcel and Carlos Argentino; Beatriz with the Pekinese that had been a gift from Villegas Haedo; Beatriz in full-front and in three-quarters view, smiling, her hand on her chin.... I would not be obliged, as I had been on occasions before, to justify my presence with modest offerings of books\u2014books whose pages I learned at last to cut, so as not to find, months later, that they were still intact."],[88,435,"So long as she was able, she spoke not of Spaniards but of Goths, as her parents had. In 1910 she refused to believe that the Infanta, who after all was a princess, spoke, against all one's expectations, like a common Galician and not like an Argentine lady. It was at her son-inlaw's wake that she was told this startling news by a rich relative (who had never set foot in the house though the family eagerly looked for mention of her in the social columns of the newspaper). The names the elderly lady called things by were always out of date: she spoke of the Calle de las Artes, the Calle del Temple, the Calle Buen Orden, the Calle de la Piedad, the Dos Calles Largas, the Plaza del Parque, and the Plaza de los Portones. What were affectations in other members of the family (who would say Easterners instead of Uruguayans for instance) came naturally to the widow J\u00e1uregui. She never left her house; she may never have suspected that with the years Buenos Aires had grown and changed. One's first memories are the most vivid ones; the city that the elderly lady saw in her mind's eye on the other side of the front door was no doubt a much earlier one than the city that existed at the time they'd had to move toward the outskirts; the oxen of the oxcarts must still have stood at rest in Plaza del Once, and dead violets still have perfumed the country houses of Barracas. All I dream about now is dead men was one of the last things she was heard to say. She was never stupid, but she had never, so far as I know, enjoyed the pleasures of the intellect; there remained to her the pleasures of memory, and then, forgetfulness. She was always generous. I recall her tranquil blue eyes and her smile. Who can say what tumult of passions (now lost but erstwhile burning brightly) there had been in that old woman who had once been so charming and well favored. Sensitive to plants, whose modest, silent life was so much like her own, she raised begonias in her room and touched the leaves she could not see. Until 1929, when she fell into her reverie, she would tell stories of historical events, but always with the same words and in the same order, as though they were the Paternoster, and I suspect that after a while they no longer corresponded to images in her mind. She had no marked preferences in food. She was, in a word, happy."],[89,157,"On February 2, 1964, Clara Figueroa suffered a stroke and died. The newspapers printed long obituaries of the sort that are still de rigueur in Argentina, wherein the woman is a representative of the species, not an individual. With the exception of an occasional brief mention of her enthusiasm for art and her refined taste, it was her faith, her goodness, her constant and virtually anonymous philanthropy, her patrician lineage (her father, General Glencairn, had fought in the Brazil campaign), and her distinguished place in the highest social circles that were praised. Marta realized that her own life now had no meaning. She had never felt so useless. She recalled the first tentative paintings she had done, now so long ago, and she exhibited in the National Gallery a somber portrait of Clara in the style of the English masters they had both so much admired. Someone said it was her best work. She never painted again."]],[[47,118,"The third\u2014baroque? decadent? the purified and fanatical cult of form?\u2014 consists of twinned hemistichs; the fourth, unabashedly bilingual, assures me the unconditional support of every spirit able to feel the ample attractions of playfulness. I shall say nothing of the unusual rhyme, nor of the erudition that allows me\u2014 without pedantry or boorishness!\u2014to include within the space of four lines three erudite allusions spanning thirty centuries of dense literature: first the Odyssey, second the Works and Days, and third that immortal bagatelle that regales us with the diversions of the Savoyard's plume\u2014 Once again, I show my awareness that truly modern art demands the balm of laughter, of scherzo. There is no doubt about it\u2014 Goldoni was right!\""],[76,145,"In these pages the forms of prose and verse coexist, I believe, without discord. I might cite illustrious antecedents\u2014Boethius' Consolation of Philosophy, Chaucer's Tales, the Book of the Thousand Nights and a Night, I prefer to say that those divergences look to me to be accidental\u2014I hope this book will be read as a book of verse. A volume, perse, is not an\u0153sthetic moment, it is one physical object among many; the aesthetic moment can only occur when the volume is written or read. One often hears that free verse is simply a typographical sham; I think there's a basic error in that statement. Beyond the rhythm of a line of verse, its typographical arrangement serves to tell the reader that it's poetic emotion, not information or rationality, that he or she should expect. I once yearned after the long breath line of the Psalms."],[82,436,"I have tried (I am not sure how successfully) to write plain tales. I dare not say they are simple; there is not a simple page, a simple word, on earth\u2014for all pages, all words, predicate the universe, whose most notorious attribute is its complexity. But I do wish to make clear that I am not, nor have I ever been, what used to be called a fabulist or spinner of parables, what these days is called an auteur engag\u00e9. I do not aspire to be \u00c6sop. My tales, like those of the Thousand and One Nights, are intended not to persuade readers, but to entertain and touch them. This intention does not mean that I shut myself, as Solomon's image would have it, into an ivory tower. My convictions with respect to political matters are well known; I have joined the Conservative Party (which act is a form of skepticism), and no one has ever called me a Communist, a nationalist, an anti-Semite, or a supporter of Hormiga Negra or of Rosas. I believe that in time we will have reached the point where we will deserve to be free of government. I have never hidden my opinions, even through the difficult years, but I have never allowed them to intrude upon my literary production, either, save that one time when I praised the Six-Day War. The craft is mysterious; our opinions are ephemeral, and I prefer Plato's theory of the Muse to that of Poe, who argued, or pretended to argue, that the writing of a poem is an operation of the intelligence. (I never cease to be amazed that the Classics professed a Romantic theory while a Romantic poet espoused a Classical one.) Aside from the text that gives its name to this book (and whose paternity, obviously, can be traced to Lemuel Gulliver's last voyage), my stories are \"realistic,\" to use a term that is fashionable these days. They observe, I believe, all the conventions of the genre (a genre no less convention-ridden than all the others, and one we will soon enough grow tired of, if we are not already). They abound in the circumstantial details that writers are required to invent\u2014details that we can find such splendid examples of in the tenthcentury Anglo-Saxon ballad of the Battle of Maldon and the Icelandic sagas that came later. Two of the stories (I will not say which ones) can be opened with the same fantastic key. The curious reader will perceive certain secret affinities among the tales. A mere handful of arguments have haunted me all these years; I am decidedly monotonous."],[100,122,"\"I accept this labor. It is another victory. You have given to each word its true meaning, to each noun the epithet bestowed upon it by the first poets. In all the work there is not an image which the classics did not employ. War is 'the fair cloth wov'n of men' and blood is 'sworddrink.' The sea has its god and the clouds foretell the future. You have marshaled rhyme, alliteration, assonance, scansion, the artifices of erudite rhetoric, the wise alternation of meters, and all with greatest skillfulness. If the whole of the literature of Ireland should\u2014 omen absit\u2014 be lost, well might it all be reconstructed, without loss, from your classic ode. Thirty scribes shall transcribe it, twelve times each.\""],[108,31,"\"Not to mention false recollections, the doubleness of symbols, the long catalogs, the skilled handling of prosaic reality, the imperfect symmetries that critics so jubilantly discover, the not always apocryphal quotations.\""],[111,149,"I was naive enough to have contemplated a biography, just as Thorpe had. I soon discovered, however, that that literary genre requires a talent for writing that I do not possess. I do not know how to tell a story. I do not know how to tell my own story, which is a great deal more extraordinary than Shakespeare's. Besides, such a book would be pointless. Chance, or fate, dealt Shakespeare those trivial terrible things that all men know; it was his gift to be able to transmute them into fables, into characters that were much more alive than the gray man who dreamed them, into verses which will never be abandoned, into verbal music. What purpose would it serve to unravel that wondrous fabric, besiege and mine the tower, reduce to the modest proportions of a documentary biography or a realistic novel the sound and fury of Macbeth?"]],[[47,57,"It was only out of concern that he might create an army of implacable and powerful enemies, he told me, that he did not fearlessly publish the poem. Hear this. To the right hand of the routine signpost (Coming\u2014what need is there to say?\u2014from northnorthwest) Yawns a bored skeleton\u2014Color? Sky-pearly.\u2014 Outside the sheepfold that suggests an ossuary."],[100,147,"The stars of the sky once more journeyed their bright course. Once more sang the nightingale in the Saxon forests, and the poet returned with his scroll\u2014shorter this time than before. He did not recite it from memory; he read it, visibly unsure, omitting certain passages, as though he himself did not entirely understand them, or did not wish to profane them. The verses were strange. They were not a description of the battle, they were the battle. In the warlike chaos of the lines there stirred the God Who Is Three Yet One, the pagan noumena of Ireland, and those who would war, centuries after, at the beginning of the Elder Edda. The poem's form was no less strange. A singular noun might govern a plural verb. The prepositions were foreign to common usage. Harshness vied with sweetness. The metaphors were arbitrary, or so they seemed."],[103,120,"He missed the snow, but I've noticed that northerners are taught to take measures against the cold the way we are against the heat. The hazy image that remains to me is that of a man on the tall side, with gray hair, less spry than strong. My recollection of his colleague Herbert Locke is clearer; Locke gave me a copy of his book Toward a History of the Kenning, which declares that the Saxons soon put aside those somewhat mechanical metaphors they used (the sea as \"whale-road,\" the eagle as \"battlefalcon\"), while the Scandinavian poets were combining and intermingling them al-most to the point of inextricability. I mention Herbert Locke because he is an integral part of my story."]],[[47,148,"Two Sundays later, Daneri telephoned me for what I believe was the first time in his or my life. He suggested that we meet at four, \"to imbibe the milk of the gods together in the nearby salon-bar that my estimable land-lords, Messrs. Zunino and Zungri, have had the rare commercial foresight to open on the corner. It is a caf\u00e9 you will do well to acquaint yourself with.\" I agreed, with more resignation than enthusiasm, to meet him. It was hard for us to find a table; the relentlessly modern \"salon-bar\" was only slightly less horrendous than I had expected; at neighboring tables, the excited clientele discussed the sums invested by Zunino and Zungri without a second's haggling. Carlos Argentino pretended to be amazed at some innovation in the establishment's lighting (an innovation he'd no doubt been apprised of beforehand) and then said to me somewhat severely:"],[91,104,"Zimmermann had no doubt come to Buenos Aires in order to meet the minister; the minister's personal suggestion, made to me through the intermediary of a secretary, was that, in order to forestall the unpleasant spectacle of our country's two universities disputing for the one prize, it be myself who spoke to Zimmermann, to apprise him of where the matter stood. Naturally, I agreed. When I returned home, I was informed that Dr. Zimmermann had phoned to tell me he was coming that evening at six. I live, as most people know, on Calle Chile. It was exactly six o'clock when the doorbell rang."],[96,146,"I cannot put my finger on the first time I heard someone mention the Congress. It may have been that evening when the paymaster paid me my monthly salary and to celebrate that proof that I was now a part of Buenos Aires I invited Kraal to have dinner with me. Kraal said he was sorry, he couldn't that night, he couldn't miss the Congress. I immediately realized that he was not referring to that pompous, dome-capped building at the far end of an avenue on which so many Spaniards chose to live, but rather to something more secret, and more important. People talked about the Congress\u2014some with open contempt, others with lowered voices, still others with alarm or curiosity; all, I believe, in ignorance. A few Saturdays later, Kraal invited me to go with him. He had seen, he said, to all the necessary arrangements."]],[[47,61,"On Calle Garay, the maid asked me to be so kind as to wait\u2014Sr. Daneri was in the cellar, as he always was, developing photographs. Beside the flowerless vase atop the useless piano smiled the great faded photograph of Beatriz, not so much anachronistic as outside time. No one could see us; in a desperation of tenderness I approached the portrait."],[54,273,"In 1927, I met a grave young woman, first by telephone (because Julia began as a voice without a name or face) and then on a corner at nightfall. Her eyes were alarmingly large, her hair jet black and straight, her figure severe. She was the granddaughter and greatgranddaughter of Federalists, as I was the grandson and great-grandson of Unitarians, but that ancient discord between our lineages was, for us, a bond, a fuller possession of our homeland. She lived with her family in a big run-down high-ceiling'd house, in the resentment and savorlessness of genteel poverty. In the afternoons\u2014 only very rarely at night\u2014we would go out walking through her neighbor-hood, which was Balvanera. We would stroll along beside the high blank wall of the railway yard; once we walked down Sarmien to all the way to the cleared grounds of the Parque Centenario. Between us there was neither love itself nor the fiction of love; I sensed in her an intensity that was utterly unlike the intensity of eroticism, and I feared it. In order to forge an intimacy with women, one often tells them about true or apocryphal things that happened in one's youth; I must have told her at some point about my horror of mirrors, and so in 1928 I must have planted the hallucination that was to flower in 1931. Now I have just learned that she has gone insane, and that in her room all the mirrors are covered, because she sees my reflection in them\u2014 usurping her own\u2014and she trembles and cannot speak, and says that I am magically following her, watching her, stalking her."],[87,68,"There was my aunt, sitting with her hands folded in her lap; I sensed that she wasn't even thinking. Her room smelled musty. In one corner stood the iron bed, with a rosary hanging on one of the bedposts; in another, the wooden wardrobe for her clothes. On one of the whitewashed walls there was a lithograph of the Virgen del Carmen. A candlestick sat on the nightstand."],[95,120,"As I climbed the stairs, I noticed that the walls were papered a deep crimson, in the style of William Morris, with intertwined birds and fruit. Ulrikke entered the room first. The dark chamber had a low, peaked ceiling. The expected bed was duplicated in a vague glass, and its burnished mahogany reminded me of the mirror of the Scriptures. Ulrikke had already undressed. She called me by my true name, Javier. I sensed that the snow was coming down harder. Now there was no more furniture, no more mirrors. There was no sword between us. Like sand, time sifted away. Ancient in the dimness flowed love, and for the first and last time, I possessed the image of Ulrikke."]],[[47,183,"How can one transmit to others the infinite Aleph, which my timorous memory can scarcely contain? In a similar situation, mystics have employed a wealth of emblems: to signify the deity, a Persian mystic speaks of a bird that some-how is all birds; Alain de Lille speaks of a sphere whose center is everywhere and circumference nowhere; Ezekiel, of an angel with four faces, facing east and west, north and south at once. (It is not for nothing that I call to mind these inconceivable analogies; they bear a relation to the Aleph.) Perhaps the gods would not deny me the discovery of an equivalent image, but then this report would be polluted with literature, with falseness. And besides, the central problem\u2014the enumeration, even partial enumeration, of infinity\u2014is irresolvable. In that unbounded moment, I saw millions of delightful and horrible acts; none amazed me so much as the fact that all occupied the same point, without superposition and without transparency. What my eyes saw was simultaneous; what I shall write is successive, because language is successive. Something of it, though, I will capture."],[65,52,"Cross, rope, and arrow: ancient implements of mankind, today reduced, or elevated, to symbols. I do not know why I marvel at them so, when there is nothing on earth that forgetfulness does not fade, memory alter, and when no one knows what sort of image the future may translate it into."],[93,414,"They count on their fingers thus: one, two, three, four, many; infinity begins at the thumb. The same phenomenon may be seen, I am told, among the tribes that harass the region of Buenos-Ayres with their raids and pillaging. In spite of the fact that four is the largest number they possess, the Yahoos are not cheated by the Arabs who traffic with them, for in their exchanges all the goods are divided into lots of one, two, three, or four items, which each person keeps beside himself. The operation is slow, yet it allows no room for error or trickery. Of all the nation of the Yahoos, the witch doctors are the only persons who have truly aroused my interest. The common people say they have the power to transform anyone they please into an ant or a tortoise; one individual who noted my incredulity at this report showed me an anthill, as though that were proof. The Yahoos have no memory, or virtually none; they talk about the damage caused by an invasion of leopards, but they are unsure whether they themselves saw the leopards or whether it was their parents, or whether they might be recounting a dream. The witch doctors do possess some memory, though to only a very small degree; in the afternoon they can recall things that happened that morning or even on the previous evening. They also possess the ability to see the future; they quite calmly and assuredly predict what will happen in ten or fifteen minutes. They may say, for example: A fly will light on the back of my neck, or It won't be long before we hear a bird start singing. I have witnessed this curious gift hundreds of times, and I have thought about it a great deal. We know that past, present, and future are already, in every smallest detail, in the prophetic memory of God, in His eternity; it is curious, then, that men may look indefinitely into the past but not an instant into the future. If I am able to recall as though it were yesterday that schooner that sailed into port from Norway when I was four years old, why should I be surprised that someone is able to foresee an event that is about to occur? Philosophically speaking, memory is no less marvelous than prophesying the future; tomorrow is closer to us than the crossing of the Red Sea by the Jews, which, nonetheless, we remember."]],[[59,39,"\"You are a romantic,\" he said with a sneer.\" The flattery of posterity is worth very little more than the flattery of one's contemporaries, which is not worth anything, and can be bought with a pocketful of loose change.\"'"],[77,45,"\"That's not it, sir. Now that I possess the secret, I could tell it in a hundred different and even contradictory ways. I don't know how to tell you this, but the secret is beautiful, and science, our science, seems mere frivolity to me now.\""],[109,32,"\"I do not yet know what your gift to me is, but mine to you is an awe-some one. You may keep your days and nights, and keep wisdom, habits, the world.\""],[110,35,"\"If I did what you ask, you would say that it was an appearance cast by magic upon your eyes. The miracle would not bring you the belief you seek. Put aside, then, the rose.\""],[111,52,"\"I have written a fictionalized biography,\" he then said at last, \"which garnered the contempt of critics but won some small commercial success in the United States and the colonies. I believe that's all.... I have warned you that my gift is not a sinecure. I am still waiting for your answer.\""]],[[59,51,"\"I know,\" he slowly said, \"from the impartial testimony of your peons and seconds-incommand, that you did more than one pretty turn on horseback, but back in those days, across the Americas\u2014and on horseback, too\u2014 other pretty turns were done in places named Chacabuco and Junin and Palma Redondo and Caseros.\""],[64,60,"Out of this city marched armies that seemed grand, and that in later days were grand, thanks to the magnifying effects of glory. After many years, one of the soldiers returned, and in a foreign accent told stories of what had happened to him in places called Ituzaing\u00f3 or Ayacucho. These things are now as though they had never been."],[66,44,"In gentle self-mockery, this old soldier conceived a credulous man\u2014his mind unsettled by the reading of all those wonders\u2014who took it into his head to ride out in search of adventures and enchantments in prosaic places with names such as El Toboso and Montici."]],[[59,49,"\"Stones want to go on being stones, too, forever and ever,\" Quiroga replied. \"And for centuries they are stones\u2014until they crumble into dust. When I first entered into death, I thought the way you do, but I've learned many things here since. If you notice, we're both already changing.\""],[72,184,"Beyond that, I am doomed\u2014utterly and inevitably\u2014to oblivion, and fleeting moments will be all of me that survives in that other man. Little by little, I have been turning everything over to him, though I know the perverse way he has of distorting and magnifying everything. Spinoza believed that all things wish to go on being what they are\u2014stone wishes eternally to be stone, and tiger, to be tiger. I shall endure in Borges, not in myself (if, indeed, I am anybody at all), but I recognize myself less in his books than in many others', or in the tedious strumming of a guitar. Years ago I tried to free myself from him, and I moved on from the mythologies of the slums and outskirts of the city to games with time and infinity, but those games belong to Borges now, and I shall have to think up other things. So my life is a pointcounterpoint, a kind of fugue, and a falling away\u2014and everything winds up being lost to me, and everything falls into oblivion, or into the hands of the other man."],[110,40,"\"The path is the Stone. The point of departure is the Stone. If these words are unclear to you, you have not yet begun to understand. Every step you take is the goal you seek.\" Paracelsus spoke the words slowly."],[111,31,"The wish of all things, Spinoza says, is to continue to be what they are. The stone wishes to be stone, the tiger, tiger\u2014and I wanted to be Hermann S\u00f6rgel again."]],[[64,97,"There have been two tyrannies in this land. During the first, a wagon pulled out of La Plata market; as the wagon passed through the streets, some men on the driver's seat cried out their wares, hawking white and yellow peaches; a young boy lifted the corner of the canvas that covered them and saw the heads of Unitarians, their beards bloody. The second meant, for many, prison and death; for all, it meant discomfort, endless humiliation, a taste of shamefulness in the actions of every day. These things are now as though they had never been."],[94,119,"\"As for history... There was another war, with virtually the same antagonists. France soon capitulated; England and America battled a German dictator named Hitler\u2014the cyclical Battle of Waterloo. Buenos Aires engendered another Rosas in 1946, much like our kinsman in the first one. In '55, the province of C\u00f3rdoba saved us, as Entre R\u00edos had before. Things are bad now. Russia is taking over the planet; America, hobbled by the superstition of democracy, can't make up its mind to be an empire. Our own country is more provincial with every passing day\u2014more provincial and more self-important, as though it had shut its eyes. I shouldn't be surprised if the teaching of Latin were replaced by the teaching of Guaran\u00ed.\""],[102,74,"\"By your clothing,\" he said, \"I can see that you have come from another time. The diversity of languages encouraged the diversity of nations, and even encouraged war; the earth has returned to Latin. There are those who fear that it will degenerate into French, Limousine, or Papiamento, but the danger is not imminent. And in any case, neither that which has been nor that which is to be holds any interest for me.\""]],[[77,211,"I was told about the case in Texas, but it had happened in another state. It has a single protagonist (though in every story there are thousands of protagonists, visible and invisible, alive and dead). The man's name, I believe, was Fred Murdock. He was tall, as Americans are; his hair was neither blond nor dark, his features were sharp, and he spoke very little. There was nothing singular about him, not even that feigned singularity that young men affect. He was naturally respectful, and he distrusted neither books nor the men and women who write them. He was at that age when a man doesn't yet know who he is, and so is ready to throw himself into whatever chance puts in his way\u2014Persian mysticism or the unknown origins of Hungarian, algebra or the hazards of war, Puritanism or orgy. At the university, an adviser had interested him in Amerindian languages. Certain esoteric rites still survived in certain tribes out West; one of his professors, an older man, suggested that he go live on a reservation, observe the rites, and discover the secret revealed by the medicine men to the initiates. When he came back, he would have his dissertation, and the university authorities would see that it was published."],[96,217,"This is the general history of the Congress of the World, not the history of Alexander Ferri\u2014 emphatically not my own\u2014and yet the first includes the second, as it includes all others. Beatrice was tall and slender, her features pure and her hair bright red; it might have reminded me of the devious Twirl's, but it never did. She was not yet twenty. She had left one of the northern counties to come and study literature at the university. Her origins, like mine, were humble. In the Buenos Aires of that time, being of Italian extraction was a questionable social recommendation; in London I discovered that for many people it was romantic. It took us but a few afternoons to become lovers; I asked her to marry me, but Beatrice Frost, like Nora Erfjord, was a votary of the religion of Ibsen and would not join herself to any man. From her lips came the word I dared not speak. Oh nights, oh shared warm darkness, oh love that flows in shadow like a secret river, oh that moment of joy in which two are one, oh innocence and openness of delight, oh the union into which we entered, only to lose ourselves after-ward in sleep, oh the first soft lights of day, and myself contemplating her."],[103,372,"I come now to the Icelander Eric Einarsson, perhaps the true protagonist. I never saw him. He had come to Texas in 1969, when I was in Cam-bridge, but letters from a mutual friend, Ram\u00f3n Mart\u00ednez L\u00f3pez, have left me with the conviction that I knew him intimately. I know that he is impetuous, energetic, and cold; in a land of tall men he is tall. Given his red hair, it was inevitable that students should start calling him Eric the Red. It was his view that the use of an inevitably error-ridden slang makes the foreigner an interloper, and so he never condescended to use the ubiquitous \"O.K.\" A fine scholar of English, Latin, the Scandinavian languages, and (though he wouldn't admit it) German, he easily made a way for himself in American universities. His first article was a monograph on the four articles DeQuincey had written on the influence of the Danes on the lake region of Westmoreland. This was followed by a second, on the dialect of the Yorkshire peasant. Both studies were well received, but Einarsson thought his career needed something a bit more \"astonishing.\" In 1970, Yale published his copiously annotated critical edition of the ballad of the Battle of Maldon. The scholarship of the notes was undeniable, but certain hypotheses in the introduction aroused some controversy in the virtually hermetic spheres of academe. Einarsson claimed, for example, that the style of the ballad is similar, though admittedly in a distant sort of way, to the epic fragment Finnsburh, rather than to the measured rhetoric of Beowulf, and that the poem's employment of moving circumstantial details oddly prefigures the methods that we admire, not without good reason, in the Icelandic sagas. He also proposed emendations for several readings in Elphinston's edition. In 1969 he had been given an appointment at the University of Texas. As we all know, American universities are forever sponsoring conferences of Germanists. Dr. Winthrop had chaired the previous conference, in East Lansing. The head of his department, who was preparing to go abroad on his sabbatical, asked Winthrop to suggest a person to chair the next one, in Wisconsin. There were really only two candidates to choose between\u2014 Herbert Locke and Eric Einarsson."]],[[82,102,"I have set my stories at some distance in both time and space. Imagination has more freedom to work, that way. Today, in 1970, who can recall exactly what those outskirts of Palermo or Lomas were like at the end of the nineteenth century? Incredible as it may seem, there are certain punctilious men and women who act as a sort of \"trivia police.\" They will note, for example, that Mart\u00edn Fierro would have talked about a bag of bones, not a sack, and they will criticize (perhaps unfairly, perhaps not) the golden-pink coat of a certain horse famous in our literature."],[88,57,"I think about the men killed at Cerro Alto, I think about the forgotten men of our continent and Spain who perished under the horses' hooves, and it occurs to me that the last victim of that chaos of lances in Peru was to be, more than a hundred years afterward, an elderly lady in Buenos Aires."],[89,179,"It is the sort of story that Henry James (whose writings were first revealed to me by Clara Glencairn de Figueroa, one of the two protagonists of my story) might not have scorned to use. He would have consecrated more than a hundred tender and ironic pages to it, and would have embellished them with complex and scrupulously ambiguous dialogue; he might well have added a touch of melodrama. The essence of the story would not have been altered by its new setting in London or Boston. But the events in fact took place in Buenos Aires, and there I shall leave them. I shall give just a summary of the case, since the slowness of its pace and the worldliness of the circles in which it occurred are foreign to my own literary habits. Dictating this story is for me a modest, sideline sort of adventure. I should warn the reader that the episodes of the tale are less important than the situation that led to them, and less important, too, than the characters that figure in them."],[96,92,"The exact dates are of no importance. I would remind the reader that I came here from Santa Fe, the province of my birth, in 1899. I have never gone back; I have grown accustomed to Buenos Aires (a city I am not, however, particularly fond of) like a person grown accustomed to his own body, or an old ache. I sense, though I find little interest in the fact, that my death is near; I should, therefore, hold in check my tendency to digress, and get on with telling the story."]],[[83,193,"They say (though it seems unlikely) that Eduardo, the younger of the Nelson brothers, told the story in eighteen-ninety-something at the wake for Cristian, the elder, who had died of natural causes in the district of Mor\u00f3n. What is unquestionably true is that as the cups of mate went their rounds in the course of that long night when there was nothing else to do, somebody heard it from someone and later repeated it to Santiago Dabove, from whom I first heard it. I was told the story again, years later, in Turdera, where it had actually occurred. This second, somewhat less succinct version corroborated the essential details of Santiago's, with the small divergences and variations one always expects. I commit it to writing now because I believe it affords us (though I may of course be mistaken) a brief and tragic window on the sort of men that once fought their knife fights and lived their harsh lives in the tough neighborhoods on the outskirts of Buenos Aires. I will tell the story conscientiously, though I can foresee myself yielding to the literary temptation to heighten or insert the occasional small detail."],[86,157,"In the years that followed, I thought more than once about confiding the story to a friend, but I always suspected that I derived more pleasure from keeping the secret than I would from telling it. In 1929, a casual conversation suddenly moved me to break the long silence. Jos\u00e9 Olave, the re-tired chief of police, had been telling me stories of the knife fighters that hung out in the tough neighborhoods of Retiro, down near the docks\u2014El Bajo and that area. He said men such as that were capable of anything\u2014 ambush, betrayal, trickery, the lowest and most infamous kind of villainy\u2014 in order to get the better of their opponents, and he remarked that before the Podest\u00e1s and the Gutierrezes, there'd been very little knife fighting, the handto-hand sort of thing. I told him that I'd once actually witnessed such a fight, and then I told the story of that night so many years before."],[92,371,"The incident took place on the Los Alamos ranch, south of the small town of Junin, in late March of 1928. Its protagonist was a medical student named Baltasar Espinosa. We might define him for the moment as a Buenos Aires youth much like many others, with no traits worthier of note than the gift for public speaking that had won him more than one prize at the English school in Ramos Mejia and an almost unlimited goodness. He didn't like to argue; he preferred that his interlocutor rather than he himself be right. And though he found the chance twists and turns of gambling interesting, he was a poor gambler, because he didn't like to win. He was intelligent and open to learning, but he was lazy; at thirty-three he had not yet completed the last requirements for his degree. (The work he still owed, incidentally, was for his favorite class.) His father, like all the gentlemen of his day a freethinker, had instructed Espinosa in the doctrines of Herbert Spencer, but once, before he set off on a trip to Montevideo, his mother had asked him to say the Lord's Prayer every night and make the sign of the cross, and never in all the years that followed did he break that promise. He did not lack courage; one morning, with more indifference than wrath, he had traded two or three blows with some of his classmates that were trying to force him to join a strike at the university. He abounded in debatable habits and opinions, out of a spirit of acquiescence: his country mattered less to him than the danger that people in other countries might think the Argentines still wore feathers; he venerated France but had contempt for the French; he had little respect for Americans but took pride in the fact that there were skyscrapers in Buenos Aires; he thought that the gauchos of the plains were better horsemen than the gauchos of the mountains. When his cousin Daniel invited him to spend the summer at Los Alamos, he immediately accepted\u2014not because he liked the country but out of a natural desire to please, and because he could find no good reason for saying no."],[96,150,"But the men that lived on that frontier did not make as great an impression on me as the complete change that had taken place in don Alejandro. In Buenos Aires he was an affable, moderate man; in La Caledonia, he was the stern patriarch of a clan, as his forebears had been. Sunday mornings he would read the Scripture to the laborers on his ranch; they understood not a word. One night, the foreman, a youngish man who had inherited the position from his father, came to tell us that a sharecropper and one of the laborers were about to have a knife fight. Don Alejandro stood up unhurriedly. He went out to the ring of men, took off the weapon he always wore, gave it to the foreman (who seemed to have turned fainthearted at all this), and stepped between the two blades. Immediately I heard his order:"]],[[83,40,"One night, coming home late from a bout of drinking, Eduardo saw Cristian's black horse tied to the post at the front of the house. Cristian was sitting waiting for him in the patio; he was wearing his best clothes."],[85,162,"There were horses tied to the hitching post, and standing out on the porch and all inside the place there were more people than a Saturday night at the whorehouse. It looked like a party committee headquarters. Don Nicol\u00e1s, who was sipping at a mate, finally called me over. As calm as you please, he told me he was going to send me out to Mor\u00f3n, where they were setting up for the elections. He told me to look up a certain Sr. Laferrer; he'd try me out, he said. The letter I was to take was written by a kid in black that wrote poems about tenement houses and riffraff\u2014or anyway, that's what I was told. I can't imagine that educated people would be much interested in that sort of thing, much less if it's told in poetry. Anyway, I thanked Paredes for the favor, and I left. The cop didn't stay so infernally glued to me on the way back."],[96,79,"The next day I came upon the library and its volumes of Carlyle, and I looked up the pages devoted to that spokesman for the human race, Anacharsis Cloots, who had brought me to that morning and that solitude. After breakfast (identical to dinner) don Alejandro showed us the site of the Congress' new headquarters. We rode out a league on horseback, across the open plains. Irala, who sat his horse more than a bit nervously, had a spill."]],[[84,243,"The picture of the city that we carry in our mind is always slightly out of date. The caf\u00e9 has degenerated into a bar; the vestibule that allowed us a glimpse of patio and grapevine is now a blurred hallway with an elevator down at the far end. Thus, for years I thought that a certain bookstore, the Librer\u00eda Buenos Aires, would be awaiting me at a certain point along Calle Talcahuano, but then one morning I discovered that an antiques shop had taken the bookstore's place, and I was told that don Santiago Fischbein, the owner of the bookstore, had died. Fischbein had tended toward the obese; his features are not as clear in my memory as our long conversations are. Firmly yet coolly he would condemn Zionism\u2014it would make the Jew an ordinary man, he said, tied like all other men to a single tradition and a single country, and bereft of the complexities and discords that now enrich him. I recall that he once told me that a new edition of the works of Baruch Spinoza was being prepared, which would banish all that Euclidean apparatus that makes Spinoza's work so difficult to read yet at the same time imparts an illusory sense of rigor to the fantastic theory. Fischbein showed me (though he refused to sell me) a curious copy of Rosenroth's Kabbala De-nudata, but my library does contain some books by Ginsburg and Waite that bear Fischbein's seal."],[92,117,"Espinosa, who was letting his beard grow out, would stop before the mirror to look at his changed face; he smiled to think that he'd soon be boring the fellows in Buenos Aires with his stories about the Salado over-running its banks. Curiously, he missed places in the city he never went, and would never go: a street corner on Cabrera where a mailbox stood; two cement lions on a porch on Calle Jujuy a few blocks from the Plaza del Once; a tile-floored corner grocery-store-and-bar (whose location he couldn't quite remember). As for his father and his brothers, by now Daniel would have told them that he had been isolated\u2014the word was etymologically precise\u2014by the floodwaters."],[96,142,"I felt I was being imprisoned by the solitude. I feared I would never make it back to Buenos Aires. I can't say whether Fern\u00e1ndez Irala shared that fear, but we talked a great deal about Argentina and what we would do when we got back. I missed not the places one ordinarily might miss but rather the lions at the entrance to a house on Calle Jujuy near the Plaza del Once, or the light from a certain store of inexact location. I was always a good rider; I soon fell into the habit of mounting a horse and riding for great distances. I still remember that big piebald I would saddle up\u2014surely he's dead by now. I might even have ridden into Brazil one afternoon or evening, because the frontier was nothing but a line traced out by boundary stones."]],[[84,35,"One afternoon when the two of us were alone, he confided to me an episode of his life, and today I can tell it. I will change the occasional detail\u2014as is only to be expected."],[94,35,"\"My dream,\" I told him, \"has already lasted for seventy years. And besides\u2014when one wakes up, the person one meets is always oneself. That is what's happening to us now, except that we are two."],[108,35,"\"Yes,\" he replied. \"I feel a sort of sweetness and relief I\u2019ve never felt before. I can't describe it; all words require a shared experience. Why do you seem so annoyed at what I'm saying?\""]],[[84,34,"I didn't go to the corner bar that night. I wish I'd never gone. But little by little I became convinced that the invitation was an order. One Saturday after dinner, I went in."],[95,83,"It would be easy for me to say that I saw her for the first time beside the Five Sisters at York Minster, those stained glass panes devoid of figural representation that Cromwell's iconoclasts left untouched, but the fact is that we met in the dayroom of the Northern Inn, which lies outside the walls. There were but a few of us in the room, and she had her back to me. Some-one offered her a glass of sherry and she refused it."],[97,99,"As I turned the corner, Daniel Iberra approached me. We knew each other the way people in small towns do. He suggested we walk back together. I've never held any brief for hellions and that lot, and I could foresee a sordid string of more or less violent and more or less apocryphal bar stories, but I resigned myself and said I'd walk with him. It was almost dark. When he saw the Red House up on its hill a few blocks away, Iberra turned down another street. I asked him why. His answer was not what I'd expected."]],[[84,76,"Ferrari was presiding over one of the tables. I knew the others' faces; there were probably seven, all told. Ferrari was the oldest one there, except for one old man of few words, and weary ones, whose name is the only one that from my memory has not faded: don El\u00edseo Amaro. A knife scar crossed his face, which was very broad and slack. I learned sometime later that he'd once been in prison for something...."],[86,84,"I am not certain who opened the vitrine. Maneco Uriarte selected the longest and showiest knife, the one with the U-shaped cross guard; Duncan, almost as though any one of them would serve as well as any other, chose a wood-handled knife with the figure of a little tree on the blade. Someone said it was like Maneco to choose a sword. No one was surprised that Maneco's hand should be shaking at such a moment; everyone was surprised to see that Duncan's was."],[96,181,"It was somewhere between nine and ten at night. On the trolley, Kraal told me that the preliminary meetings took place on Saturday and that don Alejandro Glencoe, perhaps inspired by my name, had already given leave f
