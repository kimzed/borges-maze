 up to that point, slapped me on the back."]],[[9,94,"It's hard to believe, but the story of that night\u2014a night as strange as any I've ever lived through\u2014began with an insolent red-wheeled hack crammed with men, banging and rattling along those streets of hard-packed clay, past brick kilns and vacant lots. There was two men in black, strumming guitars and lost in their own thoughts, and the man on the driver's seat using his whip on any loose dogs that took a mind to mess with the piebald in the traces, and one fellow wrapped tight in a poncho riding in the middle"],[16,44,"The countless hairs of the body were perhaps the most difficult task. The man had dreamed a fully fleshed man\u2014a stripling\u2014but this youth did not stand up or speak, nor could it open its eyes. Night after night, the man dreamed the youth asleep."],[28,133,"Lying on his back, Recabarren opened his eyes a bit and saw the sloping ceiling of thick cane. From the other room there came the strumming of a guitar, like some inconsequential labyrinth, infinitely tangling and untangling.... Little by little, reality came back to him, the ordinary things that now would always be just these ordinary things. He looked down without pity at his great useless body, the plain wool poncho that wrapped his legs. Outside, beyond the thick bars at his window, spread the flatland and the evening; he had slept, but the sky was still filled with light. He groped with his left arm until he found the brass cowbell that hung at the foot of the cot. He shook it once or twice; outside his door, the unassuming chords continued."],[63,97,"In a stable that stands almost in the shadow of the new stone church, a man with gray eyes and gray beard, lying amid the odor of the animals, humbly tries to will himself into death, much as a man might will himself to sleep. The day, obedient to vast and secret laws, slowly shifts about and mingles the shadows in the lowly place; outside lie plowed fields, a ditch clogged with dead leaves, and the faint track of a wolf in the black clay where the line of woods begins. The man sleeps and dreams, forgotten."]],[[9,214,"One of the swinging doors hit me when it banged open. Like the damn fool I am, I reached out and swung at the fellow with my left hand while with my right I went for the knife I kept sharp and waiting in the armhole of my vest, under my left arm. If we'd've tangled, I wouldn't have lasted long. The man put out his arm\u2014and it was all he had to do\u2014and brushed me aside, like he was brushing away a fly. So there I was\u2014half sprawled there behind the door, with my hand still under my vest, holding on to my useless weapon, while he just kept walking, like nothing had happened, right on into the room. Just kept walking\u2014taller than any of the boys that were stepping aside to make way for him, and acting like we were all invisible. The first row of fellows\u2014pure Eyetalians, an' all eyes\u2014opened out like a fan, and fast. But that wa'n't about to last. In the pack just behind those first fellows, the Englishman was waiting for him, and before that Englishman could feel the stranger's hand on his shoulder, he floored him with a roundhouse he had waitin'\u2014and no sooner had he landed his punch than the party started in for serious."],[31,119,"Two or three men followed me confusedly; they were of short stature (like the others of that species), and inspired more revulsion than fear. I had to skirt a number of irregular pits that I took to be ancient quarries; misled by the City's enormous size, I had thought it was much nearer. Toward midnight, I set my foot upon the black shadow\u2014bristling with idolatrous shapes upon the yellow sand\u2014of the City's wall. My steps were halted by a kind of sacred horror. So abhorred by mankind are novelty and the desert that I was cheered to note that one of the Troglodytes had accompanied me to the last. I closed my eyes and waited, unsleeping, for the dawn."],[47,127,"I followed his ridiculous instructions; he finally left. He carefully let down the trap door; in spite of a chink of light that I began to make out later, the darkness seemed total. Suddenly I realized the danger I was in; I had allowed myself to be locked underground by a madman, after first drinking down a snifter of poison. Carlos' boasting clearly masked the deep-seated fear that I wouldn't see his \"miracle\"; in order to protect his delirium, in order to hide his madness from himself, he had to kill me. I felt a vague discomfort, which I tried to attribute to my rigidity, not to the operation of a narcotic. I closed my eyes, then opened them. It was then that I saw the Aleph."],[85,31,"I dropped the knife and walked out\u2014taking my time about it. People stepped back to make way for me. They couldn't believe their eyes. What did I care what they thought."],[97,82,"They inspired horror and revulsion. In one corner I discovered a vertical ladder that rose to the floor above. The wide iron rungs, no more than ten in all, were spaced irregularly; that ladder, which implied hands and feet, was comprehensible, and somehow it relieved me. I turned off the light and waited for a while in the darkness. I could hear not the slightest sound, but the presence of so many incomprehensible things unnerved me. At last, I made my decision."],[109,52,"I was, I believe, no less terrified than he, but I closed my eyes and picked up a handful of stones with my left hand. I tucked the pistol in my belt and dropped the stones one by one into the open palm of my right hand. Their number had grown considerably."]],[[9,193,"The place was yards and yards deep, but they herded the stranger from one end of it to the other, bumping him and shoving him and whistling and spitting. At first they'd hit him with their fists, but then when they saw that he didn't so much as put up a hand to try to block their punches, they started slapping him\u2014 sometimes with their open hands and sometimes just with the harmless fringe on their shawls, like they were makin' fun of him. And also like they were reserving him for Rosendo, who hadn't budged from where he was standing, back against the back wall, and without saying a word. He was taking quick puffs of his cigarette\u2014I will say that\u2014like he already had an inkling of what the rest of us would see clear enough later on. The Yardmaster\u2014straight and bloody, and the wind from that jeering mob behind him\u2014was getting pushed and shoved back to Rosendo. Whistled at, beaten, spit on, as soon as he came face to face with Rosendo, he spoke. He looked at him and he wiped off his face with his arm, and he said this:"],[30,77,"Dahlmann did not find it strange that the storekeeper should know his name by now but he sensed that the man's conciliatory words actually made the situation worse. Before, the men's provocation had been directed at an accidental face, almost at nobody; now it was aimed at him, at his name, and the men at the other table would know that name. Dahlmann brushed the storekeeper aside, faced the laborers, and asked them what their problem was."],[84,30,"I didn't know what to do. But Ferrari, who was just coming out of his house, stepped in. He stood face to face with one who'd spoken, and he said:"]],[[9,99,"\"I'm Francisco Real, from up on the Northside. Francisco Real, and they call me the Yardmaster. I've let these poor sons of bitches lift their hands to me because what I'm looking for is a man. There are people out there\u2014I figure they're just talkers, you know\u2014saying there's some guy down here in these boondocks that fancies himself a knife fighter, and a bad'un\u2014say he's called the Sticker. I'd like to make his acquaintance, so he could show me\u2014 me being nobody, you understand\u2014what it means to be a man of courage, a man you can look up to.\""],[84,215,"To save me from the spot that put me in, my mother corrected her: \"I would say, rather, a ruffian who won't allow competition.\" I don't know how to explain it to you. Today I've carved out a place for myself. I have this bookstore that I enjoy and whose books I read; I have friendships, like ours; I have my wife and children; I've joined the Socialist Party\u2014I'm a good Argentine and a good Jew. I am respected and respectable. The man you see now is almost bald; at that time I was a poor Jewish kid with red hair in a tough neighborhood on the outskirts of the city. People looked askance at me. I tried, as all young fellows do, to be like everyone else. I had started calling myself Santiago to make the Jacob go away, but there was nothing I could do about the Fischbein. We all come to resemble the image others have of us; I sensed people's contempt for me, and I felt contempt for myself as well. At that time, and especially in that setting, it was important to be brave; I knew myself to be a coward. Women intimidated me; deep down, I was ashamed of my fainthearted chastity. I had no friends my own age."],[96,371,"My name is Alexander Ferri. There are martial echoes in the name, but neither the trumpets of glory nor the great shadow of the Macedonian (the phrase is borrowed from the author of Los m\u00e1rmoles, whose friendship I am honored to claim) accord very well with the gray, modest man who weaves these lines on the top floor of a hotel on Calle Santiago del Estero in a Southside that's no longer the Southside it once was. Any day now will mark the anniversary of my birth more than seventy years ago; I am still giving English lessons to very small classes of students. Indecisiveness or oversight, or perhaps other reasons, led to my never marrying, and now I am alone. I do not mind solitude; after all, it is hard enough to live with oneself and one's own peculiarities. I can tell that I am growing old; one unequivocal sign is the fact that I find novelty neither interesting nor surprising, perhaps because I see nothing essentially new in it\u2014it's little more than timid variations on what's already been. When I was young, I was drawn to sunsets, slums, and misfortune; now it is to mornings in the heart of the city and tranquility. I no longer play at being Hamlet. I have joined the Conservative Party and a chess club, which I attend as a spectator\u2014sometimes an absentminded one. The curious reader may exhume, from some obscure shelf in the National Library on Calle M\u00e9xico, a copy of my book A Brief Examination of the Analytical Language of John Wilkins, a work which ought to be republished if only to correct or mitigate its many errors. The new director of the library, I am told, is a literary gentleman who has devoted himself to the study of antique languages, as though the languages of today were not sufficiently primitive, and to the demagogical glorification of an imaginary Buenos Aires of knife fighters. I have never wished to meet him. I arrived in this city in 1899, and fate has brought me face to face with a knife fighter, or an individual with a reputation as one, exactly once. Later, if the occasion presents itself, I will relate that incident."]],[[9,86,"He said that, and he never took his eyes off him. Now a sticker for real glinted in his right hand\u2014no doubt he'd had it up his sleeve the whole time. All around, the fellows that had been pushing to get close started backing away, and every one of us was looking at the two of them, and you could have heard a pin drop. Why, even the black gentleman that played the violin, a blind man he was, he had his face turned that way."],[28,30,"Without raising his eyes from the guitar, where he seemed to be looking for something, the black man spoke. \"I knew I could count on you, sir,\" he softly said."],[101,32,"He plucked at the harp's strings as though tuning them, and then very softly repeated the word that I wish I might have caught, but did not. Someone reverently said Now, meaningless."]],[[9,70,"Right up next to the roof there was this long kind of window that looked out over the creek. Rosendo took the knife in his two hands and he seemed to be trying to place it, like he didn't recognize it. Then all of a sudden he reared back and flung that knife straight through the window, out into the Maldonado. I felt a cold chill run down my spine."],[85,215,"I had borrowed a knife. We walked down toward the Maldonado, slow, watching each other. He was a few years older than I was; he and I had practiced knife fighting together lots of times, and I had a feeling I was going to get positively gutted. I was walking down the right-hand side of the alley, and him down the left. Suddenly, he tripped over some big chunks of cement that were lying there. The second he tripped, I jumped him, almost without thinking about it. I cut his cheek open with one slash, then we locked together\u2014there was a second when anything could've happened\u2014 and then I stabbed him once, which was all it took.... It was only sometime later that I realized he'd left his mark on me, too\u2014scratches, though, that was about it. I learned that night that it isn't hard to kill a man, or get killed yourself. The creek was down; to keep the body from being found too soon, I half-hid it behind a brick kiln. I was so stunned I suppose I just stopped thinking, because I slipped off the ring Garmendia always wore and put it on. Then I straightened my hat and went back to the bar. I walked in as easy as you please."],[87,60,"Driven by hatred, madness\u2014perhaps, who knows, even love\u2014she had slipped out the back door, made her way through one street after another in the night, and come at last to the house. Then, with those big bony hands, she had plunged the dagger into his chest. The dagger was Mura\u00f1a, it was the dead man that she went on loving."]],[[9,51,"\"Seems like you're always in the way, asshole,\" he muttered as he passed by me\u2014I couldn't say whether to get it off his chest or because he had his mind on something else. He took the direction where it was darkest, down along the Maldonado; I never saw the man again."],[85,33,"He went off to get killed, and he got himself killed right honorably, too\u2014man to man. I'd done the best I could, I'd given him a friend's advice, but I still felt guilty."],[99,72,"I must have said something in return, but he paid me no further mind. A man was letting himself down the wall. In one movement, the sergeant ran him through with the bayonet. The man fell to the ground, where he lay on his back, whimpering and bleeding. That dog came to my mind. The sergeant stabbed the man good with the bayonet again, to finish him off once and for all."]],[[9,115,"I stood there looking at the things I'd been seeing all my life\u2014a sky that went on forever, the creek flowing angry-like down below there, a sleeping horse, the dirt street, the kilns\u2014and I was struck by the thought that I was just another weed growing along those banks, coming up between the soap-worts and the bone piles of the tanneries. What was supposed to grow out of trash heaps if it wa'n't us? \u2014We was big talkers, but soft when it came to a fight, all mouth and no backbone. Then I told myself it wa'n't like that\u2014 the tougher the neighborhood, the tougher a man necessarily had to be. A trash heap? \u2014"],[85,100,"Things happen to a man, you see, and a man only understands them as the years go by. What happened to me that night had been waiting to happen for a long time. I was brought up in the neighborhood of the Maldonado, out beyond Floresta. It was one big open sewage ditch back then, if you know what I mean, but fortunately they've run sewer lines in there now. I've always been of the opinion that nobody has the right to stand in the way of progress. You just do the best you can with the hand you're dealt...."],[105,62,"I am a woodcutter. My name doesn't matter. The hut I was born in, and where I'm soon to die, sits at the edge of the woods. They say these woods go on and on, right to the ocean that surrounds the entire world; they say that wooden houses like mine travel on that ocean. I wouldn't know; I've never seen it."]],[[9,75,"The milonga was having itself a ball, there was plenty of racket in the houses, and the wind brought the smell of honeysuckle. The night was pretty, but so what? There were enough stars that you got dizzy lookin' at 'em, one on top of another up there. I struggled, I tell you, to make myself feel like none of what had happened meant anything to me, but Rosendo's turning tail, that stranger's insufferable bullying"],[20,162,"The road dropped and forked as it cut through the now-formless meadows. A keen and vaguely syllabic song, blurred by leaves and distance, rain, and I went on the gentle mists of breeze. I was struck by the thought that a man may be the enemy of other men, the enemy of other men's other moments, yet not be the enemy of a country\u2014of fireflies, words, gardens, water-courses, zephyrs. It was amidst such thoughts that I came to a high rusty gate. Through the iron bars I made out a drive lined with poplars, and a gazebo of some kind. Suddenly, I realised two things\u2014the first trivial, the second almost incredible: the music I had heard was coming from that gazebo, or pavillion, and the music was Chinese. That was why unconsciously I had fully given myself over to it. I do not recall whether there was a bell or whether I had to clap my hands to make my arrival known."],[96,175,"Something of what we glimpsed that night remains\u2014the reddish wall of the Recoleta, the yellow wall of the prison, two men on a street corner dancing the tango the way the tango was danced in the old days, a checker-board entryway and a wrought-iron fence, the railings of the railroad station, my house, a market, the damp and unfathomable night\u2014but none of these fleeting things (which may well have been others) matters. What matters is having felt that that institution of ours, which more than once we had made jests about, truly and secretly existed, and that it was the universe and ourselves. With no great hope, through all these years I have sought the savor of that night; once in a great while I have thought I caught a snatch of it in a song, in lovemaking, in uncertain memory, but it has never fully come back to me save once, one early morning, in a dream. By the time we'd sworn we would tell none of this to anyone, it was Saturday morning."],[97,46,"That evening I passed by the Red House. The gate in the fence was locked, and some iron bars had been twisted around it. What had been the garden was now weeds. Off to the right there was a shallow ditch, and its banks were trampled."]],[[9,33,"Outside we heard a woman crying, and then a voice that was familiar in a way, but calm, almost too calm, as though it didn't belong to a real person, saying to her:"],[36,42,"Emma Zunz's tone of voice was real, her shame was real, her hatred was real. The outrage that had been done to her was real, as well; all that was false were the circumstances, the time, and one or two proper names."],[95,35,"The pronouncement was an attempt at wit, and I sensed this wasn't the first time she'd voiced it. I later learned that it was not like her\u2014but what we say is not always like us."]],[[9,82,"\"A dead man, my friend,\" said the Yardmaster then. His face was like a drunkard's. He came in, and he took a few unsteady steps into the clearing that we all made for him, like we had before. He stood there tall, and unseeing, and then he toppled like a post. One of the boys that had come with him turned him over on his back and put his poncho under his head for a pillow. The boy's hands came away bloody."],[30,142,"At one table some rough-looking young men were noisily eating and drinking; at first Dahlmann didn't pay much attention. On the floor, curled against the bar, lay an old man, as motionless as an object. The many years had worn him away and polished him, as a stone is worn smooth by running water or a saying is polished by generations of humankind. He was small, dark, and dried up, and he seemed to be outside time, in a sort of eternity. Dahlmann was warmed by the tightness of the man's hairband, the baize poncho he wore, his gaucho trousers, and the boots made out of the skin of a horse's leg, and he said to himself, recalling futile arguments with people from districts in the North, or from Entre R\u00edos, that only in the South did gauchos like that exist anymore."],[46,203,"At my feet, on the threshold of this house, as motionless as an inanimate thing, a very old man lay curled up on the ground. I shall describe him, because he is an essential part of the story. His many years had reduced and polished him the way water smooths and polishes a stone or generations of men polish a proverb. He was covered in long tatters, or so it looked to me, and the turban that wound about his head looked frankly like one rag the more. In the fading evening light, he lifted his dark face and very white beard to me. I spoke to him without preamble\u2014because I had already lost all hope, you see\u2014about David Alexander Glencairn. He didn't understand me (or perhaps he didn't hear me) and I had to explain that Glencairn was a judge and that I was looking for him. When I uttered those words, I felt how absurd it was to question this ancient little man for whom the present was scarcely more than an indefinite rumor. News of the Mutiny or the latest word of Akbar, this man might have (I thought), but not of Glencairn. What he told me confirmed that suspicion."]],[[9,161,"That was when we saw that he had a big knife wound in his chest; his blood was pooling up and turnin' black this bright red neckerchief he was wearing, but that I hadn't noticed before because his shawl had covered it. To try to stop the blood, one of the girls brought over some rotgut and scorched rags. He was in no condition to tell us what'd happened, and La Lujanera was looking at him sort of vacant-like, with her arms just hanging down at her sides. Everybody was asking her what happened with their eyes, and finally she managed to find her voice. She said that after she'd gone outside with the Yardmaster there, they went off to a little vacant lot, and just then a stranger appeared and desperately called out the Yardmaster to fight, and he stabbed him, gave him that wound there, and she swore she didn't know who the man was, but it wa'n't Rosendo."],[30,152,"From out of a corner, the motionless old gaucho in whom Dahlmann had seen a symbol of the South (the South that belonged to him) tossed him a naked dagger\u2014it came to rest at Dahlmann's feet. It was as though the South itself had decided that Dahlmann should accept the challenge. Dahlmann bent to pick up the dagger, and as he did he sensed two things: first, that that virtually instinctive action committed him to fight, and second, that in his clumsy hand the weapon would serve less to defend him than to justify the other man's killing him. He had toyed with a knife now and then, as all men did, but his knowledge of knife fighting went no further than a vague recollection that thrusts should be aimed upward, and with the blade facing inward. They'd never have allowed this sort of thing to happen in the sanatorium, he thought."],[85,250,"There was the usual drunk trying to pick a fight, but I made sure things went the way they were supposed to go. It was early, couldn't have been midnight yet, when the strangers showed up. One of them\u2014they called him the Yardmaster, and he was stabbed in the back and killed that very night, just the way you wrote it, sir\u2014anyway, this one fellow bought a round of drinks for the house. By coincidence this Yardmaster and I were dead ringers for each other. He had something up his sleeve that night: he came up to me and started laying it on pretty thick\u2014he was from up north, he said, and he'd been hearing about me. He couldn't say enough about my reputation. I let him talk, but I was beginning to suspect what was coming, He was hitting the gin hard, too, and I figured it was to get his courage up\u2014and sure enough, pretty soon he challenged me to a fight. That was when it happened\u2014what nobody wants to understand. I looked at that swaggering drunk just spoiling for a fight, and it was like I was looking at myself in a mirror, and all of a sudden I was ashamed of myself. I wasn't afraid of him; if I had been, I might've gone outside and fought him. I just stood there. This other guy, this Yardmaster, who by now had his face about this far from mine, raised his voice so everybody could hear him:"]],[[9,43,"I strolled nice and easy on home to my place, which was about three blocks away. There was a light burning in the window, but then it went out. When I saw that, I can tell you I moved a good bit faster."],[20,103,"A lamp illuminated the platform, but the boys' faces remained within the area of shadow. \"Are you going to Dr. Stephen Albert's house?\" one queried. Without waiting for an answer, another of them said: \"The house is a far way, but you'll not get lost if you follow that road there to the left, and turn left at every crossing.\" I tossed them a coin (my last), went down some stone steps, and started down the solitary road. It ran ever so slightly downhill and was of elemental dirt. Branches tangled overhead, and the low round moon seemed to walk along beside me."],[83,41,"The Nigger's store lay a little south of the Nilsens' place, I believe: they took the Troop Road, then turned off onto a road that was not so heavily traveled. The countryside grew larger and larger as the night came on."]],[[10,231,"I have been told by angels that when Melancthon died, a house was prepared for him like that in which he had lived in the world. This also is done with most of the newcomers, owing to which they do not know that they are not still in the natural world.... The things in his room, also, were all like those he had before, a similar table, a similar desk with compartments, and also a similar library; so that as soon as he awakened from sleep, he seated himself at the table and continued his writing, as if he were not a dead body, and this on the subject of justification by faith alone, and so on for several days, and writing nothing whatever concerning charity. As the angels perceived this, he was asked through messengers why he did not write about charity also. He replied that there was nothing of the church in charity, for if that were to be received as in any way an essential attribute of the church, man would also ascribe to himself the merit of justification and consequently of salvation, and so also he would rob faith of its spiritual essence. He said these things arrogantly, but he did not know that he was dead and that the place to which he had been sent was not heaven. When the angels perceived this, they withdrew...."],[19,138,"3 I repeat: In order for a book to exist, it is sufficient that it be possible. Only the impossible is excluded. For example, no book is also a staircase, though there are no doubt books that discuss and deny and prove that possibility, and others whose structure corresponds to that of a staircase on some shelf in the universe. I pray to the unknown gods that some man\u2014even a single man, tens of centuries ago\u2014has perused and read that book. If the honor and wisdom and joy of such a reading are not to be my own, then let them be for others. Let heaven exist, though my own place be in hell. Let me be tortured and battered and annihilated, but let there be one instant, one creature, wherein thy enormous Library may find its justification."],[97,123,"The dining room and library of my recollections were now (the dividing wall having been torn out) one large ruinous room, with pieces of furniture scattered here and there. I will not attempt to describe them, because in spite of the pitiless white light I am not certain I actually saw them. Let me explain: In order truly to see a thing, one must first understand it. An armchair implies the human body, its joints and members; scissors, the act of cutting. What can be told from a lamp, or an automobile? The savage cannot really perceive the missionary's Bible; the passenger does not see the same ship's rigging as the crew. If we truly saw the universe, perhaps we would understand it."]],[[10,390,"A few weeks after this, the things which he used in his room began to be obscured, and at length to disappear, until at last there was nothing left there but the chair, the table, the paper and the inkstand; and, moreover, the walls of his room seemed to be plastered with lime, and the floor to be covered with a yellow, brick-like material, and he himself seemed to be more coarsely clad. Still, he went on writing, and since he persisted in his denial of charity... he suddenly seemed to himself to be under ground in a sort of workhouse, where there were other theologians like him. And when he wished to go out he was detained.... At this, he began to question his ideas, and he was taken out, and sent back to his former chamber.... When sent back, he appeared clad in a hairy skin, but he tried to imagine that what had gone before had been a mere hallucination, and he went on praising faith and denying charity. One evening at dusk, he felt a chill. That led him to walk through the house, and he realized that the other rooms were no longer those of the dwelling in which he had lived on earth. One room was filled with unknown instruments, another had shrunk so much that he could not enter it; another one had not itself changed, but its windows and doors opened onto great sand dunes. There was a room at the rear of the house in which there were three tables, at which sat men like himself, who also cast charity into exile, and he said that he conversed with them, and was confirmed by them day by day, and told that no other theologian was as wise as he. He was smitten by that adoration, but since some of the persons had no face, and others were like dead men, he soon came to abominate and mistrust them. Then he began to write something about charity; but what he wrote on the paper one day, he did not see the next; for this happens to every one there when he commits any thing to paper from the external man only, and not at the same time from the internal, thus from compulsion and not from freedom; it is obliterated of itself...."],[16,200,"He understood that the task of molding the incoherent and dizzying stuff that dreams are made of is the most difficult work a man can undertake, even if he fathom all the enigmas of the higher and lower spheres\u2014 much more difficult than weaving a rope of sand or minting coins of the faceless wind. He understood that initial failure was inevitable. He swore to put behind him the vast hallucination that at first had drawn him off the track, and he sought another way to approach his task. Before he began, he devoted a month to recovering the strength his delirium had squandered. He abandoned all premeditation of dreaming, and almost instantly managed to sleep for a fair portion of the day. The few times he did dream during this period, he did not focus on his dreams; he would wait to take up his task again until the disk of the moon was whole. Then, that evening, he purified himself in the waters of the river, bowed down to the planetary gods, uttered those syllables of a powerful name that it is lawful to pronounce, and laid himself down to sleep. Almost immediately he dreamed a beating heart."],[26,184,"He had no document but his memory; the fact that he had to learn each hexameter as he added it imposed upon him a providential strictness, unsuspected by those who essay and then forget vague provisional paragraphs. He did not work for posterity, nor did he work for God, whose literary preferences were largely unknown to him. Painstakingly, motionlessly, secretly, he forged in time his grand invisible labyrinth. He re-did the third act twice. He struck out one and another overly obvious symbol\u2014the repeated chimings of the clock, the music. No detail was irksome to him. He cut, condensed, expanded; in some cases he decided the original version should stand. He came to love the courtyard, the prison; one of the faces that stood before him altered his conception of Romerstadt's character. He discovered that the hard-won cacophonies that were so alarming to Flaubert are mere visual superstitions\u2014 weaknesses and irritations of the written, not the sounded, word.... He completed his play; only a single epithet was left to be decided upon now. He found it; the drop of water rolled down his cheek."],[69,164,"For twenty years he inhabited that guided and directed hallucination, but one morning he was overwhelmed with the surfeit and horror of being so many kings that die by the sword and so many unrequited lovers who come together, separate, and melodiously expire. That very day, he decided to sell his theater. Within a week he had returned to his birthplace, where he recovered the trees and the river of his childhood and did not associate them with those others, fabled with mythological allusion and Latin words, that his muse had celebrated. He had to be somebody; he became a retired businessman who'd made a fortune and had an interest in loans, lawsuits, and petty usury. It was in that role that he dictated the arid last will and testament that we know today, from which he deliberately banished every trace of sentiment or literature. Friends from London would visit his re-treat, and he would once again play the role of poet for them."],[81,177,"The death throes done, he lay now alone\u2014 alone and broken and rejected\u2014 and then he sank into sleep. When he awoke, there awaited him his commonplace habits and the places of his everyday existence. He told himself that he shouldn't think too much about the night before, and, cheered by that resolve, he unhurriedly dressed for work. At the office, he got through his duties passably well, though with that uneasy sense (caused by weariness) of repeating things he'd already done. He seemed to notice that the others turned their eyes away; perhaps they already knew that he was dead. That night the nightmares began; he was left without the slightest memory of them\u2014just the fear that they'd return. In time, that fear prevailed; it came between him and the page he was supposed to write, the books he tried to read. Letters would crawl about on the page like ants; faces, familiar faces, gradually blurred and faded, objects and people slowly abandoned him. His mind seized upon those changing shapes in a frenzy of tenacity."]],[[10,468,"THE CHAMBER OF STATUES In the early days, there was a city in the kingdom of the Andalusians where their monarchs lived and its name was Labtayt, or Ceuta, or Ja\u00e9n. In that city, there was a strong tower whose gate (of two portals breadth) was neither for going in nor for coming out, but for keeping closed. And whenever a King died and another King took the Kingship after him, with his own hands, he set a new and strong lock to that gate, till there were four-and-twenty locks upon the tower, according to the number of Kings. After this time, there came to the throne an evil man, who was not of the old royal house, and instead of setting a new lock, he had a mind to open these locks, that he might see what was within the tower. The grandees of his kingdom forbade him this and pressed him to desist and reproved him and blamed him; they hid from him the iron key ring and told him that it was much easier to add a new lock to the gate than to force four-and-twenty, but he persisted, saying, \"Needs must this place be opened.\" Then they offered him all that their hands possessed of monies and treasures and things of price, of flocks, of Christian idols, of gold and silver, if he would but refrain; still, he would not be baulked, and said \"There is no help for it but I open this tower.\" So he pulled off the locks with his right hand (which will now burn through all eternity) and entering, found within the tower figures of Arabs on their horses and camels, habited in turbands hanging down at the ends, with swords in baldrick-belts thrown over their shoulders and bearing long lances in their hands. All these figures were round, as in life, and threw shadows on the ground; a blind man could identify them by touch, and the front hooves of their horses did not touch the ground yet they did not fall, as though the mounts were rearing. These exquisite figures filled the king with great amazement; even more wonderful was the excellent order and silence that one saw in them, for every figure's head was turned to the same side (the west) while not a single voice or clarion was heard. Such was the first room in the castle. In the second, the king found the table that belonged to Suleyman, son of David\u2014 salvation be with both of them! This table was carved from a single grass-green emerald, a stone whose occult properties are indescribable yet genuine, for it calms the tempest, preserves the chastity of its wearer, keeps off dysentery and evil spirits, brings favorable outcome to lawsuits, and is of great relief in childbearing."],[43,144,"\"What well may be my earliest memory,\" Dunraven began, \"is Ibn-Hakam on the docks at Pentreath. He was followed by a black man with a lion\u2014undoubtedly the first black man and the first lion I'd ever set eyes upon, with the exception of those lithographs of Bible stories, I suppose. I was just a boy then, but I'll tell you, that savage sun-colored beast and night-colored man didn't make the impression on me that Ibn-Hakam did. He seemed so tall. He was a sallow-skinned fellow, with black eyes and drooping eyelids, an insolent nose, thick lips, a saffron yellow beard, a broad chest, and a silent, self-assured way of walking. When I got home, I said, 'A king has come in a ship.' Later, when the brickmasons went to work, I expanded upon the title a bit and called him the King of Babel."],[44,246,"It is said by men worthy of belief (though Allah's knowledge is greater) that in the first days there was a king of the isles of Babylonia who called together his architects and his priests and bade them build him a labyrinth so confused and so subtle that the most prudent men would not venture to enter it, and those who did would lose their way. Most unseemly was the edifice that resulted, for it is the prerogative of God, not man, to strike confusion and inspire wonder. In time there came to the court a king of the Arabs, and the king of Babylonia (to mock the simplicity of his guest) bade him enter the labyrinth, where the king of the Arabs wandered, humiliated and confused, until the coming of the evening, when he implored God's aid and found the door. His lips offered no complaint, though he said to the king of Babylonia that in his land he had another labyrinth, and Allah willing, he would see that someday the king of Babylonia made its acquaintance. Then he returned to Arabia with his captains and his wardens and he wreaked such havoc upon the kingdoms of Babylonia, and with such great blessing by fortune, that he brought low its castles, crushed its people, and took the king of Babylonia himself captive. He tied him atop a swift-footed camel and led him into the desert. Three days they rode, and then he said to him,"]],[[10,251,"The Arab historian Al-Ishaqi tells the story of this event:\" It is related by men worthy of belief (though only Allah is omniscient and omnipotent and all-merciful and unsleeping) that a man of Cairo was possessed of ample riches and great wealth; but he was so generous and magnanimous that his wealth passed away, save his father's house, and his state changed, and he became utterly destitute, and could not obtain his sustenance save by laborious exertion. And he slept one night, overwhelmed and oppressed, under a fig tree in his garden, and saw in his sleep a person dripping wet who took from his mouth a golden coin and said to him, 'Verily thy fortune is in Persia, in Isfahan: therefore seek it and repair to it.' So he journeyed to Persia, meeting on the way with all the dangers of the desert, and of ships, and of pirates, and of idolaters, and of rivers, and of wild beasts, and of men; and when he at last arrived there, the evening overtook him, and he slept in a mosque. Now there was, adjacent to the mosque, a house; and as Allah (whose name be exalted!) had decreed, a party of robbers entered the mosque, and thence passed to that house; and the people of the house, awaking at the disturbance occasioned by the robbers, raised cries; the neighbors made a cry as well, whereupon the W\u00e1lee came to their aid with his followers, and the robbers fled over the housetops."],[40,427,"The night before, two doubtful words had halted him at the very portals of the Poetics. Those words were \"tragedy\" and \"comedy.\" He had come across them years earlier, in the third book of the Rhetoric; no one in all of Islam could hazard a guess as to their meaning. He had pored through the pages of Alexander of Aphrodisias, compared the translations of the Nestorian Hunayn ibn-Ishaq and Abu-Bash\u00e3r Mata\u2014and he had found nothing. Yet the two arcane words were everywhere in the text of the Poetics\u2014it was impossible to avoid them. Averro\u00ebs laid down his quill. He told himself (without conviction) that what we seek is often near at hand, put away the manuscript of the Tah\u00e3fut, and went to the shelf on which the many volumes of blind ibn-Sina's Moqq\u00e3m, copied by Persian copyists, stood neatly aligned. Of course he had already consulted them, but he was tempted by the idle pleasure of turning their pages. He was distracted from that scholarly distraction by a kind of song. He looked out through the bars of the balcony; there below, in the narrow earthen courtyard, half-naked children were at play. One of them, standing on the shoulders of another, was clearly playing at being a muezzin: his eyes tightly closed, he was chanting the muezzin's monotonous cry, There is no God but Allah. The boy standing motionless and holding him on his shoulders was the turret from which he sang; another, kneeling, bowing low in the dirt, was the congregation of the faithful. The game did not last long\u2014they all wanted to be the muezzin, no one wanted to be the worshippers or the minaret. Averro\u00ebs listened to them arguing in the \"vulgar\" dialect (that is, the incipient Spanish) of the Muslim masses of the Peninsula. He opened Khalil's Kit\u00e3bal-'Ayn and thought proudly that in all of C\u00f3rdoba (perhaps in all of Al-Andalus) there was no other copy of the perfect work\u2014only this one, sent him by Emir Ya'q\u00fcbal-Mansur from Tangier. The name of that port reminded him that the traveler abual-Hasan al-Ash'ari, who had returned from Morocco, was to dine with him that evening at the home of the Qur'anist Faraj. Abu-al-Hasan claimed to have reached the kingdoms of the Sin Empire [China]; with that peculiar logic born of hatred, his detractors swore that he had never set foot in China and that he had blasphemed Allah in the temples of that land. The gathering would inevitably last for hours; Averro\u00ebs hurriedly went back to his work on the Tah\u00e3fut. He worked until dusk."],[41,118,"In the waste and empty hours of the night I am still able to walk through the streets. Dawn often surprises me upon a bench in the Plaza Garay, thinking (or trying to think) about that passage in the Asrar \u00d1ama where it is said that the Zahir is the shadow of the Rose and the rending of the Veil. I link that pronouncement to this fact: In order to lose themselves in God, the Sufis repeat their own name or the ninety-nine names of God until the names mean nothing anymore. I long to travel that path. Perhaps by thinking about the Zahir unceasingly, I can manage to wear it away; perhaps behind the coin is God."],[109,103,"I did not sleep the night of February 10. After a walk that led me far into the dawn, I passed through the gates of the mosque of Wazil Khan. It was the hour at which light has not yet revealed the colors of things. There was not a soul in the courtyard. Not knowing why, I plunged my hands into the water of the fountain of ablutions. Inside the mosque, it occurred to me that God and Allah are two names for a single, inconceivable Being, and I prayed aloud that I be freed from my burden. Unmoving, I awaited some reply."]],[[10,130,"\"And upon this the W\u00e1lee laughed so that his grinders appeared, and said to him, 'O thou of little sense, I saw three times in my sleep a person who said to me, \"Verily a house in Cairo, in such a district, and of such a description, hath in its court a garden, at the lower end of which is a fountain, wherein is wealth of great amount: therefore repair to it and take it.\" But I went not; and thou, through the smallness of they sense, hast journeyed from city to city on account of a thing thou hast seen in sleep, when it was only an effect of confused dreams.'\u2014Then he gave him some money, and said to him, 'Help thyself with this to return to thy city.'"],[43,184,"\"Back in Cornwall, I said the story that you'd told me was a lie. What I meant was this: the facts were true, or might be true, but told in the way you told them, they were clearly humbug. Let me begin with the biggest lie of all, the incredible labyrinth. A fleeing man doesn't hide out in a labyrinth. He doesn't throw up a labyrinth on the highest point on the coast, and he doesn't throw up a crimson-colored labyrinth that sailors see from miles offshore. There's no need to build a labyrinth when the entire universe is one. For the man who truly wants to hide himself, London is a much better labyrinth than a rooftop room to which every blessed hallway in a building leads. That piece of wisdom, which I submit to you this evening, came to me night before last, while we were listening to the rain on the roof of the labyrinth and waiting to be visited by Morpheus. Warned and corrected by it, I chose to ignore those absurd 'facts' of yours and think about something sensible.\""],[44,69,"\"O king of time and substance and cipher of the century! In Babylonia didst thou attempt to make me lose my way in a labyrinth of brass with many stairways, doors, and walls; now the Powerful One has seen fit to allow me to show thee mine, which has no stairways to climb, nor doors to force, nor wearying galleries to wander through, nor walls to impede thy passage.\""]],[[10,36,"\"Hardly had the sun appeared above the horizon when two soldiers entered my cell and conveyed me to the chamber of the Afflicted One, wherein I found awaiting me the incense, the chafing-dish, and the ink."],[22,66,"Without the slightest change of voice, Ireneo told me to come in. He was lying on his cot, smoking. I don't think I saw his face until the sun came up the next morning; when I look back, I believe I recall the momentary glow of his cigarette. His room smelled vaguely musty. I sat down; I told him about my telegram and my father's illness."],[23,98,"The next day, Moon had recovered his composure. He accepted a cigarette and subjected me to a harsh interrogation as to the \"financial resources of our revolutionary party.\" His questions were quite lucid; I told him (truthfully) that the situation was grave. Deep rumblings of gunfire troubled the peace of the south. I told Moon that our comrades were waiting for us. My overcoat and revolver were up in my room; when I returned, I found Moon lying on the sofa, his eyes closed. He thought he had a fever; he pleaded a painful spasm in his shoulder."],[26,104,"From inside his cell, Hladik had thought that when he emerged he would see a maze of galleries, stairways, and wings. Reality was not so rich; he and the soldiers made their way down a single iron staircase into a rearyard. Several soldiers\u2014some with their uniforms unbuttoned\u2014were looking over a motorcycle, arguing about it. The sergeant looked at his watch; it was eight forty-four. They had to wait until nine. Hladik, feeling more insignificant than ill fortuned, sat down on a pile of firewood. He noticed that the soldiers' eyes avoided his own. To make the wait easier, the sergeant handed him a cigarette."],[85,115,"That night I tossed and turned on my bunk all night; I didn't fall asleep till nearly dawn. About the time of early mass, two cops came looking for me. You should have seen the way my mother carried on, may she rest in peace, poor thing. I was dragged off like a criminal. Two days and two nights I sat in that stinking cell. Nobody came to visit me\u2014except for Luis Irala, a true friend if ever there was one. But they wouldn't let him see me. Then one morning the captain sent for me. He was sitting there in his chair; he didn't even look at me at first, but he did speak."]],[[10,247,"Thus day by day did he make demands upon my skill, and thus day by day did I show to him the appearances of this world. That dead man whom I abominate held within his hand all that dead men have seen and all that living men see: the cities, climes, and kingdoms into which this world is divided, the hidden treasures of its center, the ships that sail its seas, its instruments of war and music and surgery, its graceful women, its fixed stars and the planets, the colors taken up by the infidel to paint his abominable images, its minerals and plants with the secrets and virtues which they hold, the angels of silver whose nutriment is our praise and justification of the Lord, the passingout of prizes in its schools, the statues of birds and kings that lie within the heart of its pyramids, the shadow thrown by the bull upon whose shoulders this world is upheld, and by the fish below the bull, the deserts of Allah the Merciful. He beheld things impossible to describe, such as streets illuminated by gaslight and such as the whale that dies when it hears man's voice. Once he commanded me to show him the city men call Europe. I showed him the grandest of its streets and I believe that it was in that rushing flood of men, all dressed in black and many wearing spectacles, that he saw for the first time the Masked One."],[42,273,"And at that, something occurred which I cannot forget and yet cannot communicate\u2014 there occurred union with the deity, union with the universe (I do not know whether there is a difference between those two words). Ecstasy does not use the same symbol twice; one man has seen God in a blinding light, another has perceived Him in a sword or in the circles of a rose. I saw a Wheel of enormous height, which was not before my eyes, or behind them, or to the sides, but everywhere at once. This Wheel was made of water, but also of fire, and although I could see its boundaries, it was infinite. It was made of all things that shall be, that are, and that have been, all intertwined, and I was one of the strands within that allencompassing fabric, and Pedro de Alvarado, who had tortured me, was another. In it were the causes and the effects, and the mere sight of that Wheel enabled me to understand all things, without end. O joy of understanding, greater than the joy of imagining, greater than the joy of feeling! I saw the universe and saw its secret designs. I saw the origins told by the Book of the People. I saw the mountains that rose from the water, saw the first men of wood, saw the water jars that turned against the men, saw the dogs that tore at their faces. I saw the faceless god who is behind the gods. I saw the infinite processes that shape a single happiness, and, understanding all, I also came to understand the writing on the tiger."],[47,525,"Under the step, toward the right, I saw a small iridescent sphere of almost unbearable brightness. At first I thought it was spinning; then I realized that the movement was an illusion produced by the dizzying spectacles inside it. The Aleph was probably two or three centimeters in diameter, but universal space was contained inside it, with no diminution in size. Each thing (the glass surface of a mirror, let us say) was infinite things, because I could clearly see it from every point in the cosmos. I saw the populous sea, saw dawn and dusk, saw the multitudes of the Americas, saw a silvery spider-web at the center of a black pyramid, saw a broken labyrinth (it was London), saw endless eyes, all very close, studying themselves in me as though in a mirror, saw all the mirrors on the planet (and none of them reflecting me), saw in a rear courtyard on Calle Soler the same tiles I'd seen twenty years before in the entryway of a house in Fray Bentos, saw clusters of grapes, snow, tobacco, veins of metal, water vapor, saw convex equatorial deserts and their every grain of sand, saw a woman in Inverness whom I shall never forget, saw her violent hair, her haughty body, saw a cancer in her breast, saw a circle of dry soil within a sidewalk where there had once been a tree, saw a country house in Adrogu\u00e9, saw a copy of the first English translation of Pliny (Philemon Holland's), saw every letter of every page at once (as a boy, I would be astounded that the letters in a closed book didn't get all scrambled up together overnight), saw simultaneous night and day, saw a sunset in Quer\u00e9taro that seemed to reflect the color of a rose in Bengal, saw my bedroom (with no one in it), saw in a study in Alkmaar a globe of the terraqueous world placed between two mirrors that multiplied it endlessly, saw horses with wind-whipped manes on a beach in the Caspian Sea at dawn, saw the delicate bones of a hand, saw the survivors of a battle sending postcards, saw a Tarot card in a shopwindow in Mirzapur, saw the oblique shadows of ferns on the floor of a greenhouse, saw tigers, pistons, bisons, tides, and armies, saw all the ants on earth, saw a Persian astrolabe, saw in a desk drawer (and the handwriting made me tremble) obscene, incredible, detailed letters that Beatriz had sent Carlos Argentino, saw a beloved monument in Chacarita, saw the horrendous remains of what had once, deliciously, been Beatriz Viterbo, saw the circulation of my dark blood, saw the coils and springs of love and the alterations of death, saw the Aleph from everywhere at once, saw the earth in the Aleph, and the Aleph once more in the earth and the earth in the Aleph, saw my face and my viscera, saw your face, and I felt dizzy, and I wept, because my eyes had seen that secret, hypothetical object whose name has been usurped by men but which no man has ever truly looked upon: the inconceivable universe."],[100,55,"On yet another I saw walls of fire. On the most remote of all, there was a vaulted river that hung from the sky, and in its waters swam fish and sailing ships. Those were marvels, but they do not compare with your poem, which somehow contains them all. What sorcery has given you this?\""],[101,116,"\"The stars were still in the sky. We traveled through a stretch of land with huts scattered here and there along the way. I had heard tales of pyramids; what I saw in the first square we came to was a stake of yellow wood. On its sharp point I could make out the black figure of a fish. Orm, who had accompanied us, told me that the fish was the Word. In the next square I saw a red stake, with a disk. Orm said once more that this was the Word. I asked him to tell me what word it was; he replied that he was but a simple artisan, and did not know."]],[[10,112,"\"From that time forth, that figure, sometimes in the dress of the Sudanese, sometimes in uniform, but ever with a veil upon its face, crept always into the visions. Though it was never absent, we could not surmise who it might be. And yet the appearances within the mirror of ink, at first momentary or unmoving, became now more complex; they would unhesitatingly obey my commands, and the tyrant could clearly follow them. In these occupations, both of us, it is true, sometimes became exhausted. The abominable nature of the scenes was another cause of weariness; there was nothing but tortures, garrotes, mutilations, the pleasures of the executioner and the cruel man."],[20,45,"From that moment on, I felt all about me and within my obscure body an invisible, intangible pullulation\u2014not that of the divergent, parallel, and finally coalescing armies, but an agitation more inaccessible, more inward than that, yet one those armies somehow prefigured. Albert went on:"],[34,38,"When I read the story of this warrior in Croce's book, I found myself enormously moved, and I was struck by the sense that I was recovering, under a different guise, something that had once been my own."]],[[12,54,"The eight stories in this book require no great elucidation. The eighth (\"The Garden of Forking Paths\") is a detective story; its readers will witness the commission and all the preliminaries of a crime whose purpose will not be kept from them but which they will not understand, I think, until the final paragraph."],[18,166,"But it is not the worlds proposed by April March that are regressive, it is the way the stories are told\u2014regressively and ramifying, as I have said. The book is composed of thirteen chapters. The first reports an ambiguous conversation between several unknown persons on a railway station platform. The second tells of the events of the evening that precedes the first. The third, likewise retrograde, tells of the events of another, different, possible evening before the first; the fourth chapter relates the events of yet a third different possible evening. Each of these (mutually exclusive) \"eveningsbefore\" ramifies into three further \"eveningsbefore,\" all quite different. The work in its entirety consists, then, of nine novels; each novel, of three long chapters. (The first chapter is common to all, of course.) Of those novels, one is symbolic; another, supernatural; another, a detective novel; another, psychological; another, a Communist novel; another, anti-Communist; and so on. Perhaps the following symbolic representation will help the reader understand the novel's structure:"],[20,202,"Almost instantly, I saw it\u2014the garden of forking paths was the chaotic novel; the phrase 'several futures (not all)' suggested to me the image of a forking in time, rather than in space. A full rereading of the book confirmed my theory. In all fictions, each time a man meets diverse alternatives, he chooses one and eliminates the others; in the work of the virtually impossible-to-disentangle Ts'ui Pen, the character chooses\u2014 simultaneously\u2014all of them. He creates, thereby, 'several futures,' several times, which themselves proliferate and fork. That is the explanation for the novel's contradictions. Fang, let us say, has a secret; a stranger knocks at his door; Fang decides to kill him. Naturally, there are various possible outcomes\u2014Fang can kill the intruder, the intruder can kill Fang, they can both live, they can both be killed, and so on. In Ts'ui Pen's novel, all the outcomes in fact occur; each is the starting point for further bifurcations. Once in a while, the paths of that labyrinth converge: for example, you come to this house, but in one of the possible pasts you are my enemy, in another my friend. If you can bear my incorrigible pronunciation, we shall read a few pages.\""],[21,37,"Of \"The South,\" which may be my best story, I shall tell the reader only that it is possible to read it both as a forthright narration of novelistic events and in quite another way, as well."]],[[13,114,"Some limited and waning memory of Herbert Ashe, an engineer for the Southern Railway Line, still lingers in the hotel at Adrogu\u00e9, among the effusive honeysuckle vines and in the illusory depths of the mirrors. In life, Ashe was afflicted with unreality, as so many Englishmen are; in death, he is not even the ghost he was in life. He was tall and phlegmatic and his weary rectangular beard had once been red. I understand that he was a widower, and without issue. Every few years he would go back to England, to make his visit (I am judging from some photographs he showed us) to a sundial and a stand of oak trees."],[22,57,"He was such a proud young man that he pretended that his disastrous fall had actually been fortunate\u2014 Twice I saw him, on his cot behind the iron-barred window that crudely underscored his prisoner-like state\u2014once lying motionless, with his eyes closed; the second time motionless as well, absorbed in the contemplation of a fragrant switch of artemisia."],[30,131,"Tomorrow I will wake up at my ranch, he thought, and it was as though he were two men at once: the man gliding along through the autumn day and the geography of his native land, and the other man, imprisoned in a sanatorium and subjected to methodical attentions. He saw unplastered brick houses, long and angular, infinitely watching the trains go by; he saw horsemen on the clod-strewn roads; he saw ditches and lakes and pastures; he saw long glowing clouds that seemed made of marble, and all these things were fortuitous, like some dream of the flat prairies. He also thought he recognized trees and crops that he couldn't have told one the name of\u2014 his direct knowledge of the country was considerably inferior to his nostalgic, literary knowledge."]],[[13,142,"It is no exaggeration to say that the classical culture outlines composed of a single discipline\u2014psychology\u2014to which all others are subordinate. I have said that the people of that planet conceive the universe as a series of mental processes that occur not in space but rather successively, in time. Spinoza endows his inexhaustible deity with the attributes of spatial extension and of thought; no one in Tl\u00f6n would understand the juxtaposition of the first, which is typical only of certain states, and the second\u2014 which is a perfect synonym for the cosmos. Or to put it another way: space is not conceived as having duration in time. The perception of a cloud of smoke on the horizon and then the countryside on fire and then the half-extinguished cigarette that produced the scorched earth is considered an example of the association of ideas."],[42,34,"The ambitions and poverty of human words\u2014 all, world, universe\u2014 are but shadows or simulacra of that Word which is the equivalent of a language and all that can be comprehended within a language."],[110,49,"\"I am speaking of that instrument used by the deity to create the heavens and the earth and the invisible paradise in which we exist, but which original sin hides from us. I am speaking of the Word, which is taught to us by the science of the Kabbalah.\""]],[[13,109,"Another school posits that all time has already passed, so that our life is but the crepuscular memory, or crepuscular reflection, doubtlessly distorted and mutilated, of an irrecoverable process. Yet another claims that the history of the universe\u2014and in it, our lives and every faintest detail of our lives\u2014is the handwriting of a subordinate god trying to communicate with a demon. Another, that the universe might be compared to those cryptograms in which not all the symbols count, and only what happens every three hundred nights is actually real. Another, that while we sleep here, we are awake somewhere else, so that every man is in fact two men."],[17,182,"Besides\u2014who will boast of being a mere impostor? The drunken man who blurts out an absurd command, the sleeping man who suddenly awakes and turns and chokes to death the woman sleeping at his side\u2014are they not, perhaps, implementing one of the Company's secret decisions? That silent functioning, like God's, inspires all manner of conjectures. One scurrilously suggests that the Company ceased to exist hundreds of years ago, and that the sacred disorder of our lives is purely hereditary, traditional; another believes that the Company is eternal, and teaches that it shall endure until the last night, when the last god shall annihilate the earth. Yet another declares that the Company is omnipotent, but affects only small things: the cry of a bird, the shades of rust and dust, the half dreams that come at dawn. Another, whispered by masked heresiarchs, says that the Company has never existed, and never will. Another, no less despicable, argues that it makes no difference whether one affirms or denies the reality of the shadowy corporation, because Babylon is nothing but an infinite game of chance."],[31,370,"There is nothing very remarkable about being immortal; with the exception of mankind, all creatures are immortal, for they know nothing of death. What is divine, terrible, and incomprehensible is to know oneself immortal. I have noticed that in spite of religion, the conviction as to one's own immortality is extraordinarily rare. Jews, Christians, and Muslims all profess belief in immortality, but the veneration paid to the first century of life is proof that they truly believe only in those hundred years, for they destine all the rest, throughout eternity, to rewarding or punishing what one did when alive. In my view, the Wheel conceived by certain religions in Hindustan is much more plausible; on that Wheel, which has neither end nor beginning, each life is the effect of the previous life and engenderer of the next, yet no one life determines the whole.... Taught by centuries of living, the republic of immortal men had achieved a perfection of tolerance, almost of disdain. They knew that over an infinitely long span of time, all things happen to all men. As reward for his past and future virtues, every man merited every kindness\u2014yet also every betrayal, as reward for his past and future iniquities. Much as the way in games of chance, heads and tails tend to even out, so cleverness and dullness cancel and correct each other. Perhaps the rude poem of El Cid is the counterweight demanded by a single epithet of the Eclogues or a maxim from Heraclitus. The most fleeting thought obeys an invisible plan, and may crown, or inaugurate, a secret design. I know of men who have done evil in order that good may come of it in future centuries, or may already have come of it in centuries past.... Viewed in that way, all our acts are just, though also unimportant. There are no spiritual or intellectual merits. Homer composed the Odyssey; given infinite time, with infinite circumstances and changes, it is impossible that the Odyssey should not be composed at least once. No one is someone; a single immortal man is all men. Like Cornelius Agrippa,I am god, hero, philosopher, demon, and world\u2014 which is a long-winded way of saying that Aim not."],[61,103,"But there is yet another hypothesis, which is alien to the Spanish mind (even to the Western mind) and which requires a more ancient, more complex, and more timeworn setting. Don Quixote\u2014who is no longer don Quixote but a king of the cycles of Hindustan\u2014senses, as he stands before the body of his enemy, that killing and engendering are acts of God or of magic, which everyone knows transcend the human condition. He knows that death is illusory, as are the bloody sword that lies heavy in his hand, he himself and his entire past life, and the vast gods and the universe."]],[[13,73,"An unsettling coincidence made me a witness to the second intrusion as well. This event took place some months later, in a sort of a country general-store-and-bar owned by a Brazilian man in the Cuchilla Negra. Amorim and I were returning from Sant'Anna. There was a freshet on the Tacuaremb\u00f3; as there was no way to cross, we were forced to try (to try to endure, that is) the rudimentary hospitality at hand."],[41,34,"Drunk with an almost impersonal pity, I wandered through the streets. On the corner of Chile and Tacuari I spotted an open bar-andgeneral-store. In that establishment, to my misfortune, three men were playing truco"],[96,76,"After a long journey upriver and a final crossing on a raft, we stepped one morning onto the eastern shore. Even after all that, we had to pass several nights in poverty-stricken general stores and open and close many a gate in many a stock fence across the Cuchilla Negra. We were riding in a gig; the landscape seemed much larger and more lonely to me than that of the little plot where I was born."]],[[13,48,"Here I end the personal portion of my narration. The rest lies in every reader's memory (if not his hope or fear). Let it suffice to recall, or mention, the subsequent events, with a simple brevity of words which the general public's concave memory will enrich or expand:"],[17,50,"This statement quieted the public's concerns. But it also produced other effects perhaps unforeseen by its author. It profoundly altered both the spirit and the operations of the Company. I have but little time remaining; we are told that the ship is about to sail\u2014but I will try to explain."],[107,36,"I doubt that the hurried notes I have just dictated will exhaust this book, but hope, rather, that the dreams herein will continue to ramify within the hospitable imaginations of the readers who now close it."]],[[13,152,"At any rate, the international press made a great hue and cry about this \"find.\" Handbooks, anthologies, surveys, \"literal translations,\" authorized and pirated reprints of Mankind's Greatest Masterpiece filled the world, and still do. Almost immediately, reality \"caved in\" at more than one point. The truth is, it wanted to cave in. Ten years ago, any symmetry, any system with an appearance of order\u2014dialectical materialism, anti-Semitism, Nazism\u2014could spellbind and hypnotize mankind. How could the world not fall under the sway of Tl\u00f6n, how could it not yield to the vast and minutely detailed evidence of an ordered planet? It would be futile to reply that reality is also orderly. Perhaps it is, but orderly in accordance with divine laws (read: \"inhuman laws\") that we can never quite manage to penetrate. Tl\u00f6n may well be a labyrinth, but it is a labyrinth forged by men, a labyrinth destined to be deciphered by men."],[17,166,"Under the Company's beneficent influence, our customs are now steeped in chance. The purchaser of a dozen amphorae of Damascene wine will not be surprised if one contains a talisman, or a viper; the scribe who writes out a contract never fails to include some error; I myself, in this hurried statement, have misrepresented some splendor, some atrocity\u2014 perhaps, too, some mysterious monotony.... Our historians, the most perspicacious on the planet, have invented a method for correcting chance; it is well known that the outcomes of this method are (in general) trust-worthy\u2014 although, of course, they are never divulged without a measure of deception. Besides, there is nothing so tainted with fiction as the history of the Company....A paleographie document, unearthed at a certain temple, may come from yesterday's drawing or from a drawing that took place centuries ago. No book is published without some discrepancy between each of the edition's copies. Scribes take a secret oath to omit, interpolate, alter. Indirect falsehood is also practiced."],[19,113,"First: The Library has existed ab aeternitate. That truth, whose immediate corollary is the future eternity of the world, no rational mind can doubt. Man, the imperfect librarian, may be the work of chance or of malevolent demiurges; the universe, with its elegant appointments\u2014its bookshelves, its enigmatic books, its indefatigable staircases for the traveler, and its water closets for the seated librarian\u2014can only be the handiwork of a god. In order to grasp the distance that separates the human and the divine, one has only to compare these crude trembling symbols which my fallible hand scrawls on the cover of a book with the organic letters inside\u2014neat, delicate, deep black, and inimitably symmetrical."]],[[14,206,"Thus we begin to see the book's general scheme: The insatiable search for a soul by means of the delicate glimmerings or reflections this soul has left in others\u2014at first, the faint trace of a smile or a word; toward the last, the varied and growing splendors of intelligence, imagination, and goodness. The more closely the men interrogated by the law student have known Al-Mu'tasim, the greater is their portion of divinity, but the reader knows that they themselves are but mirrors. A technical mathematical formula is applicable here: Bahadur's heavily freighted novel is an ascending progression whose final term is the sensed or foreapprehended \"man called Al-Mu'tasim.\" The person immediately preceding Al-Mu'tasim is a Persian bookseller of great courtesy and felicity; the man preceding the bookseller is a saint-----After all those years, the law student comes to a gallery \"at the end of which there is a doorway and a tawdry curtain of many beads, and behind that, a glowing light.\" The law student claps his hands once, twice, and calls out for Al-Mu'tasim. A man's voice\u2014the incredible voice of Al-Mu'tasim\u2014 bids the law student enter. The law student draws back the bead curtain and steps into the room. At that point, the novel ends."],[40,53,"Others, who had come to the same realization, urged abu-al-Hasan to tell a tale of wonder. Then, like now, the world was horrible; daring men might wander through it, but so might wretches, those who fall down in the dust before all things. Abu-al-Hasan's memory was a mirror of secret acts of cowardice."],[43,441,"\"Yes. I shouldn't be surprised that the spiderweb (the universal form of the spiderweb, I mean\u2014the Platonic spiderweb) suggested the crime to the murderer (because there is a murderer). You'll recall that Al-Bokhari, in a tomb, dreamt of a nest of vipers and awoke to discover that a spiderweb had suggested the dream to him. Let's return to that night on which Al-Bokhari dreamt of the tangled nest. The overthrown king and the vizier and the slave are fleeing through the desert with a treasure. They take refuge in a tomb. The vizier\u2014whom we know to be a coward\u2014sleeps; the king\u2014 whom we know to be a brave man\u2014 does not. So as not to have to share the treasure with his vizier, the king stabs him to death; nights later, the murdered man's ghost threatens the king in a dream. None of this is to be believed; in my view, the events occurred exactly the other way around. That night, I believe, it was the king, the brave man, that slept, and Sa'\u00efd, the coward, that lay awake. To sleep is to put the universe for a little while out of your mind, and that sort of unconcern is not easy for a man who knows that unsheathed swords are after him. Sa'\u00efd, a greedy man, watched over the sleep of his king. He thought of killing him, perhaps even toyed with the knife, but he didn't have the courage for it. He called the slave. They hid part of the treasure in the tomb, then fled to Suakin and on to England. Not to hide from Al-Bokhari, you understand, but in fact to lure him to them and kill him\u2014that was what led the vizier to build the high labyrinth of bright crimson walls in full view of the sea. He knew that ships would carry the fame of the slave, the lion, and the scarlet man back to the ports of Nubia, and that sooner or later Al-Bokhari would come to beard him in his labyrinth. The trap was laid in the web's last corridor. Al-Bokhari had infinite contempt for Sa'\u00efd; he would never stoop to take the slightest precaution. The long-awaited day at last arrives; Ibn-Hakam disembarks in England, walks up to the door of the labyrinth, passes through the blind corridors, and has perhaps set his foot upon the first steps of the staircase when his vizier kills him\u2014perhaps with a bullet, I don't know\u2014from the trap door above. Then the slave no doubt killed the lion, and another bullet no doubt killed the slave. Then Sa'\u00efd smashed in the three faces with a large rock."]],[[14,110,"It is generally understood that a modern-day book may honorably be based upon an older one, especially since, as Dr. Johnson observed, no man likes owing anything to his contemporaries. The repeated but irrelevant points of congruence between Joyce's Ulysses and Homer's Odyssey continue to attract (though I shall never understand why) the dazzled admiration of critics. The points of congruence between Bahadur's novel and Far\u00eed al-d\u00een Attar's classic Conference of the Birds meet with the no less mysterious praise of London, and even of Allahabad and Calcutta. There are other debts, as well. One investigator has documented certain analogies between the first scene of the novel and Kipling's story"],[15,89,"Menard has (perhaps unwittingly) enriched the slow and rudimentary art of reading by means of a new technique\u2014the technique of deliberate anachronism and fallacious attribution. That technique, requiring infinite patience and concentration, encourages us to read the Odyssey as though it came after the AEneid, to read Mme. Henri Bachelier's Le jardin du Centaure as though it were written by Mme. Henri Bachelier. This technique fills the calmest books with adventure. Attributing the Imitatio Christi to Louis FerdinandC\u00e9lineor James Joyce\u2014is that not sufficient renovation of those faint spiritual admonitions?"],[47,82,"\"A stanza interesting from every point of view,\" he said. \"The first line wins the kudos of the learned, the academician, the Hellenist\u2014 though perhaps not that of those would-be scholars that make up such a substantial portion of popular opinion. The second moves from Homer to Hesiod (implicit homage, at the very threshold of the dazzling new edifice, to the father of didactic poetry), not without revitalizing a technique whose lineage may be traced to Scripture\u2014that is, enumeration, congeries, or conglobation."]],[[15,50,"[1 Mme. Henri Bachelier also lists a literal translation of Quevedo's literal translation of St. Francis de Sales's Introduction \u00e0 la vie d\u00e9vote. In Pierre Menard's library there is no trace of such a work. This must be an instance of one of our friend's droll jokes, misheard or misunderstood.]"],[94,141,"In our house there's a silver mate cup with a base of serpents that our great-grandfather brought from Peru. There's also a silver washbasin that was hung from the saddle. In the wardrobe closet in your room, there are two rows of books: the three volumes of Lane's translation of the Thousand and One Nights \u2014 which Lane called The Arabian Nights Entertainment \u2014with steel engravings and notes in fine print between the chapters, Quicherat's Latin dictionary, Tacitus' Germania in Latin and in Gordon's English version, a Quixote in the Gamier edition, a copy of Rivera Indarte's Tablas de sangre signed by the author, Carlyle's Sartor Resartus, a biography of Amiel, and, hidden behind the others, a paperbound volume detailing the sexual customs of the Balkans. Nor have I forgotten a certain afternoon in a second-floor apartment on the Plaza Dubourg.\""],[106,57,"\"In this house,\" I replied, not without a somewhat stiff, pedantic note, \"there are several English Bibles, including the first one, Wyclif's. I also have Cipriano de Valera's, Luther's (which is, in literary terms, the worst of the lot), and a Latin copy of the Vulgate. As you see, it isn't exactly Bibles I might be needing.\""]],[[15,224,"Two texts, of distinctly unequal value, inspired the undertaking. One was that philological fragment by Novalis\u2014number 2005 in the Dresden edition, to be precise\u2014which outlines the notion of total identification with a given author. The other was one of those parasitic books that set Christ on a boulevard,
